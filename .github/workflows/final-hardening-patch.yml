name: Final Zero Cost Hardening Patch

on:
  push:
    branches:
      - fix/final-zero-cost-hardening
    paths:
      - .github/workflows/final-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-zero-cost-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply zero-cost hardening
        run: python .github/scripts/final-hardening-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Verify hardening
        run: |
          npm run lint
          npm run test
          npm run build
          npx --yes npm@latest audit --no-package-lock --audit-level=moderate
      - name: Commit verified hardening
        shell: bash
        run: |
          # This temporary workflow commits only after all verification gates pass.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml src/legacy/originProviderClient.ts src/legacy/originProviderStreamClient.ts src/legacy/originProviderClient.gemini.test.ts src/legacy/openRouterFreeTierGate.ts src/legacy/openRouterFreeTierGate.test.ts
          git commit -m "fix: enforce free-tier account and remove secondary inference"
          git push origin HEAD:fix/final-zero-cost-hardening
