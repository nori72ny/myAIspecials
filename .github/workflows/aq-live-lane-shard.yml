name: AQ live unified lane quota shard

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aq-live-lane-shard.yml'
      - 'scripts/select-aq-lane-shard.ts'
      - 'scripts/check-aq-live-quota-guard.mjs'
      - 'scripts/run-aq-official-local-comparison.ts'
      - 'src/lib/orchestration/OriginAnswerQualityBenchmarkLaneShardSelector.ts'
      - 'src/lib/orchestration/OriginAnswerQualityBenchmarkEnvironmentProof.ts'
      - 'src/lib/orchestration/OriginAnswerQualityBenchmarkRuntimeReadiness.ts'
      - 'src/lib/orchestration/OriginAnswerQualityBenchmarkSession.ts'
      - 'src/lib/orchestration/OriginAnswerQualityOfficialShardComparison.ts'
      - 'src/lib/orchestration/OriginAnswerQualityBenchmarkQuotaPlan.ts'
      - 'package.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: origin-aq-live-unified-lane-shard
  cancel-in-progress: false

jobs:
  compare:
    if: startsWith(github.event.pull_request.head.ref, 'ci/aq-live-lane-')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BASELINE_SHA: f0c1bff22d3246d3eac3903b9def5d3aa7c1e498
      CANDIDATE_SHA: 34415fc8edcd95b293526096486e270a8251f5cb
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ORIGIN_AQ_BASELINE_PORT: '4611'
      ORIGIN_AQ_CANDIDATE_PORT: '4612'

    steps:
      - name: Resolve requested lane
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_HEAD_REF}"
          case "$ref" in
            ci/aq-live-lane-research-*) lane=research ;;
            ci/aq-live-lane-chat-*) lane=chat ;;
            ci/aq-live-lane-coding-*) lane=coding ;;
            ci/aq-live-lane-artifact-*) lane=artifact ;;
            *)
              echo "Unsupported live AQ lane branch."
              exit 1
              ;;
          esac
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

      - name: Checkout quota guard exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: guard
          persist-credentials: false

      - name: Enforce global 24-hour live quota guard
        id: quota_guard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node guard/scripts/check-aq-live-quota-guard.mjs

      - name: Create sanitized quota reservation
        if: steps.quota_guard.outputs.allowed == 'true'
        shell: bash
        env:
          AQ_LANE: ${{ steps.lane.outputs.lane }}
        run: |
          set -euo pipefail
          mkdir -p aq-quota
          node <<'NODE'
          const fs = require('fs');
          const value = {
            schemaVersion: 'origin.aq-live-quota-reservation.v1',
            runId: process.env.GITHUB_RUN_ID,
            lane: process.env.AQ_LANE,
            candidateSha: process.env.CANDIDATE_SHA,
            createdAt: new Date().toISOString(),
          };
          fs.writeFileSync('aq-quota/reservation.json', JSON.stringify(value) + '\n', { mode: 0o600 });
          NODE

      - name: Reserve 24-hour provider quota
        if: steps.quota_guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aq-live-quota-reservation
          path: aq-quota/reservation.json
          if-no-files-found: error
          retention-days: 2
      - name: Checkout frozen baseline
        if: steps.quota_guard.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false

      - name: Checkout validated candidate exact SHA
        if: steps.quota_guard.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false

      - name: Set up Node 24
        if: steps.quota_guard.outputs.allowed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            baseline/package-lock.json
            candidate/package-lock.json

      - name: Install exact dependencies
        if: steps.quota_guard.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && npm ci --ignore-scripts)
          (cd candidate && npm ci --ignore-scripts)

      - name: Verify credential boundary
        if: steps.quota_guard.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"

      - name: Select deterministic lane-only shard
        if: steps.quota_guard.outputs.allowed == 'true'
        id: shard
        working-directory: candidate
        shell: bash
        env:
          AQ_LANE: ${{ steps.lane.outputs.lane }}
        run: |
          set -euo pipefail
          shard_index="$(npx tsx scripts/select-aq-lane-shard.ts "$AQ_LANE")"
          test "$shard_index" -ge 0
          echo "index=$shard_index" >> "$GITHUB_OUTPUT"

      - name: Run exact-SHA lane shard comparison
        if: steps.quota_guard.outputs.allowed == 'true'
        working-directory: candidate
        shell: bash
        env:
          ORIGIN_AQ_SHARD_INDEX: ${{ steps.shard.outputs.index }}
          ORIGIN_AQ_BASELINE_ROOT: ${{ github.workspace }}/baseline
          ORIGIN_AQ_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          ORIGIN_AQ_BASELINE_SHA: ${{ env.BASELINE_SHA }}
          ORIGIN_AQ_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          ORIGIN_AQ_OUTPUT_PATH: ${{ github.workspace }}/aq-results/lane-shard.json
        run: |
          set -euo pipefail
          npm run eval:aq-local-comparison-shard

      - name: Inspect sanitized lane shard output
        if: steps.quota_guard.outputs.allowed == 'true' && always()
        shell: bash
        env:
          AQ_LANE: ${{ steps.lane.outputs.lane }}
          BASELINE_SHA: ${{ env.BASELINE_SHA }}
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          if [ ! -s aq-results/lane-shard.json ]; then
            echo "No sanitized shard result file was produced."
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('aq-results/lane-shard.json', 'utf8');
          const value = JSON.parse(raw);
          const forbidden = ['answerText','"prompt"','"messages"','chain-of-thought','OPENROUTER_API_KEY'];
          if (forbidden.some((needle) => raw.includes(needle))) process.exit(1);
          if (value?.schemaVersion !== 'origin.aq-local-shard-result.v1') process.exit(1);

          const laneCategories = {
            research: new Set(['current-factual','multi-source-comparison','contradiction-detection']),
            chat: new Set(['professional-advice','user-document','fail-closed','multi-turn-context']),
            coding: new Set(['coding-generation','coding-repair']),
            artifact: new Set(['artifact-generation']),
          };
          const allowed = laneCategories[process.env.AQ_LANE];
          if (!allowed) process.exit(1);

          if (value?.ok === true) {
            const shard = value?.shard;
            if (shard?.schemaVersion !== 'origin.aq-official-shard-comparison.v1') process.exit(1);
            if (!/^sha256:[a-f0-9]{64}$/.test(String(shard?.shardDigest || ''))) process.exit(1);
            if (shard?.baselineGitSha !== process.env.BASELINE_SHA) process.exit(1);
            if (shard?.candidateGitSha !== process.env.CANDIDATE_SHA) process.exit(1);
            for (const side of ['baselineObservations','candidateObservations']) {
              if (!Array.isArray(shard?.[side]) || shard[side].length === 0) process.exit(1);
              if (shard[side].some((x) => !allowed.has(x.category))) process.exit(1);
            }
          } else {
            if (typeof value?.code !== 'string' || !/^AQ_[A-Z0-9_:.-]+$/.test(value.code)) process.exit(1);
            if (value?.detail !== undefined && (typeof value.detail !== 'string' || !/^[A-Z0-9_:.-]+$/.test(value.detail))) process.exit(1);
            if (value?.plannedPairedRequestsMax !== undefined && (!Number.isInteger(value.plannedPairedRequestsMax) || value.plannedPairedRequestsMax < 1 || value.plannedPairedRequestsMax > 50)) process.exit(1);
            for (const key of ['baselineEvaluatorRequests','candidateEvaluatorRequests','evaluatorRequestsTotal']) {
              if (value?.[key] !== undefined && (!Number.isInteger(value[key]) || value[key] < 0)) process.exit(1);
            }
          }
          NODE
          chmod 600 aq-results/lane-shard.json

      - name: Require successful lane shard evidence
        if: steps.quota_guard.outputs.allowed == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          node -e "const v=require('./aq-results/lane-shard.json'); if(v?.ok!==true) process.exit(1)"

      - name: Upload sanitized lane shard evidence
        if: steps.quota_guard.outputs.allowed == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: aq-live-${{ steps.lane.outputs.lane }}-shard
          path: aq-results/lane-shard.json
          if-no-files-found: warn
          retention-days: 7
