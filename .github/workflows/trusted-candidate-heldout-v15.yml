name: Trusted exact-candidate held-out qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate commit SHA
        required: true
        type: string
      pr_number:
        description: Open same-repository PR whose head must equal candidate_sha
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: write

concurrency:
  group: origin-trusted-candidate-heldout-one-shot
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      task_ids: ${{ steps.binding.outputs.task_ids }}
      task_count: ${{ steps.binding.outputs.task_count }}
      source_digest: ${{ steps.binding.outputs.source_digest }}
      candidate_digest: ${{ steps.binding.outputs.candidate_digest }}
      marker_name: ${{ steps.binding.outputs.marker_name }}
    steps:
      - name: Require trusted default-branch workflow context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          [[ "${{ inputs.candidate_sha }}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${{ inputs.pr_number }}" =~ ^[0-9]+$ ]]

      - name: Validate exact candidate belongs to one open same-repository PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'X-GitHub-Api-Version: 2026-03-10'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"             -o pr.json
          node <<'NODE'
          const fs = require('node:fs');
          const pr = JSON.parse(fs.readFileSync('pr.json', 'utf8'));
          const fail = code => { console.error(code); process.exit(2); };
          if (pr?.state !== 'open') fail('TRUSTED_CANDIDATE_PR_NOT_OPEN');
          if (pr?.base?.ref !== 'main') fail('TRUSTED_CANDIDATE_BASE_INVALID');
          if (pr?.head?.repo?.full_name !== process.env.GITHUB_REPOSITORY) fail('TRUSTED_CANDIDATE_FORK_BLOCKED');
          if (pr?.head?.sha !== process.env.CANDIDATE_SHA) fail('TRUSTED_CANDIDATE_SHA_MISMATCH');
          NODE
          rm -f pr.json

      - name: Checkout trusted evaluator from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Install trusted evaluator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Bind sealed corpus to the exact candidate
        id: binding
        shell: bash
        env:
          ORIGIN_HELDOUT_FINAL_CORPUS_GZIP_B64: ${{ secrets.ORIGIN_HELDOUT_FINAL_CORPUS_GZIP_B64 }}
          ORIGIN_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test -n "$ORIGIN_HELDOUT_FINAL_CORPUS_GZIP_B64"
          mkdir -p test-results
          node --import tsx scripts/select-held-out-final-candidate-v15.ts > test-results/trusted-candidate-binding.json
          chmod 600 test-results/trusted-candidate-binding.json
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const raw = fs.readFileSync('test-results/trusted-candidate-binding.json', 'utf8');
          const value = JSON.parse(raw);
          const forbidden = ['goal','hiddenTests','content','prompt','messages','OPENROUTER_API_KEY'];
          if (forbidden.some(x => raw.includes(x))) process.exit(2);
          if (value?.candidateSha !== process.env.ORIGIN_CANDIDATE_SHA) process.exit(2);
          console.log(`task_ids=${JSON.stringify(value.taskIds)}`);
          console.log(`task_count=${value.taskCount}`);
          console.log(`source_digest=${value.sourceCorpusDigest}`);
          console.log(`candidate_digest=${value.candidateCorpusDigest}`);
          console.log(`marker_name=${value.oneShotMarkerName}`);
          NODE

      - name: Enforce legacy and V15 one-shot markers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIGEST: ${{ steps.binding.outputs.source_digest }}
          MARKER_NAME: ${{ steps.binding.outputs.marker_name }}
        run: |
          set -euo pipefail
          for marker in "$MARKER_NAME" "origin-held-out-final-started-$SOURCE_DIGEST"; do
            curl --fail --silent --show-error               -H 'Accept: application/vnd.github+json'               -H "Authorization: Bearer ${GH_TOKEN}"               -H 'X-GitHub-Api-Version: 2026-03-10'               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${marker}&per_page=100"               -o marker.json
            count="$(node -e "const v=require('./marker.json'); process.stdout.write(String(v.total_count || 0))")"
            rm -f marker.json
            if [ "$count" != '0' ]; then
              echo "::error::The sealed source corpus has already been started and cannot be reused."
              exit 2
            fi
          done

      - name: Enforce append-only one-shot status ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIGEST: ${{ steps.binding.outputs.source_digest }}
          ANCHOR_SHA: 01f7db0c0d48ab3ba533148e99e1847203e13f4c
        run: |
          set -euo pipefail
          context="origin/heldout-source/${SOURCE_DIGEST}"
          page=1
          while :; do
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${ANCHOR_SHA}/statuses?per_page=100&page=${page}" \
              -o statuses.json
            count="$(node -e "const v=require('./statuses.json'); process.stdout.write(String(v.length))")"
            found="$(CONTEXT="$context" node - <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync('statuses.json','utf8'));
          process.stdout.write(rows.some(row => row?.context === process.env.CONTEXT) ? '1' : '0');
          NODE
          )"
            rm -f statuses.json
            if [ "$found" = '1' ]; then
              echo "::error::The sealed source corpus is already present in the append-only status ledger."
              exit 2
            fi
            [ "$count" = '100' ] || break
            page=$((page + 1))
            [ "$page" -le 20 ] || { echo "::error::One-shot status ledger pagination limit exceeded."; exit 2; }
          done

      - name: Create immutable one-shot start marker
        env:
          SOURCE_DIGEST: ${{ steps.binding.outputs.source_digest }}
          CANDIDATE_DIGEST: ${{ steps.binding.outputs.candidate_digest }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync('test-results/trusted-candidate-one-shot.json', JSON.stringify({
            schemaVersion:'origin-trusted-candidate-one-shot-v1',
            sourceCorpusDigest:process.env.SOURCE_DIGEST,
            candidateCorpusDigest:process.env.CANDIDATE_DIGEST,
            candidateSha:process.env.CANDIDATE_SHA,
            workflowRunId:process.env.GITHUB_RUN_ID,
            workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            started:true,
            createdAt:new Date().toISOString(),
          },null,2)+'\n');
          NODE

      - name: Reserve append-only one-shot status ledger before provider execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIGEST: ${{ steps.binding.outputs.source_digest }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ANCHOR_SHA: 01f7db0c0d48ab3ba533148e99e1847203e13f4c
        run: |
          set -euo pipefail
          context="origin/heldout-source/${SOURCE_DIGEST}"
          CONTEXT="$context" node <<'NODE' > status-payload.json
          const payload={
            state:'pending',
            context:process.env.CONTEXT,
            description:`sealed corpus reserved for ${process.env.CANDIDATE_SHA.slice(0,12)}`,
            target_url:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          curl --fail --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${ANCHOR_SHA}" \
            --data-binary @status-payload.json \
            -o status-response.json
          CONTEXT="$context" node <<'NODE'
          const fs=require('node:fs');
          const row=JSON.parse(fs.readFileSync('status-response.json','utf8'));
          if(row?.context !== process.env.CONTEXT || row?.state !== 'pending') process.exit(2);
          NODE
          rm -f status-payload.json status-response.json

      - name: Reserve the sealed source corpus before provider execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.binding.outputs.marker_name }}
          path: test-results/trusted-candidate-one-shot.json
          retention-days: 90
          if-no-files-found: error

      - name: Preserve sanitized binding evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trusted-candidate-binding-${{ inputs.candidate_sha }}
          path: test-results/trusted-candidate-binding.json
          retention-days: 90
          if-no-files-found: error

  benchmark:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        task_id: ${{ fromJSON(needs.preflight.outputs.task_ids) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout trusted evaluator from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Install trusted evaluator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare isolated verifier image
        run: docker pull node:22-bookworm-slim

      - name: Verify credential boundary
        env:
          FINAL_CORPUS: ${{ secrets.ORIGIN_HELDOUT_FINAL_CORPUS_GZIP_B64 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$FINAL_CORPUS"
          test -n "$OPENROUTER_API_KEY"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"

      - name: Run exact candidate without corpus/provider secrets
        env:
          ORIGIN_HELDOUT_FINAL_CORPUS_GZIP_B64: ${{ secrets.ORIGIN_HELDOUT_FINAL_CORPUS_GZIP_B64 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORIGIN_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ORIGIN_HELDOUT_TASK_ID: ${{ matrix.task_id }}
        run: |
          set -euo pipefail
          node --import tsx scripts/run-trusted-candidate-heldout-v15.ts

      - name: Preserve public task evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trusted-candidate-heldout-task-${{ matrix.task_id }}-${{ github.run_id }}
          path: |
            test-results/held-out-task-public.json
            test-results/held-out-run.json
            test-results/held-out-score.json
            test-results/trusted-candidate-task-evidence.json
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: [preflight, benchmark]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted evaluator from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Install trusted evaluator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download this run public task evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COUNT: ${{ needs.preflight.outputs.task_count }}
        run: |
          set -euo pipefail
          mkdir -p final-artifacts
          curl --fail --silent --show-error             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'X-GitHub-Api-Version: 2026-03-10'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"             -o artifacts.json
          RUN_ID="$GITHUB_RUN_ID" node <<'NODE' > list.tsv
          const v=require('./artifacts.json');
          const suffix=`-${process.env.RUN_ID}`;
          for(const a of v.artifacts||[]){
            if(typeof a?.name==='string' && a.name.startsWith('trusted-candidate-heldout-task-') && a.name.endsWith(suffix) && Number.isSafeInteger(a.id)){
              console.log(`${a.id}\t${a.name}`);
            }
          }
          NODE
          count="$(wc -l < list.tsv | tr -d ' ')"
          test "$count" = "$EXPECTED_COUNT"
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            mkdir -p "final-artifacts/$id"
            curl --fail --silent --show-error --location               -H 'Accept: application/vnd.github+json'               -H "Authorization: Bearer ${GH_TOKEN}"               -H 'X-GitHub-Api-Version: 2026-03-10'               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip"               -o "$id.zip"
            unzip -q "$id.zip" -d "final-artifacts/$id"
          done < list.tsv
          rm -f artifacts.json list.tsv

      - name: Produce strict exact-candidate qualification
        env:
          ORIGIN_HELDOUT_FINAL_CORPUS_GZIP_B64: ${{ secrets.ORIGIN_HELDOUT_FINAL_CORPUS_GZIP_B64 }}
          ORIGIN_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ORIGIN_HELDOUT_FINAL_ARTIFACT_ROOT: ${{ github.workspace }}/final-artifacts
        run: node --import tsx scripts/summarize-trusted-candidate-heldout-v15.ts

      - name: Upload aggregate evidence
        id: aggregate_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trusted-candidate-heldout-final-${{ inputs.candidate_sha }}
          path: test-results/trusted-candidate-heldout-final.json
          retention-days: 90
          if-no-files-found: error

      - name: Build Q1 Coding evidence bound to aggregate artifact
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ARTIFACT_DIGEST: ${{ steps.aggregate_artifact.outputs.artifact-digest }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const final=JSON.parse(fs.readFileSync('test-results/trusted-candidate-heldout-final.json','utf8'));
          const q=final.qualification;
          const createdAt=new Date();
          const expiresAt=new Date(createdAt.getTime()+30*24*60*60*1000);
          const output={
            candidateSha:process.env.CANDIDATE_SHA,
            provenance:{
              source:'github-actions',
              evidenceId:`gh-run:${process.env.GITHUB_RUN_ID}:trusted-heldout`,
              headSha:process.env.CANDIDATE_SHA,
              artifactDigest:process.env.ARTIFACT_DIGEST,
              createdAt:createdAt.toISOString(),
              expiresAt:expiresAt.toISOString(),
            },
            heldOutRunCompleted:q.heldOutRunCompleted,
            qualificationPassed:q.qualificationPassed,
            attempted:q.attempted,
            solved:q.solved,
            regressionCount:q.regressionCount,
            zeroCost:q.zeroCost,
          };
          fs.writeFileSync('test-results/q1-coding-evidence.json',JSON.stringify(output,null,2)+'\n',{mode:0o600});
          if(!q.qualificationPassed) process.exit(1);
          NODE

      - name: Preserve Q1 Coding evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q1-coding-evidence-${{ inputs.candidate_sha }}
          path: test-results/q1-coding-evidence.json
          retention-days: 30
          if-no-files-found: warn
