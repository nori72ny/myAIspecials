name: Image edit private held-out V1

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current main SHA to evaluate
        required: true
        type: string
      corpus_id:
        description: Evaluator-owned synthetic private image-edit corpus id
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: origin-image-edit-private-heldout-v1
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      can_start: ${{ steps.one_shot.outputs.can_start }}
      corpus_digest: ${{ steps.metadata.outputs.corpus_digest }}
    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Install evaluator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify exact candidate and sealed edit corpus metadata
        id: metadata
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CORPUS_ID: ${{ inputs.corpus_id }}
          ORIGIN_IMAGE_EDIT_PRIVATE_CORPUS_GZIP_B64: ${{ secrets.ORIGIN_IMAGE_EDIT_PRIVATE_CORPUS_GZIP_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORIGIN_IMAGE_EDIT_PRIVATE_CORPUS_GZIP_B64"
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          metadata="$(npm run -s inspect:image-edit-private-corpus)"
          METADATA="$metadata" CANDIDATE_SHA="$CANDIDATE_SHA" CORPUS_ID="$CORPUS_ID" node <<'NODE' >> "$GITHUB_OUTPUT"
          const value=JSON.parse(process.env.METADATA||'{}');
          if(value.candidateSha!==process.env.CANDIDATE_SHA) process.exit(2);
          if(value.corpusId!==process.env.CORPUS_ID) process.exit(3);
          if(value.taskCount!==16) process.exit(4);
          if(!/^[a-f0-9]{64}$/.test(String(value.corpusDigest||''))) process.exit(5);
          console.log(`corpus_digest=${value.corpusDigest}`);
          NODE

      - name: Prove live Cloudflare Free raster readiness
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ORIGIN_RASTER_LIVE_QUALIFICATION: 'true'
          ORIGIN_RASTER_LIVE_EVIDENCE_PATH: ${{ github.workspace }}/test-results/raster-live-qualification-v15.json
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run qualify:raster-live

      - name: Check one-shot start marker
        id: one_shot
        env:
          GH_TOKEN: ${{ github.token }}
          CORPUS_DIGEST: ${{ steps.metadata.outputs.corpus_digest }}
        shell: bash
        run: |
          set -euo pipefail
          marker="origin-image-edit-private-started-${CORPUS_DIGEST}"
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${marker}&per_page=100" \
            -o prior-artifacts.json
          count="$(node -e "const v=require('./prior-artifacts.json'); process.stdout.write(String(v.total_count||0))")"
          rm -f prior-artifacts.json
          if [ "$count" != '0' ]; then
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            echo "This sealed image-edit corpus has already started and cannot be reused."
            exit 0
          fi
          echo "can_start=true" >> "$GITHUB_OUTPUT"

      - name: Create immutable one-shot start marker
        if: steps.one_shot.outputs.can_start == 'true'
        env:
          CORPUS_ID: ${{ inputs.corpus_id }}
          CORPUS_DIGEST: ${{ steps.metadata.outputs.corpus_digest }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          node <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync('test-results/image-edit-private-started.json',JSON.stringify({
            schemaVersion:'origin.image-edit-private-start-marker.v1',
            corpusId:process.env.CORPUS_ID,
            corpusDigest:process.env.CORPUS_DIGEST,
            candidateSha:process.env.CANDIDATE_SHA,
            workflowSha:process.env.GITHUB_SHA,
            workflowRunId:process.env.GITHUB_RUN_ID,
            started:true,
          },null,2)+'\n');
          NODE

      - name: Preserve one-shot marker before private candidate execution
        if: steps.one_shot.outputs.can_start == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: origin-image-edit-private-started-${{ steps.metadata.outputs.corpus_digest }}
          path: test-results/image-edit-private-started.json
          retention-days: 90
          if-no-files-found: error

  evaluate:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.can_start == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Install evaluator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run sealed 16-case candidate image-edit round
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ORIGIN_IMAGE_EDIT_PRIVATE_CORPUS_GZIP_B64: ${{ secrets.ORIGIN_IMAGE_EDIT_PRIVATE_CORPUS_GZIP_B64 }}
          ORIGIN_IMAGE_EDIT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ORIGIN_IMAGE_EDIT_CORPUS_ID: ${{ inputs.corpus_id }}
          ORIGIN_IMAGE_EDIT_OUTPUT_DIR: ${{ github.workspace }}/test-results/image-edit-private
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run eval:image-edit-private

      - name: Verify sanitized edit evidence surface
        shell: bash
        run: |
          set -euo pipefail
          test -f test-results/image-edit-private/public-tasks.json
          test -f test-results/image-edit-private/candidate-evidence.json
          test -f test-results/image-edit-private/candidate-summary.json
          test -d test-results/image-edit-private/candidate-images
          test -z "$(find test-results/image-edit-private -type f \( -name '*corpus*' -o -name '*prompt*' -o -name '*source*' -o -name '*instruction*' \) -print)"

      - name: Upload candidate edit images and sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-edit-private-candidate-${{ needs.preflight.outputs.corpus_digest }}
          path: test-results/image-edit-private/
          retention-days: 90
          if-no-files-found: error

      - name: Fail closed on technical candidate blockers
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const summary=JSON.parse(fs.readFileSync('test-results/image-edit-private/candidate-summary.json','utf8'));
          if(summary.attempted!==16) process.exit(11);
          if(summary.completed!==summary.attempted) process.exit(12);
          if(summary.technicallyQualified!==summary.attempted) process.exit(13);
          if(summary.providerIdentityCount!==1) process.exit(14);
          if(!Array.isArray(summary.blockers) || summary.blockers.length!==0) process.exit(15);
          if(summary.qualificationStatus!=='NOT_MEASURED') process.exit(16);
          NODE
