name: ACOS 2.0 Quality Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - feat/agentic-coding-os-phase2
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gate:
    name: Verify Quality & Code Guidelines
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Base Dependencies
        run: npm ci

      - name: Run TypeScript & Design Token Lock Linter
        run: npm run lint

      - name: Run Explicit Typecheck Gate
        run: npm run typecheck

      - name: Run isolated raster image router tests
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run test -- --maxWorkers=1 src/creative/rasterImageV15Router.test.ts

      - name: Run isolated AQ quota guard tests
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run test -- --maxWorkers=1 scripts/check-aq-live-quota-guard.test.ts

      - name: Run Core Unit Tests
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        # Keep the raster router test isolated while investigating the repeatable heap OOM.
        run: |
          set -e
          for shard in 1/64 2/64 3/64 4/64 5/64 6/64 7/64 8/64 9/64 10/64 11/64 12/64 13/64 14/64 15/64 16/64 17/64 18/64 19/64 20/64 21/64 22/64 23/64 24/64 25/64 26/64 27/64 28/64 29/64 30/64 31/64 32/64 33/64 34/64 35/64 36/64 37/64 38/64 39/64 40/64 41/64 42/64 43/64 44/64 45/64 46/64 47/64 48/64 49/64 50/64 51/64 52/64 53/64 54/64 55/64 56/64 57/64 58/64 59/64 60/64 61/64 62/64 63/64 64/64; do
            echo "Running core unit-test shard ${shard} (excluding isolated raster router test)"
            npm run test -- --maxWorkers=1 --exclude=src/creative/rasterImageV15Router.test.ts --exclude=scripts/check-aq-live-quota-guard.test.ts --shard="${shard}" --reporter=junit --outputFile="vitest-junit-${shard//\//-}.xml"
          done

      - name: Preserve Core Test Diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: origin-core-test-results
          path: vitest-junit-*.xml
          if-no-files-found: ignore
          retention-days: 3

      - name: Run Integration API Tests
        run: npm run test:api

      - name: Preserve API Test Diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: origin-api-test-results
          path: |
            results/**
            coverage/jest/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Validate Production Build
        run: npm run build

      - name: Verify Production Node Runtime
        run: |
          set -o pipefail
          npm run test:node-production 2>&1 | tee node-production-runtime.log

      - name: Preserve Node Runtime Diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: origin-node-production-runtime
          path: node-production-runtime.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify Serverless API Runtime
        run: |
          set -o pipefail
          npm run test:api-node-esm 2>&1 | tee api-node-esm-runtime.log

      - name: Preserve Serverless Runtime Diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: origin-api-node-esm-runtime
          path: api-node-esm-runtime.log
          if-no-files-found: ignore
          retention-days: 3
