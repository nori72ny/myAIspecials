name: ORIGIN numeric postprocessor v7

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply patch
        run: node scripts/patch-context-aware-numeric-processor.mjs
      - name: Build and lint
        run: npm run build && npm run lint
      - name: Commit implementation and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .origin-numeric-postprocessor-trigger-v6 .origin-numeric-postprocessor-trigger-final2
          rm -f .github/workflows/origin-numeric-postprocessor.yml .github/workflows/origin-numeric-postprocessor2.yml .github/workflows/origin-numeric-postprocessor3.yml .github/workflows/origin-numeric-postprocessor4.yml .github/workflows/origin-numeric-postprocessor5.yml .github/workflows/origin-numeric-postprocessor6.yml .github/workflows/origin-numeric-postprocessor7.yml
          git add src/components/personal/UnifiedChat.tsx scripts/patch-context-aware-numeric-processor.mjs .github/workflows/ .origin-numeric-postprocessor-trigger-v6 .origin-numeric-postprocessor-trigger-final2
          git commit -m "fix: fail-closed context-aware numeric rendering [skip ci]"
          git push origin HEAD:main
