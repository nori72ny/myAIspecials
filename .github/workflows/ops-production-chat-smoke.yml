name: Ops Production Chat Smoke

on:
  push:
    branches:
      - ops/production-chat-smoke-20260831

permissions:
  contents: read

jobs:
  production-chat-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST production chat endpoint
        env:
          ORIGIN_URL: https://origin-personal.vercel.app
        run: |
          set -euo pipefail
          body='{"messages":[{"role":"user","content":"ORIGIN production smoke test: reply with exactly OK"}]}'
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 70 --output "$response_file" --write-out '%{http_code}' -X POST "$ORIGIN_URL/api/chat" -H 'content-type: application/json' --data "$body")"
          echo "HTTP_STATUS=$status"
          cat "$response_file"
          echo
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Production /api/chat smoke failed."
            exit 1
          fi
          grep -Eq '"content"|"answer"|OK' "$response_file"
          echo "Production /api/chat smoke passed."
