name: AQ runtime preflight (no provider)

on:
  pull_request:
    paths:
      - '.github/workflows/aq-runtime-preflight.yml'
      - 'scripts/verify-trusted-answer-runtime-v2.mjs'
      - 'scripts/trusted-answer-candidate-runner-v2.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: docker pull node:22-bookworm-slim
      - name: Check runner bootstrap before consuming sealed evaluation data
        run: node scripts/verify-trusted-answer-runtime-v2.mjs
