name: Temporary AQ V2 runtime fixer

on:
  push:
    branches:
      - fix/aq-v2-trusted-runtime

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/aq-v2-trusted-runtime
          fetch-depth: 0
          persist-credentials: true

      - name: Apply audited runtime correction and pre-reservation calibration
        shell: bash
        env:
          AQ_PREFLIGHT_INSERT_B64: 
        run: |
          set -euo pipefail
          git fetch --no-tags origin d583f9337c00b748d902b2422ac07171d4190ecc
          git show FETCH_HEAD:scripts/preflight-trusted-answer-runtime-v2.ts > scripts/preflight-trusted-answer-runtime-v2.ts
          python <<'PY'
          import base64
          import os
          from pathlib import Path
          old = 'dst=/work/node_modules,readonly'
          new = 'dst=/node_modules,readonly'
          runner = Path('scripts/run-trusted-answer-case-v2.ts')
          text = runner.read_text()
          if text.count(old) != 1:
              raise SystemExit('AQ_V2_RUNTIME_MOUNT_PATCH_TARGET_INVALID')
          runner.write_text(text.replace(old, new, 1))
          preflight = Path('scripts/preflight-trusted-answer-runtime-v2.ts')
          text = preflight.read_text()
          if text.count(old) != 1:
              raise SystemExit('AQ_V2_PREFLIGHT_MOUNT_PATCH_TARGET_INVALID')
          preflight.write_text(text.replace(old, new, 1))
          workflow = Path('.github/workflows/trusted-answer-quality-v2.yml')
          text = workflow.read_text()
          marker = '      - name: Fetch sealed AQ V2 corpus from private trusted store\n'
          if text.count(marker) != 1:
              raise SystemExit('AQ_V2_PREFLIGHT_INSERT_TARGET_INVALID')
          insert = base64.b64decode(os.environ['AQ_PREFLIGHT_INSERT_B64']).decode()
          workflow.write_text(text.replace(marker, insert + marker, 1))
          PY
          rm -f .github/workflows/_tmp-aq-v2-runtime-fix.yml

      - name: Commit clean evaluator fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(aq): preflight trusted runtime before sealed corpus'
          git push origin HEAD:fix/aq-v2-trusted-runtime
