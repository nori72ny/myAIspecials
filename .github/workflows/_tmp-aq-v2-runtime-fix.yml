name: Temporary AQ V2 runtime fixer

on:
  push:
    branches:
      - fix/aq-v2-trusted-runtime

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/aq-v2-trusted-runtime
          fetch-depth: 0
          persist-credentials: true

      - name: Apply audited runtime correction and pre-reservation calibration
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin d583f9337c00b748d902b2422ac07171d4190ecc
          git show FETCH_HEAD:scripts/preflight-trusted-answer-runtime-v2.ts > scripts/preflight-trusted-answer-runtime-v2.ts
          python <<'PY'
          from pathlib import Path

          runner = Path('scripts/run-trusted-answer-case-v2.ts')
          text = runner.read_text()
          old = 'dst=/work/node_modules,readonly'
          new = 'dst=/node_modules,readonly'
          if text.count(old) != 1:
              raise SystemExit('AQ_V2_RUNTIME_MOUNT_PATCH_TARGET_INVALID')
          runner.write_text(text.replace(old, new, 1))

          preflight = Path('scripts/preflight-trusted-answer-runtime-v2.ts')
          text = preflight.read_text()
          if text.count(old) != 1:
              raise SystemExit('AQ_V2_PREFLIGHT_MOUNT_PATCH_TARGET_INVALID')
          preflight.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/trusted-answer-quality-v2.yml')
          text = workflow.read_text()
          marker = '      - name: Fetch sealed AQ V2 corpus from private trusted store\n'
          if text.count(marker) != 1:
              raise SystemExit('AQ_V2_PREFLIGHT_INSERT_TARGET_INVALID')
          insert = '''      - name: Checkout exact candidate for public runtime calibration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha || env.AQ_V2_DEFAULT_CANDIDATE_SHA }}
          path: candidate-preflight
          persist-credentials: false

      - name: Prepare isolated runtime image before sealed-corpus access
        run: docker pull node:22-bookworm-slim

      - name: Exercise trusted runtime on public calibration before sealed-corpus access
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORIGIN_CANDIDATE_SHA: ${{ inputs.candidate_sha || env.AQ_V2_DEFAULT_CANDIDATE_SHA }}
          ORIGIN_AQ_V2_CANDIDATE_CHECKOUT: ${{ github.workspace }}/candidate-preflight
          ORIGIN_AQ_V2_PREFLIGHT_RESULT_PATH: ${{ github.workspace }}/test-results/trusted-answer-runtime-preflight-v2.json
        run: |
          set -euo pipefail
          node --import tsx scripts/preflight-trusted-answer-runtime-v2.ts

      - name: Preserve sanitized runtime calibration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aq-v2-runtime-preflight-${{ inputs.candidate_sha || env.AQ_V2_DEFAULT_CANDIDATE_SHA }}-${{ github.run_id }}
          path: test-results/trusted-answer-runtime-preflight-v2.json
          if-no-files-found: warn
          retention-days: 90

'''
          workflow.write_text(text.replace(marker, insert + marker, 1))
          PY
          rm -f .github/workflows/_tmp-aq-v2-runtime-fix.yml

      - name: Commit clean evaluator fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-trusted-answer-case-v2.ts scripts/preflight-trusted-answer-runtime-v2.ts .github/workflows/trusted-answer-quality-v2.yml .github/workflows/_tmp-aq-v2-runtime-fix.yml
          git diff --cached --check
          git commit -m 'fix(aq): preflight trusted runtime before sealed corpus'
          git push origin HEAD:fix/aq-v2-trusted-runtime
