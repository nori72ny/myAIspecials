name: ORIGIN Zero-Drop v8.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  zero-drop-v82:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply Zero-Drop v8.2
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          router = Path('src/legacy/originChatRouter.ts')
          s = router.read_text()
          s = s.replace('const MODEL_BUSY_MESSAGE = "現在無料APIの利用が一時的に集中しています。費用0円ポリシーを維持したままバックアップエンジンで安全に同期中です。数秒おいて再度お試しください。";\n', '')
          s = s.replace('const RETRYABLE_PROVIDER_CODES = new Set(["PROVIDER_RATE_LIMITED", "PROVIDER_TIMEOUT", "PROVIDER_UNAVAILABLE", "PROVIDER_INTERNAL_ERROR"]);', 'const RETRYABLE_PROVIDER_CODES = new Set(["PROVIDER_RATE_LIMITED", "PROVIDER_TIMEOUT", "PROVIDER_UNAVAILABLE", "PROVIDER_INTERNAL_ERROR", "PROVIDER_INVALID_RESPONSE"]);')
          pattern = re.compile(r'\n        if \(shouldRetryProvider\(error\)\) \{.*?\n        \}\n        const providerError = error as OriginProviderError;.*?\n      console\.error\("\[origin-chat\] unexpected provider failure".*?\n    \}\n', re.S)
          replacement = '''\n        const providerError = error as OriginProviderError;\n        return res.status(providerError.status >= 500 ? 503 : providerError.status).json({ code: providerError.code, message: providerError.message, retryable: providerError.retryable, retryAfterSeconds: providerError.retryAfterSeconds, diagnostic: providerError.diagnostic, requestId, retryAttempted: providerRetryAttempted });\n      }\n      console.error("[origin-chat] unexpected provider failure", { requestId, durationMs: Math.max(0, now() - startedAt), errorName: error instanceof Error ? error.name : "unknown" });\n      return res.status(503).json({ code: "PROVIDER_UNAVAILABLE", message: "無料AIプロバイダーの回答を取得できませんでした。", retryable: true, requestId });\n    }\n'''
          ns, n = pattern.subn(replacement, s, count=1)
          if n != 1: raise SystemExit('router replacement mismatch')
          router.write_text(ns)

          provider = Path('src/legacy/originProviderClient.ts')
          p = provider.read_text()
          helper = '''function assertBufferedAnswerIntegrity(text: string): string {\n  const normalized = text.replace(/\\r\\n/g, "\\n").trim();\n  if (!normalized) throw new OriginProviderError("PROVIDER_INVALID_RESPONSE", "無料AIから完全な回答を受け取れませんでした。", 502, true);\n  if (normalized.length >= 8 && normalized.slice(0, Math.floor(normalized.length / 2)) === normalized.slice(Math.floor(normalized.length / 2))) throw new OriginProviderError("PROVIDER_INVALID_RESPONSE", "プロバイダー応答の重複を検出したため、回答を破棄しました。", 502, true);\n  return normalized;\n}\n'''
          if 'function assertBufferedAnswerIntegrity' not in p: p = p.replace('function extractText(content: unknown): string {', helper + 'function extractText(content: unknown): string {', 1)
          p = p.replace('const part = extractText(choice?.message?.content); if (!part) throw new OriginProviderError("PROVIDER_INVALID_RESPONSE", "無料AIから有効な回答を受け取れませんでした。", 502, true);', 'const part = assertBufferedAnswerIntegrity(extractText(choice?.message?.content));')
          p = p.replace('const data = await readJson(response); const text = extractText(data.candidates?.[0]?.content?.parts?.map((p: any) => ({ type: "text", text: p.text })));\n  if (!text) throw new OriginProviderError("PROVIDER_INVALID_RESPONSE", "Geminiから有効な応答を受け取れませんでした。", 502, true);', 'const data = await readJson(response); const text = assertBufferedAnswerIntegrity(extractText(data.candidates?.[0]?.content?.parts?.map((p: any) => ({ type: "text", text: p.text }))));')
          p = p.replace('const data = await readJson(response); const text = extractText(data.choices?.[0]?.message?.content); if (!text) throw new OriginProviderError("PROVIDER_INVALID_RESPONSE", "Groqから有効な回答を受け取れませんでした。", 502, true);', 'const data = await readJson(response); const text = assertBufferedAnswerIntegrity(extractText(data.choices?.[0]?.message?.content));')
          provider.write_text(p)

          test = Path('src/legacy/originProviderClient.test.ts')
          t = test.read_text()
          marker = '// ZERO-DROP-V82-TESTS'
          if marker not in t:
              t += '''\n\n// ZERO-DROP-V82-TESTS\ndescribe("Zero-Drop Protocol v8.2", () => {\n  it("fails over from a 429 OpenRouter route to Gemini without pseudo-success", async () => {\n    let calls = 0;\n    const fetchImpl = vi.fn(async (input: RequestInfo | URL) => {\n      calls += 1;\n      const url = String(input);\n      if (url.includes("openrouter.ai")) return new Response(JSON.stringify({ error: { message: "rate limited" } }), { status: 429 });\n      return new Response(JSON.stringify({ candidates: [{ content: { parts: [{ text: "Gemini fallback answer" }] } }] }), { status: 200, headers: { "content-type": "application/json" } });\n    }) as unknown as OriginFetch;\n    const result = await executeOriginProvider(request, { OPENROUTER_API_KEY: "test-openrouter", GEMINI_API_KEY: "test-gemini" }, fetchImpl);\n    expect(result.text).toBe("Gemini fallback answer");\n    expect(result.actualCostUsd).toBe(0);\n    expect(result.usage.costUsd).toBe(0);\n    expect(result.routingEvidence.provider).toBe("Google AI Studio");\n    expect(calls).toBeGreaterThan(1);\n  });\n});\n'''
              test.write_text(t)
          PY
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/legacy/originChatRouter.ts src/legacy/originProviderClient.ts src/legacy/originProviderClient.test.ts
          git diff --cached --quiet || git commit -m "fix(origin): implement Zero-Drop Protocol v8.2"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/origin-zero-drop-v82.yml || true
          git diff --cached --quiet || git commit -m "chore: remove temporary Zero-Drop v8.2 workflow"
          git push || true
