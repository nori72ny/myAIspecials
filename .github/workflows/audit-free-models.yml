name: Audit current OpenRouter free catalog
on:
  push:
    branches: [audit/free-models-20260908]
    paths: ['.github/workflows/audit-free-models.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Query official OpenRouter model and provider privacy pages
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://openrouter.ai/api/v1/models -o /tmp/models.json
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/models.json','utf8'));
          const free = (j.data || []).filter(m => String(m?.pricing?.prompt) === '0' && String(m?.pricing?.completion) === '0');
          console.log('FREE_COUNT='+free.length);
          for (const m of free) console.log(JSON.stringify({id:m.id,name:m.name,ctx:m.context_length,params:m.supported_parameters||[]}));
          NODE
          for spec in \
            'nvidia/nemotron-3-super-120b-a12b:free' \
            'nvidia/nemotron-3-ultra-550b-a55b:free' \
            'nvidia/nemotron-3.5-lightning:free' \
            'cohere/north-mini-code:free'; do
            author="${spec%%/*}"
            slug="${spec#*/}"
            echo "ENDPOINTS_FOR=$spec"
            curl --fail --silent --show-error "https://openrouter.ai/api/v1/models/$author/$slug/endpoints" | head -c 8000 || true
            echo
            echo "PRIVACY_PAGE_FOR=$spec"
            curl --fail --silent --show-error "https://openrouter.ai/$author/$slug/providers" -o /tmp/page.html || true
            python3 - "$spec" <<'PY'
          import re,sys
          from pathlib import Path
          text=Path('/tmp/page.html').read_text(errors='ignore') if Path('/tmp/page.html').exists() else ''
          for pat in ['Zero retention','zero retention','Prompt Logging','Training','training','ZDR','data_collection','retention']:
              hits=[m.start() for m in re.finditer(re.escape(pat),text)]
              for p in hits[:6]:
                  s=max(0,p-240); e=min(len(text),p+480)
                  print('MATCH',pat, re.sub(r'\\s+',' ',text[s:e])[:800])
          PY
          done
