name: AQ V2 trusted runtime preflight

on:
  push:
    branches:
      - audit/aq-v2-runtime-preflight

permissions:
  contents: read
  pull-requests: read

env:
  AQ_V2_PREFLIGHT_CANDIDATE_SHA: d0c307fd3d915474730a033fc46e273cbb6a6231
  AQ_V2_PREFLIGHT_PR_NUMBER: '698'

jobs:
  calibration:
    name: public calibration without sealed corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted evaluator branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Checkout exact candidate separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.AQ_V2_PREFLIGHT_CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Install trusted evaluator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pull isolated runtime image
        run: docker pull node:22-bookworm-slim

      - name: Revalidate exact candidate PR binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ env.AQ_V2_PREFLIGHT_CANDIDATE_SHA }}
          PR_NUMBER: ${{ env.AQ_V2_PREFLIGHT_PR_NUMBER }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            -o pr.json
          node <<'NODE'
          const fs = require('node:fs');
          const pr = JSON.parse(fs.readFileSync('pr.json', 'utf8'));
          const fail = code => { console.error(code); process.exit(2); };
          if (pr?.state !== 'open') fail('AQ_V2_PREFLIGHT_CANDIDATE_PR_NOT_OPEN');
          if (pr?.base?.ref !== 'main') fail('AQ_V2_PREFLIGHT_CANDIDATE_BASE_INVALID');
          if (pr?.head?.repo?.full_name !== process.env.GITHUB_REPOSITORY) fail('AQ_V2_PREFLIGHT_CANDIDATE_FORK_BLOCKED');
          if (pr?.head?.sha !== process.env.CANDIDATE_SHA) fail('AQ_V2_PREFLIGHT_CANDIDATE_SHA_CHANGED');
          NODE
          rm -f pr.json

      - name: Diagnose Docker bind-mount contract without secrets
        shell: bash
        run: |
          set -euo pipefail
          probe_root="$(mktemp -d)"
          trap 'rm -rf "$probe_root"' EXIT
          mkdir -p "$probe_root/trusted" "$probe_root/socket"
          printf 'export {};\n' > "$probe_root/trusted/probe.mjs"
          uid="$(id -u)"
          gid="$(id -g)"
          common=(
            run --rm
            --network none
            --cap-drop ALL
            --security-opt no-new-privileges
            --read-only
            --user "${uid}:${gid}"
            --pids-limit 128
            --cpus 2
            --memory 2g
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
          )
          run_probe() {
            local label="$1"
            shift
            echo "::group::docker-probe-${label}"
            if ! docker "${common[@]}" "$@" node:22-bookworm-slim node -e 'process.stdout.write("ok\\n")'; then
              echo "AQ_V2_PREFLIGHT_DOCKER_PROBE_${label^^}_FAILED" >&2
              exit 2
            fi
            echo "::endgroup::"
          }
          run_probe base
          run_probe candidate_bind \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/candidate,dst=/work,readonly" \
            --workdir /work
          run_probe node_modules_bind \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/candidate,dst=/work,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/node_modules,dst=/work/node_modules,readonly" \
            --workdir /work
          run_probe trusted_bind \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/candidate,dst=/work,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/node_modules,dst=/work/node_modules,readonly" \
            --mount "type=bind,src=${probe_root}/trusted,dst=/trusted,readonly" \
            --workdir /work
          run_probe socket_bind \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/candidate,dst=/work,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/node_modules,dst=/work/node_modules,readonly" \
            --mount "type=bind,src=${probe_root}/trusted,dst=/trusted,readonly" \
            --mount "type=bind,src=${probe_root}/socket,dst=/trusted-socket,readonly" \
            --workdir /work

      - name: Verify free-only provider credential is available
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"

      - name: Exercise trusted runtime on public calibration prompt
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORIGIN_CANDIDATE_SHA: ${{ env.AQ_V2_PREFLIGHT_CANDIDATE_SHA }}
          ORIGIN_AQ_V2_CANDIDATE_CHECKOUT: ${{ github.workspace }}/candidate
          ORIGIN_AQ_V2_PREFLIGHT_RESULT_PATH: ${{ github.workspace }}/test-results/trusted-answer-runtime-preflight-v2.json
        run: |
          set -euo pipefail
          node --import tsx scripts/preflight-trusted-answer-runtime-v2.ts

      - name: Preserve sanitized preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aq-v2-runtime-preflight-${{ env.AQ_V2_PREFLIGHT_CANDIDATE_SHA }}-${{ github.run_id }}
          path: test-results/trusted-answer-runtime-preflight-v2.json
          if-no-files-found: warn
          retention-days: 30
