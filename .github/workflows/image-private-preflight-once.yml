name: Image private preflight once

on:
  push:
    branches:
      - eval/image-private-preflight-once-20261007
    paths:
      - .github/workflows/image-private-preflight-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Report sealed corpus availability
        env:
          ORIGIN_IMAGE_PRIVATE_CORPUS_GZIP_B64: ${{ secrets.ORIGIN_IMAGE_PRIVATE_CORPUS_GZIP_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ORIGIN_IMAGE_PRIVATE_CORPUS_GZIP_B64" ]; then
            echo "- sealedCorpus: available" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- sealedCorpus: missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify OpenRouter image API key presence and model readiness
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORIGIN_IMAGE_CANDIDATE_SHA: ${{ github.sha }}
          ORIGIN_IMAGE_WORLD_CLASS_MODEL: openai/gpt-image-2.5-sunburst
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          node --import tsx scripts/preflight-world-class-image-v16.ts
