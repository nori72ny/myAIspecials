name: oneoff-provider-http-fallback
on:
  push:
    branches:
      - fix/bounded-top-level-provider-attempt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make retryable upstream HTTP statuses reach secondary routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("src/legacy/originProviderClient.ts")
          s = p.read_text()
          old = "if (![408, 500, 502, 503, 504].includes(response.status) || index === RETRY.length) return response;"
          new = "if (![408, 500, 502, 503, 504].includes(response.status)) return response;"
          if old not in s:
              raise SystemExit("expected HTTP handling expression not found")
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/legacy/originProviderClient.ts
          git commit -m "fix: route retryable upstream HTTP failures to secondary provider"
          git push
