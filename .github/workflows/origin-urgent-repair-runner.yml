name: ORIGIN urgent repair runner

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  REPAIR_COMMIT_MESSAGE: "fix: OpenRouter 429 exponential backoff retry and unify ORIGIN Personal title"

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact source repairs
        shell: python
        run: |
          from pathlib import Path
          import re

          router = Path("src/legacy/originChatRouter.ts")
          text = router.read_text()

          old_constants = '''const MAX_PROVIDER_ATTEMPT_TIMEOUT_MS = 52_000;\nconst MODEL_BUSY_MESSAGE = "現在モデルが混雑しています。数十秒後に再試行してください（費用 $0.00 は維持されています）";\nconst RETRYABLE_PROVIDER_CODES = new Set([\n  "PROVIDER_RATE_LIMITED",\n  "PROVIDER_TIMEOUT",\n  "PROVIDER_UNAVAILABLE",\n  "PROVIDER_INTERNAL_ERROR",\n]);\n\nfunction shouldRetryProvider(error: unknown): error is OriginProviderError {\n  return error instanceof OriginProviderError\n    && error.retryable\n    && RETRYABLE_PROVIDER_CODES.has(error.code);\n}\n'''

          new_constants = '''const MAX_PROVIDER_ATTEMPT_TIMEOUT_MS = 52_000;\nconst MAX_PROVIDER_TOTAL_BUDGET_MS = 100_000;\nconst PROVIDER_RETRY_DELAYS_MS = [1_500, 3_000, 5_000] as const;\nconst MAX_PROVIDER_RETRIES = PROVIDER_RETRY_DELAYS_MS.length;\nconst MIN_PROVIDER_ATTEMPT_TIMEOUT_MS = 1_000;\nconst MODEL_BUSY_MESSAGE = "現在モデルが混雑しています。数十秒後に再試行してください（費用 $0.00 は維持されています）";\nconst RETRYABLE_PROVIDER_CODES = new Set([\n  "PROVIDER_RATE_LIMITED",\n  "PROVIDER_UNAVAILABLE",\n]);\n\nfunction shouldRetryProvider(error: unknown): error is OriginProviderError {\n  return error instanceof OriginProviderError\n    && error.retryable\n    && (error.status === 429 || error.status === 503 || RETRYABLE_PROVIDER_CODES.has(error.code));\n}\n\nfunction providerAttemptTimeoutMs(elapsedMs: number, attemptIndex: number): number {\n  const attemptsRemaining = MAX_PROVIDER_RETRIES + 1 - attemptIndex;\n  const retryDelaysRemaining = PROVIDER_RETRY_DELAYS_MS\n    .slice(attemptIndex)\n    .reduce((total, delayMs) => total + delayMs, 0);\n  const budgetRemaining = Math.max(\n    MIN_PROVIDER_ATTEMPT_TIMEOUT_MS,\n    MAX_PROVIDER_TOTAL_BUDGET_MS - elapsedMs - retryDelaysRemaining,\n  );\n  return Math.min(\n    MAX_PROVIDER_ATTEMPT_TIMEOUT_MS,\n    Math.max(MIN_PROVIDER_ATTEMPT_TIMEOUT_MS, Math.floor(budgetRemaining / attemptsRemaining)),\n  );\n}\n'''

          if old_constants not in text:
              raise SystemExit("originChatRouter constants block not found; refusing unsafe edit")
          text = text.replace(old_constants, new_constants, 1)

          old_retry = '''let result: OriginProviderExecutionResult;\n      try {\n        result = await execute(providerRequest);\n      } catch (firstError) {\n        if (!shouldRetryProvider(firstError)) throw firstError;\n        providerRetryAttempted = true;\n        console.warn("[origin-chat] transient provider failure; retrying once", {\n          requestId,\n          code: firstError.code,\n          status: firstError.status,\n        });\n        result = await execute(providerRequest);\n      }'''

          new_retry = '''let result: OriginProviderExecutionResult | undefined;\n      const retryStartedAt = now();\n      let lastProviderError: unknown;\n\n      for (let attemptIndex = 0; attemptIndex <= MAX_PROVIDER_RETRIES; attemptIndex += 1) {\n        const elapsedMs = Math.max(0, now() - retryStartedAt);\n        const timeoutMs = providerAttemptTimeoutMs(elapsedMs, attemptIndex);\n        const attemptRequest: OriginProviderExecutionRequest = {\n          ...providerRequest,\n          plan: { ...providerRequest.plan, timeoutMs },\n        };\n\n        try {\n          result = await execute(attemptRequest);\n          break;\n        } catch (error) {\n          lastProviderError = error;\n          if (!shouldRetryProvider(error) || attemptIndex === MAX_PROVIDER_RETRIES) throw error;\n\n          providerRetryAttempted = true;\n          const delayMs = PROVIDER_RETRY_DELAYS_MS[attemptIndex];\n          console.warn("[origin-chat] provider rate limit/unavailable; retrying with exponential backoff", {\n            requestId,\n            attempt: attemptIndex + 1,\n            nextAttempt: attemptIndex + 2,\n            delayMs,\n            timeoutMs,\n            code: error.code,\n            status: error.status,\n          });\n\n          const remainingBeforeDelay = Math.max(0, MAX_PROVIDER_TOTAL_BUDGET_MS - (now() - retryStartedAt));\n          if (remainingBeforeDelay <= delayMs) {\n            throw error;\n          }\n          await new Promise((resolve) => setTimeout(resolve, delayMs));\n        }\n      }\n\n      if (!result) {\n        throw lastProviderError instanceof Error\n          ? lastProviderError\n          : new Error("ORIGIN provider retry budget exhausted");\n      }'''

          if old_retry not in text:
              raise SystemExit("originChatRouter retry block not found; refusing unsafe edit")
          text = text.replace(old_retry, new_retry, 1)
          router.write_text(text)

          app = Path("src/App.tsx")
          app_text = app.read_text()
          before = app_text
          app_text = app_text.replace("ORIGIN Personal 2.0", "ORIGIN Personal")
          header_pattern = re.compile(r'<span className="text-base font-extrabold tracking-tight">ORIGIN</span><span className="origin-badge rounded-\[10px\] px-1\.5 py-0\.5 text-\[13px\] font-mono">Personal 2\.0</span>')
          app_text, count = header_pattern.subn('<span className="text-base font-extrabold tracking-tight">ORIGIN Personal</span>', app_text, count=1)
          if before == app_text:
              raise SystemExit("src/App.tsx title/header target not found; refusing unsafe edit")
          app.write_text(app_text)

          if "ORIGIN Personal 2.0" in app_text:
              raise SystemExit("stale Personal 2.0 text remains in App.tsx")
          if "Personal 2.0" in text:
              raise SystemExit("unexpected Personal 2.0 text remains in originChatRouter.ts")

      - name: Verify diff and install dependencies
        run: |
          git diff --check
          npm ci

      - name: TypeScript, tests, and production build
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Commit repaired source and remove one-shot runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/origin-urgent-repair-runner.yml
          git add src/legacy/originChatRouter.ts src/App.tsx .github/workflows/origin-urgent-repair-runner.yml
          git diff --cached --check
          git commit -m "$REPAIR_COMMIT_MESSAGE"
          git push origin HEAD:main
