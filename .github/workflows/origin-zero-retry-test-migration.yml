name: ORIGIN zero retry test migration

on:
  push:
    branches:
      - fix/origin-zdr-free-model
    paths:
      - .github/workflows/origin-zero-retry-test-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/origin-zdr-free-model
      - name: Align regression tests with zero inference retries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.test.tsx')
          text = app.read_text()
          old = '''  it('retries one edge-level transient /api/chat failure before displaying a verified response', async () => {
    const fetchMock = vi.fn()
      .mockResolvedValueOnce(new Response('temporary edge failure', { status: 503 }))
      .mockResolvedValueOnce(new Response('再試行後の回答', { status: 200 }));
    vi.stubGlobal('fetch', fetchMock);
    render(<App language="ja" />);
    fireEvent.change(screen.getByTestId('origin-home-request'), { target: { value: '一時エラーを再試行' } });
    fireEvent.click(screen.getByTestId('start-request-button'));

    await waitFor(() => expect(screen.getByText('再試行後の回答')).toBeTruthy());
    expect(fetchMock).toHaveBeenCalledTimes(2);
    expect(screen.getByTestId('response-verification-details')).toBeTruthy();
    vi.unstubAllGlobals();
  });

  it('retries one temporary network timeout before displaying a verified response', async () => {
    const fetchMock = vi.fn()
      .mockRejectedValueOnce(new TypeError('Network request timed out'))
      .mockResolvedValueOnce(new Response('タイムアウト後に復旧しました。', { status: 200 }));
    vi.stubGlobal('fetch', fetchMock);
    render(<App language="ja" />);
    fireEvent.change(screen.getByTestId('origin-home-request'), { target: { value: '通信を復旧' } });
    fireEvent.click(screen.getByTestId('start-request-button'));

    await waitFor(() => expect(screen.getByText('タイムアウト後に復旧しました。')).toBeTruthy());
    expect(fetchMock).toHaveBeenCalledTimes(2);
    expect(screen.getByTestId('response-verification-details')).toBeTruthy();
    vi.unstubAllGlobals();
  });

  it('fails closed with the zero-cost busy notice after two network timeouts', async () => {
    const fetchMock = vi.fn().mockRejectedValue(new TypeError('Network request timed out'));
    vi.stubGlobal('fetch', fetchMock);
    render(<App language="ja" />);
    fireEvent.change(screen.getByTestId('origin-home-request'), { target: { value: '通信停止時の案内を確認' } });
    fireEvent.click(screen.getByTestId('start-request-button'));

    await waitFor(() => expect(screen.getByText('現在、無料AIの利用が集中しています。費用0円ポリシーを維持したまま再試行していますが、今回は安全に回答を返せませんでした。少し時間をおいて、もう一度お試しください。')).toBeTruthy());
    expect(fetchMock).toHaveBeenCalledTimes(2);
    expect(screen.queryByTestId('response-verification-details')).toBeNull();
    vi.unstubAllGlobals();
  });
'''
          new = '''  it('does not retry an edge-level transient /api/chat failure or display an unverified response', async () => {
    const fetchMock = vi.fn()
      .mockResolvedValueOnce(new Response('temporary edge failure', { status: 503 }))
      .mockResolvedValueOnce(new Response('再試行してはいけない回答', { status: 200 }));
    vi.stubGlobal('fetch', fetchMock);
    render(<App language="ja" />);
    fireEvent.change(screen.getByTestId('origin-home-request'), { target: { value: '一時エラー時も再試行しない' } });
    fireEvent.click(screen.getByTestId('start-request-button'));

    await waitFor(() => expect(screen.getByText('現在、無料AIの利用が集中しています。費用0円ポリシーを維持するため自動再試行せず、今回は安全に回答を返せませんでした。少し時間をおいて、もう一度お試しください。')).toBeTruthy());
    expect(fetchMock).toHaveBeenCalledTimes(1);
    expect(screen.queryByText('再試行してはいけない回答')).toBeNull();
    expect(screen.queryByTestId('response-verification-details')).toBeNull();
    vi.unstubAllGlobals();
  });

  it('does not retry a temporary network timeout or display a verified response', async () => {
    const fetchMock = vi.fn()
      .mockRejectedValueOnce(new TypeError('Network request timed out'))
      .mockResolvedValueOnce(new Response('タイムアウト後に表示してはいけない回答', { status: 200 }));
    vi.stubGlobal('fetch', fetchMock);
    render(<App language="ja" />);
    fireEvent.change(screen.getByTestId('origin-home-request'), { target: { value: '通信障害時も再試行しない' } });
    fireEvent.click(screen.getByTestId('start-request-button'));

    await waitFor(() => expect(screen.getByText('現在、無料AIの利用が集中しています。費用0円ポリシーを維持するため自動再試行せず、今回は安全に回答を返せませんでした。少し時間をおいて、もう一度お試しください。')).toBeTruthy());
    expect(fetchMock).toHaveBeenCalledTimes(1);
    expect(screen.queryByText('タイムアウト後に表示してはいけない回答')).toBeNull();
    expect(screen.queryByTestId('response-verification-details')).toBeNull();
    vi.unstubAllGlobals();
  });

  it('fails closed with the zero-cost busy notice after one network timeout', async () => {
    const fetchMock = vi.fn().mockRejectedValue(new TypeError('Network request timed out'));
    vi.stubGlobal('fetch', fetchMock);
    render(<App language="ja" />);
    fireEvent.change(screen.getByTestId('origin-home-request'), { target: { value: '通信停止時の案内を確認' } });
    fireEvent.click(screen.getByTestId('start-request-button'));

    await waitFor(() => expect(screen.getByText('現在、無料AIの利用が集中しています。費用0円ポリシーを維持するため自動再試行せず、今回は安全に回答を返せませんでした。少し時間をおいて、もう一度お試しください。')).toBeTruthy());
    expect(fetchMock).toHaveBeenCalledTimes(1);
    expect(screen.queryByTestId('response-verification-details')).toBeNull();
    vi.unstubAllGlobals();
  });
'''
          if old not in text:
              raise SystemExit('App retry regression block not found')
          app.write_text(text.replace(old, new, 1))

          e2e = Path('tests/e2e/origin-personal-navigation.spec.ts')
          text = e2e.read_text()
          old = '''  test('retries a transient transport failure exactly once before verifying its answer', async ({ page }) => {
    let attempts = 0;
    await page.route('**/api/chat', async (route) => {
      attempts += 1;
      await route.fulfill(attempts === 1
        ? { status: 503, contentType: 'text/plain', body: 'Temporary upstream failure' }
        : { status: 200, contentType: 'text/plain', body: '通信は自動的に復旧しました。' });
    });
    await page.goto('/');
    await page.getByTestId('origin-home-request').fill('一時的な通信障害から復旧');
    await page.getByTestId('start-request-button').click();

    await expect(page.getByText('通信は自動的に復旧しました。')).toBeVisible();
    await expect(page.getByTestId('response-verification-details')).toBeVisible();
    expect(attempts).toBe(2);
  });
'''
          new = '''  test('does not automatically retry a transient transport failure', async ({ page }) => {
    let attempts = 0;
    await page.route('**/api/chat', async (route) => {
      attempts += 1;
      await route.fulfill({ status: 503, contentType: 'text/plain', body: 'Temporary upstream failure' });
    });
    await page.goto('/');
    await page.getByTestId('origin-home-request').fill('一時的な通信障害では自動再試行しない');
    await page.getByTestId('start-request-button').click();

    await expect(page.getByText('現在、無料AIの利用が集中しています。費用0円ポリシーを維持するため自動再試行せず、今回は安全に回答を返せませんでした。少し時間をおいて、もう一度お試しください。')).toBeVisible();
    await expect(page.getByTestId('response-verification-details')).toHaveCount(0);
    expect(attempts).toBe(1);
  });
'''
          if old not in text:
              raise SystemExit('E2E retry regression block not found')
          text = text.replace(old, new, 1)
          text = text.replace("test('shows the zero-cost congestion notice without a verified trace after provider retries'", "test('shows the zero-cost congestion notice without a verified trace or client retry'")
          text = text.replace('費用0円ポリシーを維持したまま再試行していますが、今回は安全に回答を返せませんでした。', '費用0円ポリシーを維持するため自動再試行せず、今回は安全に回答を返せませんでした。')
          e2e.write_text(text)

          workflow = Path('.github/workflows/verify-free-model.yml')
          text = workflow.read_text()
          old_model = 'google/gemma-4-26b-a4b-it:free'
          if old_model not in text:
              raise SystemExit('old free model reference not found in verification workflow')
          workflow.write_text(text.replace(old_model, 'nex-agi/nex-n2-pro:free'))
          PY
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/origin-zero-retry-test-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test: enforce fail-closed zero-retry behavior'
          git push origin HEAD:fix/origin-zdr-free-model
