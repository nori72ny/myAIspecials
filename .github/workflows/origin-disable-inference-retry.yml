name: ORIGIN disable inference retry

on:
  push:
    branches:
      - fix/origin-zdr-free-model
    paths:
      - .github/workflows/origin-disable-inference-retry.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/origin-zdr-free-model
      - name: Enforce zero client inference retries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/App.tsx')
          text = path.read_text()
          pattern = re.compile(r"const isTransientHttpStatus = .*?\n\nasync function fetchOriginChatWithOneRetry\(body: string, signal: AbortSignal\): Promise<Response> \{.*?\n\}\n\n", re.S)
          replacement = "async function fetchOriginChat(body: string, signal: AbortSignal): Promise<Response> {\n  return fetch('/api/chat', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },\n    signal,\n    body,\n  });\n}\n\n"
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('retry helper replacement did not match exactly once')
          text = text.replace('fetchOriginChatWithOneRetry(', 'fetchOriginChat(')
          text = text.replace('費用0円ポリシーを維持したまま再試行していますが、今回は安全に回答を返せませんでした。', '費用0円ポリシーを維持するため自動再試行せず、今回は安全に回答を返せませんでした。')
          text = text.replace('ORIGIN is retrying within the $0 policy, but it could not safely return an answer this time.', 'ORIGIN does not automatically retry inference under the $0 policy, so it could not safely return an answer this time.')
          path.write_text(text)
          PY
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/origin-disable-inference-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce zero client inference retries'
          git push origin HEAD:fix/origin-zdr-free-model
