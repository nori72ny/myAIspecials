name: Verify free model evidence

on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Refresh the verified evidence windows immediately
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-free-model.yml'
      - 'scripts/verify-free-model.ts'
      - 'scripts/verify-free-model.test.ts'
      - 'scripts/verify-coding-free-model.ts'
      - 'scripts/verify-coding-free-model.test.ts'
      - 'src/lib/orchestration/OriginFreeModelCatalog.ts'
      - 'src/agent/codingFreeModelFailoverV14.ts'
      - 'src/agent/codingFreeModelFailoverV14.test.ts'
      - 'src/agent/codingProviderRetryV14.ts'
      - 'src/agent/codingProviderRetryV14.test.ts'
      - 'src/release/OriginLegacyCredentialIsolation.test.ts'

concurrency:
  group: verify-free-model-evidence
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the exact default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify fixed chat free-model evidence
        env:
          ORIGIN_FREE_MODEL_EVIDENCE_PATH: ${{ runner.temp }}/origin-free-model-evidence.json
          ORIGIN_FORCE_FREE_MODEL_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_refresh && 'true' || 'false' }}
        run: |
          if [ "$ORIGIN_FORCE_FREE_MODEL_REFRESH" = 'true' ]; then
            npm run verify:free-model -- --force
          else
            npm run verify:free-model
          fi
      - name: Verify fixed Coding free-model evidence
        env:
          ORIGIN_CODING_FREE_MODEL_EVIDENCE_PATH: ${{ runner.temp }}/origin-coding-free-model-evidence.json
          ORIGIN_FORCE_FREE_MODEL_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_refresh && 'true' || 'false' }}
        run: |
          if [ "$ORIGIN_FORCE_FREE_MODEL_REFRESH" = 'true' ]; then
            npm run verify:coding-free-model -- --force
          else
            npm run verify:coding-free-model
          fi
      - name: Validate machine-readable zero-cost evidence
        env:
          CHAT_EVIDENCE: ${{ runner.temp }}/origin-free-model-evidence.json
          CODING_EVIDENCE: ${{ runner.temp }}/origin-coding-free-model-evidence.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const chat = JSON.parse(fs.readFileSync(process.env.CHAT_EVIDENCE, 'utf8'));
          const coding = JSON.parse(fs.readFileSync(process.env.CODING_EVIDENCE, 'utf8'));
          const invalid = evidence => evidence.pricing?.prompt !== '0'
            || evidence.pricing?.completion !== '0'
            || Date.parse(evidence.reviewAfter) <= Date.now();
          if (chat.modelId !== 'inclusionai/ling-3.0-flash-sante:free' || invalid(chat)) {
            throw new Error('Chat free-model evidence is invalid, paid, or expired.');
          }
          if (coding.modelId !== 'inclusionai/ling-3.0-flash-vl:free' || coding.toolCalling !== true || invalid(coding)) {
            throw new Error('Coding free-model evidence is invalid, paid, lacks tool calling, or expired.');
          }
          for (const [label, evidence] of [['Chat', chat], ['Coding', coding]]) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              `## ${label} fixed free-model verification`,
              `- Model: ${evidence.modelId}`,
              `- Prompt price: $${evidence.pricing.prompt}.00`,
              `- Completion price: $${evidence.pricing.completion}.00`,
              `- Verified at: ${evidence.verifiedAt}`,
              `- Evidence valid through: ${evidence.reviewAfter}`,
              `- Official source: ${evidence.sourceUrl}`,
              `- Catalog refreshed: ${evidence.updated}`,
              '',
            ].join('\n'));
          }
          NODE
      - name: Preserve machine-readable zero-cost evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: origin-free-model-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/origin-free-model-evidence.json
            ${{ runner.temp }}/origin-coding-free-model-evidence.json
          retention-days: 30
          if-no-files-found: error
      - name: Test fail-closed verifier and runtime policies
        run: npx vitest run scripts/verify-free-model.test.ts scripts/verify-coding-free-model.test.ts src/lib/orchestration/OriginFreeModelCatalog.test.ts src/agent/codingFreeModelFailoverV14.test.ts src/agent/codingProviderRetryV14.test.ts src/release/OriginLegacyCredentialIsolation.test.ts
      - name: Open an evidence refresh pull request only when timestamps changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/lib/orchestration/OriginFreeModelCatalog.ts src/agent/codingFreeModelFailoverV14.ts; then
            echo 'Evidence remains current; no pull request required.'
            exit 0
          fi
          branch="automation/free-model-evidence-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add src/lib/orchestration/OriginFreeModelCatalog.ts src/agent/codingFreeModelFailoverV14.ts
          git commit -m 'chore: refresh verified free-model evidence'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'chore: refresh verified free-model evidence' --body 'Automated fail-closed verification confirmed the fixed Chat and Coding models still report zero prompt/completion pricing; Coding also still advertises tool calling. Runtime continues to enforce ZDR/data-collection deny/max-price zero and exact served-model/cost checks. Full CI must pass before merge.'
      - name: Mark paid, unavailable, or expired evidence as unsafe
        if: failure()
        run: |
          echo '::error::Free-model evidence could not be proven at $0.00. Paid fallback remains disabled and expired runtime evidence fails closed.'
          echo '### Free-model verification failed; paid fallback remains disabled.' >> "$GITHUB_STEP_SUMMARY"
