name: Verify free model evidence

on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Refresh the verified evidence window immediately
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-free-model.yml'
      - 'scripts/verify-free-model.ts'
      - 'scripts/verify-free-model.test.ts'
      - 'scripts/check-free-model-expiry.sh'
      - 'src/lib/orchestration/OriginFreeModelCatalog.ts'

concurrency:
  group: verify-free-model-evidence
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout the exact default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify official OpenRouter zero pricing and evidence expiry
        id: verify
        env:
          ORIGIN_FREE_MODEL_EVIDENCE_PATH: ${{ runner.temp }}/origin-free-model-evidence.json
          ORIGIN_FORCE_FREE_MODEL_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_refresh && 'true' || 'false' }}
        run: |
          if [ "$ORIGIN_FORCE_FREE_MODEL_REFRESH" = 'true' ]; then
            npm run verify:free-model -- --force
          else
            npm run verify:free-model
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync(process.env.ORIGIN_FREE_MODEL_EVIDENCE_PATH, 'utf8'));
          if (evidence.modelId !== 'google/gemma-4-31b-it:free'
            || evidence.pricing.prompt !== '0'
            || evidence.pricing.completion !== '0'
            || Date.parse(evidence.reviewAfter) <= Date.now()) {
            throw new Error('Free-model evidence is invalid, paid, or already expired.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `review_after=${evidence.reviewAfter}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Fixed free-model verification',
            `- Model: ${evidence.modelId}`,
            `- Prompt price: $${evidence.pricing.prompt}.00`,
            `- Completion price: $${evidence.pricing.completion}.00`,
            `- Verified at: ${evidence.verifiedAt}`,
            `- Evidence valid through: ${evidence.reviewAfter}`,
            `- Official source: ${evidence.sourceUrl}`,
            `- Catalog refreshed: ${evidence.updated}`,
            '',
          ].join('\n'));
          NODE
      - name: Preserve machine-readable zero-cost evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: origin-free-model-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/origin-free-model-evidence.json
          retention-days: 30
          if-no-files-found: error
      - name: Test fail-closed verifier and catalog policy
        run: npx vitest run scripts/verify-free-model.test.ts src/lib/orchestration/OriginFreeModelCatalog.test.ts
      - name: Open an evidence refresh pull request only when timestamps changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/lib/orchestration/OriginFreeModelCatalog.ts; then
            echo 'Evidence remains current; no pull request required.'
            exit 0
          fi
          branch="automation/free-model-evidence-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add src/lib/orchestration/OriginFreeModelCatalog.ts
          git commit -m 'chore: refresh verified free-model evidence'
          git push origin "$branch"

          # A failed PR creation must fail this run. Until 2026-11 this step
          # warned and exited 0, which silently dropped evidence refreshes
          # and contributed to a 7-day production outage (expired evidence
          # reached production unnoticed). Do not reintroduce that fallback.
          pr_output="$(gh pr create --base main --head "$branch" --title 'chore: refresh verified free-model evidence' --body 'Automated fail-closed verification confirmed the fixed OpenRouter model still reports zero prompt and completion pricing. Full CI must pass before merge.' 2>&1)" || {
            echo "::error::Zero-cost evidence was verified and branch $branch was pushed, but GitHub Actions could not create the pull request automatically. Failing this run so the undelivered refresh is impossible to miss."
            {
              echo '### Evidence refresh branch pushed; PR creation FAILED and this run is marked failed.'
              echo "- Branch: $branch"
              echo '- Pricing verification and fail-closed tests passed.'
              echo '- Create the pull request manually from the branch above, or fix the Actions pull-request permission, then re-run this workflow.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo "$pr_output" >> "$GITHUB_STEP_SUMMARY"
      - name: Open an expiry alert issue when the evidence on main is expiring or expired
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # Matches DEFAULT_REFRESH_THRESHOLD_DAYS in scripts/verify-free-model.ts:
          # at or below this many days of remaining evidence validity, the
          # refresh is due and a human must make sure it lands in time.
          EVIDENCE_ALERT_THRESHOLD_DAYS: '3'
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          # Assess the catalog exactly as committed on the triggering main
          # revision (GITHUB_SHA), not the possibly refreshed working copy.
          catalog_snapshot="$RUNNER_TEMP/main-OriginFreeModelCatalog.ts"
          git show "${GITHUB_SHA}:src/lib/orchestration/OriginFreeModelCatalog.ts" > "$catalog_snapshot"
          assessment="$(bash scripts/check-free-model-expiry.sh "$catalog_snapshot" "$EVIDENCE_ALERT_THRESHOLD_DAYS")"
          echo "$assessment"
          review_after="$(printf '%s\n' "$assessment" | sed -n 's/^review_after=//p')"
          remaining_seconds="$(printf '%s\n' "$assessment" | sed -n 's/^remaining_seconds=//p')"
          expired="$(printf '%s\n' "$assessment" | sed -n 's/^expired=//p')"
          alert="$(printf '%s\n' "$assessment" | sed -n 's/^alert=//p')"
          if [ "$alert" != 'true' ]; then
            echo "Evidence on main is valid through $review_after; no expiry alert required."
            exit 0
          fi
          title="[free-model-evidence-alert] Free-model evidence expires ${review_after} (google/gemma-4-31b-it:free)"
          existing_titles="$(gh issue list --state open --limit 50 --search '"free-model-evidence-alert" in:title' --json title --jq '.[].title')"
          if printf '%s\n' "$existing_titles" | grep -Fq "$review_after"; then
            echo "An open alert issue already covers evidence expiring $review_after; skipping a duplicate."
            exit 0
          fi
          remaining_days=$((remaining_seconds / 86400))
          if [ "$expired" = 'true' ]; then
            urgency='EXPIRED: the evidence validity window has already ended. Production chat fails closed (503 FREE_MODEL_EVIDENCE_STALE) until refreshed evidence is merged AND deployed.'
          else
            urgency="EXPIRING: about ${remaining_days} day(s) of evidence validity remain."
          fi
          body_file="$RUNNER_TEMP/free-model-evidence-alert.md"
          {
            echo '## Free-model evidence expiry alert'
            echo ''
            echo "- Model: \`google/gemma-4-31b-it:free\` (fixed free chat model)"
            echo "- Evidence valid through (reviewAfter): **${review_after}**"
            echo "- Status: ${urgency}"
            echo "- Verification step outcome in the detecting run: ${VERIFY_OUTCOME}"
            echo "- Detecting run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo '## Required action (owner approval stays mandatory; nothing is auto-merged or auto-deployed)'
            echo ''
            echo '1. Find the latest automated refresh pull request (branch `automation/free-model-evidence-*`) and confirm its CI is fully green.'
            echo '2. Owner reviews and approves the merge of that PR into `main`.'
            echo '3. Deploy the merged `main` to production manually (Vercel: Create Deployment for the merged commit, then Promote) and confirm `/api/health` reports the merged `releaseSha`.'
            echo '4. Close this issue once production runs on the refreshed evidence.'
            echo ''
            echo "Full procedure: docs/FREE_MODEL_EVIDENCE_OPERATIONS.md (${{ github.server_url }}/${{ github.repository }}/blob/main/docs/FREE_MODEL_EVIDENCE_OPERATIONS.md)"
            echo ''
            echo 'Paid fallback remains disabled at all times; this alert never authorizes a paid model or an automatic merge/deploy.'
          } > "$body_file"
          gh issue create --title "$title" --body-file "$body_file"
      - name: Mark paid, unavailable, or expired evidence as unsafe
        if: failure()
        run: |
          echo '::error::Free-model evidence verification or refresh delivery failed. Paid fallback remains disabled and expired runtime evidence fails closed.'
          echo '### Free-model verification or refresh delivery failed; paid fallback remains disabled.' >> "$GITHUB_STEP_SUMMARY"
