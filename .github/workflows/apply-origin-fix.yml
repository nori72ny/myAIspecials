name: Apply ORIGIN Personal Overhaul
on:
  push:
    paths:
      - '.github/workflows/apply-origin-fix.yml'
  workflow_dispatch:

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate All Overhaul Files
        run: |
          mkdir -p src/styles src/components src/lib/provider src/lib/artifacts src/app/api/chat src/app/api/image/generate src/hooks scripts

          cat << 'EOF' > src/styles/globals.css
          @tailwind base;
          @tailwind components;
          @tailwind utilities;

          :root {
            --background: #fbfbfd;
            --surface: #ffffff;
            --surface-raised: #ffffff;
            --chat-bg: #f5f5f7;
            --input-bg: #ffffff;
            --input-border: rgba(0, 0, 0, 0.08);
            --bubble-ai: #ffffff;
            --bubble-user: #0071e3;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --shadow-subtle: 0 1px 2px rgba(0, 0, 0, 0.04);
            --ring-focus: rgba(0, 113, 227, 0.3);
          }

          .dark {
            --background: #08090a;
            --surface: #0f1011;
            --surface-raised: #151618;
            --chat-bg: #08090a;
            --input-bg: #0f1011;
            --input-border: rgba(255, 255, 255, 0.08);
            --bubble-ai: #121315;
            --bubble-user: #0071e3;
            --text-primary: #f7f8f8;
            --text-secondary: #8a8f98;
            --shadow-subtle: 0 1px 2px rgba(0, 0, 0, 0.4);
            --ring-focus: rgba(255, 255, 255, 0.15);
          }

          html, body {
            background-color: var(--background) !important;
            color: var(--text-primary) !important;
            min-height: 100dvh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
          }
          EOF

          cat << 'EOF' > src/components/ThemeProvider.tsx
          'use client';
          import * as React from 'react';
          import { ThemeProvider as NextThemesProvider, useTheme } from 'next-themes';

          function ThemeWatcher({ children }: { children: React.ReactNode }) {
            const { setTheme } = useTheme();
            React.useEffect(() => {
              const applySavedTheme = () => {
                if (typeof window === 'undefined') return;
                const saved = localStorage.getItem('origin_theme_setting');
                if (saved === 'light' || saved === 'dark' || saved === 'system') {
                  setTheme(saved);
                  if (saved === 'light') { document.documentElement.classList.remove('dark'); }
                  else if (saved === 'dark') { document.documentElement.classList.add('dark'); }
                }
              };
              applySavedTheme();
              window.addEventListener('storage', applySavedTheme);
              return () => window.removeEventListener('storage', applySavedTheme);
            }, [setTheme]);
            return <>{children}</>;
          }

          export function ThemeProvider({ children }: { children: React.ReactNode }) {
            return (
              <NextThemesProvider attribute="class" defaultTheme="system" enableSystem={true} disableTransitionOnChange>
                <ThemeWatcher>{children}</ThemeWatcher>
              </NextThemesProvider>
            );
          }
          EOF

          cat << 'EOF' > src/lib/provider/zeroCostValidator.ts
          export interface ZeroCostValidationResult {
            valid: boolean;
            costUsd: number;
            reason?: string;
          }

          export function validateZeroCostResponse(responseData: any, requestedModelId: string, isByokClient: boolean = false): ZeroCostValidationResult {
            if (!requestedModelId || !requestedModelId.endsWith(':free')) {
              return { valid: false, costUsd: -1, reason: `NON_FREE_MODEL_REJECTED: Model '${requestedModelId}' is not an authorized :free endpoint.` };
            }
            if (isByokClient || responseData?.is_byok === true) {
              return { valid: false, costUsd: -1, reason: 'BYOK_REJECTED: BYOK routing is forbidden in 0-yen flow.' };
            }
            const reportedCost = responseData?.costUsd ?? responseData?.usage?.cost;
            if (reportedCost !== undefined && reportedCost !== null) {
              const numericCost = Number(reportedCost);
              if (!Number.isNaN(numericCost) && numericCost > 0) {
                return { valid: false, costUsd: numericCost, reason: `BILLING_DETECTED: Non-zero cost $${numericCost} USD detected. Aborted.` };
              }
            }
            const replyContent = responseData?.choices?.[0]?.message?.content;
            if (typeof replyContent !== 'string' || replyContent.trim().length === 0) {
              return { valid: false, costUsd: 0, reason: 'EMPTY_RESPONSE_DETECTED: Model returned an empty text payload.' };
            }
            return { valid: true, costUsd: 0 };
          }
          EOF

          cat << 'EOF' > src/app/api/chat/route.ts
          import { NextRequest, NextResponse } from 'next/server';
          import { validateZeroCostResponse } from '@/lib/provider/zeroCostValidator';

          const ACTIVE_FREE_CANDIDATES = [
            "meta-llama/llama-3.3-70b-instruct:free",
            "google/gemma-4-31b-it:free",
            "cohere/north-mini-code:free"
          ];

          export async function POST(req: NextRequest) {
            try {
              const { messages } = await req.json();
              const apiKey = process.env.OPENROUTER_API_KEY;
              if (!apiKey) return NextResponse.json({ error: "APIキー未設定" }, { status: 500 });

              const sanitizedMessages = messages.map(({ role, content }: any) => ({ role, content }));
              let selectedData = null;
              let lastErrorMessage = "";

              for (const modelId of ACTIVE_FREE_CANDIDATES) {
                try {
                  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                      "Authorization": `Bearer ${apiKey}`,
                      "Content-Type": "application/json",
                      "HTTP-Referer": "https://origin-personal.vercel.app",
                      "X-Title": "ORIGIN Personal"
                    },
                    body: JSON.stringify({
                      model: modelId,
                      messages: sanitizedMessages,
                      provider: { zdr: true, data_collection: "deny", allow_fallbacks: false }
                    })
                  });
                  if (!res.ok) { lastErrorMessage = `HTTP_${res.status}`; continue; }
                  const data = await res.json();
                  const validation = validateZeroCostResponse(data, modelId, false);
                  if (validation.valid) { selectedData = data; break; }
                  else { lastErrorMessage = validation.reason || "VALIDATION_FAILED"; }
                } catch (err: any) { lastErrorMessage = err.message; }
              }

              if (!selectedData) {
                return NextResponse.json({ error: `無料モデル安全待機中 (${lastErrorMessage})` }, { status: 503 });
              }
              return NextResponse.json(selectedData);
            } catch (error: any) {
              return NextResponse.json({ error: "安全待機中" }, { status: 500 });
            }
          }
          EOF

          cat << 'EOF' > src/app/api/image/generate/route.ts
          import { NextRequest, NextResponse } from 'next/server';
          import { generateAdaptiveSvg } from '@/lib/artifacts/svgGenerator';

          export async function POST(req: NextRequest) {
            try {
              const { prompt } = await req.json();
              const cfAccountId = process.env.CLOUDFLARE_ACCOUNT_ID;
              const cfApiToken = process.env.CLOUDFLARE_API_TOKEN;

              if (cfAccountId && cfApiToken) {
                try {
                  const cfRes = await fetch(
                    `https://api.cloudflare.com/client/v4/accounts/${cfAccountId}/ai/run/@cf/bytedance/stable-diffusion-xl-base-1.0`,
                    {
                      method: 'POST',
                      headers: { Authorization: `Bearer ${cfApiToken}`, 'Content-Type': 'application/json' },
                      body: JSON.stringify({ prompt })
                    }
                  );
                  if (cfRes.ok) {
                    const imageBuffer = await cfRes.arrayBuffer();
                    const base64Image = Buffer.from(imageBuffer).toString('base64');
                    return NextResponse.json({
                      status: 'COMPLETED',
                      artifact: {
                        type: 'image',
                        title: prompt ? prompt.slice(0, 20) : 'Generated Image',
                        content: `<img src="data:image/png;base64,${base64Image}" alt="${prompt}" class="rounded-xl max-w-full h-auto shadow-md" />`
                      }
                    });
                  }
                } catch (cfErr) {}
              }

              const adaptiveSvg = generateAdaptiveSvg(prompt || 'ORIGIN Visual Artwork', { theme: 'light' });
              return NextResponse.json({
                status: 'COMPLETED',
                artifact: {
                  type: 'image',
                  title: prompt ? prompt.slice(0, 20) : 'Vector Artwork',
                  content: adaptiveSvg
                }
              });
            } catch (error: any) {
              const fallbackSvg = generateAdaptiveSvg('ORIGIN Personal', { theme: 'light' });
              return NextResponse.json({
                status: 'COMPLETED',
                artifact: { type: 'image', title: 'ORIGIN Artwork', content: fallbackSvg }
              });
            }
          }
          EOF

          cat << 'EOF' > src/hooks/useChatSession.ts
          import { useState, useEffect, useCallback } from 'react';

          export interface ChatMessage {
            id: string;
            role: 'user' | 'assistant' | 'system';
            content: string;
            timestamp: number;
          }

          export function useChatSession() {
            const [messages, setMessages] = useState<ChatMessage[]>([]);
            const [activeChatId, setActiveChatId] = useState<string | null>(null);
            const [isReady, setIsReady] = useState<boolean>(false);

            useEffect(() => {
              const params = new URLSearchParams(window.location.search);
              const explicitId = params.get('chatId');

              if (explicitId) {
                const stored = localStorage.getItem(`origin_session_${explicitId}`);
                if (stored) {
                  try {
                    const parsed = JSON.parse(stored);
                    setMessages(parsed.messages || []);
                    setActiveChatId(explicitId);
                    setIsReady(true);
                    return;
                  } catch {}
                }
              }
              setMessages([]);
              setActiveChatId(null);
              setIsReady(true);
            }, []);

            const resetToNewChat = useCallback(() => {
              setMessages([]);
              setActiveChatId(null);
              if (typeof window !== 'undefined' && window.history.pushState) {
                window.history.pushState({ path: window.location.pathname }, '', window.location.pathname);
              }
            }, []);

            return { messages, activeChatId, isReady, setMessages, resetToNewChat };
          }
          EOF

          cat << 'EOF' > src/components/ArtifactViewer.tsx
          'use client';
          import * as React from 'react';

          export interface ArtifactData {
            id: string;
            type: 'image' | 'code' | 'document';
            title: string;
            content: string;
          }

          export function ArtifactViewer({ artifact, onClose }: { artifact: ArtifactData | null; onClose: () => void }) {
            const canvasRef = React.useRef<HTMLCanvasElement | null>(null);
            if (!artifact) return null;

            const sanitizeSvg = (rawSvg: string) => {
              return rawSvg
                .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
                .replace(/\s+on\w+\s*=\s*(["'][^"']*["']|[^\s>]+)/gi, '');
            };

            const handleDownloadPng = () => {
              if (artifact.type !== 'image' || !canvasRef.current) return;
              const canvas = canvasRef.current;
              const ctx = canvas.getContext('2d');
              if (!ctx) return;
              const img = new Image();
              const svgBlob = new Blob([sanitizeSvg(artifact.content)], { type: 'image/svg+xml;charset=utf-8' });
              const URL = window.URL || window.webkitURL || window;
              const blobURL = URL.createObjectURL(svgBlob);
              img.onload = () => {
                canvas.width = img.width || 800;
                canvas.height = img.height || 800;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                const pngUrl = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.href = pngUrl;
                downloadLink.download = `${artifact.title.replace(/\s+/g, '_')}.png`;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                URL.revokeObjectURL(blobURL);
              };
              img.src = blobURL;
            };

            return (
              <div className="flex flex-col h-full w-full bg-[var(--surface)] border-l border-[var(--input-border)] text-[var(--text-primary)]">
                <div className="flex items-center justify-between px-4 py-3 border-b border-[var(--input-border)]">
                  <span className="text-xs font-semibold tracking-wider text-[var(--text-secondary)] uppercase">成果物 (Artifact)</span>
                  <div className="flex items-center space-x-2">
                    {artifact.type === 'image' && (
                      <button onClick={handleDownloadPng} className="px-2.5 py-1 text-xs font-medium rounded-lg bg-[var(--input-bg)] border border-[var(--input-border)]">PNG保存</button>
                    )}
                    <button onClick={onClose} className="p-1 text-xs text-[var(--text-secondary)]">✕</button>
                  </div>
                </div>
                <div className="flex-1 overflow-auto p-4 flex items-center justify-center bg-[var(--chat-bg)]">
                  {artifact.type === 'image' ? (
                    <div className="w-full max-w-md shadow-sm rounded-xl overflow-hidden bg-[var(--surface)] p-4 border border-[var(--input-border)]" dangerouslySetInnerHTML={{ __html: sanitizeSvg(artifact.content) }} />
                  ) : (
                    <pre className="w-full h-full p-4 text-xs font-mono bg-[var(--surface)] rounded-xl overflow-auto border border-[var(--input-border)]"><code>{artifact.content}</code></pre>
                  )}
                </div>
                <canvas ref={canvasRef} className="hidden" />
              </div>
            );
          }
          EOF

          cat << 'EOF' > src/components/ChatArea.tsx
          'use client';
          import * as React from 'react';
          import { useChatSession, ChatMessage } from '@/hooks/useChatSession';
          import { ArtifactViewer, ArtifactData } from '@/components/ArtifactViewer';

          export function ChatArea() {
            const { messages, isReady, setMessages } = useChatSession();
            const [input, setInput] = React.useState('');
            const [activeArtifact, setActiveArtifact] = React.useState<ArtifactData | null>(null);
            const [mobileTab, setMobileTab] = React.useState<'chat' | 'artifact'>('chat');
            const [isLoading, setIsLoading] = React.useState(false);

            const handleSend = async () => {
              if (!input.trim() || isLoading) return;
              const userText = input.trim();
              setInput('');
              const userMsg: ChatMessage = { id: `usr_${Date.now()}`, role: 'user', content: userText, timestamp: Date.now() };
              setMessages((prev) => [...prev, userMsg]);
              setIsLoading(true);

              try {
                const payloadMessages = [...messages, userMsg].map(({ role, content }) => ({ role, content }));
                const res = await fetch('/api/chat', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ messages: payloadMessages })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'エラー');

                const aiReply = data.choices?.[0]?.message?.content || '応答を受信しました。';
                setMessages((prev) => [...prev, { id: `ai_${Date.now()}`, role: 'assistant', content: aiReply, timestamp: Date.now() }]);

                if (userText.includes('画像') || userText.includes('生成') || userText.includes('ロゴ')) {
                  const imgRes = await fetch('/api/image/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: userText })
                  });
                  const imgData = await imgRes.json();
                  if (imgData.artifact) {
                    setActiveArtifact(imgData.artifact);
                    setMobileTab('artifact');
                  }
                }
              } catch (err: any) {
                setMessages((prev) => [...prev, { id: `err_${Date.now()}`, role: 'system', content: err.message, timestamp: Date.now() }]);
              } finally {
                setIsLoading(false);
              }
            };

            if (!isReady) return <div className="min-h-[100dvh] bg-[var(--background)]" />;

            return (
              <div className="flex w-full h-[100dvh] overflow-hidden bg-[var(--background)] text-[var(--text-primary)]">
                <div className={`flex-1 flex flex-col h-full max-w-full ${activeArtifact && mobileTab === 'artifact' ? 'hidden md:flex' : 'flex'}`}>
                  <header className="sticky top-0 z-10 flex items-center justify-between px-4 py-3 border-b border-[var(--input-border)] bg-[var(--background)]/80 backdrop-blur-md">
                    <div className="flex items-center space-x-2">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                      <span className="text-xs font-semibold tracking-tight text-[var(--text-secondary)] uppercase">Personal AI OS</span>
                    </div>
                    {activeArtifact && (
                      <div className="flex md:hidden bg-[var(--input-bg)] p-0.5 rounded-xl border border-[var(--input-border)]">
                        <button onClick={() => setMobileTab('chat')} className={`px-3 py-1 text-xs rounded-lg ${mobileTab === 'chat' ? 'bg-[var(--surface)] shadow-sm' : ''}`}>Chat</button>
                        <button onClick={() => setMobileTab('artifact')} className={`px-3 py-1 text-xs rounded-lg ${mobileTab === 'artifact' ? 'bg-[var(--surface)] shadow-sm' : ''}`}>成果物</button>
                      </div>
                    )}
                  </header>

                  <div className="flex-1 overflow-y-auto p-4 space-y-6 max-w-full bg-[var(--chat-bg)]">
                    {messages.map((msg) => (
                 
