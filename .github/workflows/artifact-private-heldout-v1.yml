name: Artifact private held-out V1

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current main SHA to evaluate
        required: true
        type: string
      corpus_id:
        description: Evaluator-owned synthetic private corpus id
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: origin-artifact-private-heldout-v1
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      can_start: ${{ steps.one_shot.outputs.can_start }}
      corpus_digest: ${{ steps.metadata.outputs.corpus_digest }}
    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Install trusted evaluator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify prerequisites and inspect sealed corpus identity
        id: metadata
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CORPUS_ID: ${{ inputs.corpus_id }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORIGIN_ARTIFACT_PRIVATE_CORPUS_GZIP_B64: ${{ secrets.ORIGIN_ARTIFACT_PRIVATE_CORPUS_GZIP_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          test -n "$ORIGIN_ARTIFACT_PRIVATE_CORPUS_GZIP_B64"
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          metadata="$(node --import tsx scripts/inspect-artifact-private-corpus-v1.ts)"
          METADATA="$metadata" CANDIDATE_SHA="$CANDIDATE_SHA" CORPUS_ID="$CORPUS_ID" node <<'NODE' >> "$GITHUB_OUTPUT"
          const value=JSON.parse(process.env.METADATA||'{}');
          if(value.candidateSha!==process.env.CANDIDATE_SHA) process.exit(2);
          if(value.corpusId!==process.env.CORPUS_ID) process.exit(3);
          if(value.taskCount!==16) process.exit(4);
          if(!/^[a-f0-9]{64}$/.test(String(value.corpusDigest||''))) process.exit(5);
          console.log(`corpus_digest=${value.corpusDigest}`);
          NODE

      - name: Check one-shot start marker
        id: one_shot
        env:
          GH_TOKEN: ${{ github.token }}
          CORPUS_DIGEST: ${{ steps.metadata.outputs.corpus_digest }}
        shell: bash
        run: |
          set -euo pipefail
          marker="origin-artifact-private-started-${CORPUS_DIGEST}"
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${marker}&per_page=100" \
            -o prior-artifacts.json
          count="$(node -e "const v=require('./prior-artifacts.json'); process.stdout.write(String(v.total_count||0))")"
          rm -f prior-artifacts.json
          if [ "$count" != '0' ]; then
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            echo "This sealed artifact corpus has already started and cannot be rerun."
            exit 0
          fi
          echo "can_start=true" >> "$GITHUB_OUTPUT"

      - name: Create immutable one-shot start marker
        if: steps.one_shot.outputs.can_start == 'true'
        env:
          CORPUS_ID: ${{ inputs.corpus_id }}
          CORPUS_DIGEST: ${{ steps.metadata.outputs.corpus_digest }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          node <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync('test-results/artifact-private-started.json',JSON.stringify({
            schemaVersion:'origin.artifact-private-start-marker.v1',
            corpusId:process.env.CORPUS_ID,
            corpusDigest:process.env.CORPUS_DIGEST,
            candidateSha:process.env.CANDIDATE_SHA,
            workflowSha:process.env.GITHUB_SHA,
            workflowRunId:process.env.GITHUB_RUN_ID,
            started:true,
          },null,2)+'\n');
          NODE

      - name: Preserve one-shot marker before provider execution
        if: steps.one_shot.outputs.can_start == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: origin-artifact-private-started-${{ steps.metadata.outputs.corpus_digest }}
          path: test-results/artifact-private-started.json
          retention-days: 90
          if-no-files-found: error

  evaluate:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.can_start == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Install evaluator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run sealed 16-case candidate artifact round
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORIGIN_ARTIFACT_PRIVATE_CORPUS_GZIP_B64: ${{ secrets.ORIGIN_ARTIFACT_PRIVATE_CORPUS_GZIP_B64 }}
          ORIGIN_ARTIFACT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ORIGIN_ARTIFACT_CORPUS_ID: ${{ inputs.corpus_id }}
          ORIGIN_ARTIFACT_OUTPUT_DIR: ${{ github.workspace }}/test-results/artifact-private
        run: |
          set -euo pipefail
          npm run eval:artifact-private

      - name: Verify sanitized evidence surface
        shell: bash
        run: |
          set -euo pipefail
          test -f test-results/artifact-private/public-tasks.json
          test -f test-results/artifact-private/candidate-evidence.json
          test -f test-results/artifact-private/candidate-summary.json
          test -d test-results/artifact-private/candidate-artifacts
          test -z "$(find test-results/artifact-private -type f -name '*corpus*' -o -name '*prompt*')"

      - name: Upload candidate artifacts and sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artifact-private-candidate-${{ needs.preflight.outputs.corpus_digest }}
          path: test-results/artifact-private/
          retention-days: 90
          if-no-files-found: error
