name: oneoff-bounded-retry-fix
on:
  push:
    branches:
      - fix/bounded-top-level-provider-attempt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove top-level retry amplification
        shell: bash
        run: |
          set -euo pipefail
          file="src/legacy/originChatRouter.ts"
          python - <<'PY'
          from pathlib import Path
          p = Path("src/legacy/originChatRouter.ts")
          s = p.read_text()
          old = "const MAX_RETRIES = 3;"
          new = "const MAX_RETRIES = 0;"
          if old not in s:
              raise SystemExit("expected MAX_RETRIES declaration not found")
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/legacy/originChatRouter.ts
          git commit -m "fix: bound top-level provider execution to one pass"
          git push
