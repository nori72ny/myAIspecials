name: Provider Option Audit

on:
  push:
    branches:
      - audit/free-general-model-20260908

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit live OpenRouter free InclusionAI candidates
        shell: bash
        run: |
          node <<'NODE'
          const candidates = [
            'inclusionai/ling-3.0-flash:free',
            'inclusionai/ling-3.0-flash-sante:free',
            'inclusionai/ling-3.0-flash-fin:free',
            'inclusionai/ling-2.6-flash:free',
          ];
          const modelsRes = await fetch('https://openrouter.ai/api/v1/models', { headers: { accept: 'application/json' } });
          console.log('models_status=' + modelsRes.status);
          const modelsJson = await modelsRes.json();
          const byId = new Map((modelsJson.data || []).map((m) => [m.id, m]));
          for (const id of candidates) {
            const m = byId.get(id);
            console.log(JSON.stringify({
              id,
              listed: Boolean(m),
              prompt: m?.pricing?.prompt ?? null,
              completion: m?.pricing?.completion ?? null,
              context_length: m?.context_length ?? null,
              supported_parameters: m?.supported_parameters ?? null,
            }));
            if (!m) continue;
            const url = `https://openrouter.ai/api/v1/models/${id}/endpoints`;
            const r = await fetch(url, { headers: { accept: 'application/json' } });
            let j = null;
            try { j = await r.json(); } catch {}
            const endpoints = (j?.data?.endpoints || j?.endpoints || []).map((e) => ({
              provider_name: e.provider_name ?? e.name ?? e.provider ?? null,
              model_name: e.model_name ?? null,
              prompt: e.pricing?.prompt ?? null,
              completion: e.pricing?.completion ?? null,
              status: e.status ?? null,
              uptime_last_1d: e.uptime_last_1d ?? null,
              supports_tools: e.supported_parameters?.includes?.('tools') ?? null,
            }));
            console.log(JSON.stringify({ id, endpoints_status: r.status, endpoints }));
          }
          NODE
