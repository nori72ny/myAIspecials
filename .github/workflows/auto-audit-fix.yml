name: Auto Audit Fix

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/origin-v16-pwa-boundary'
    paths:
      - '.github/workflows/auto-audit-fix.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-audit-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply production dependency fixes
        run: npm audit fix --omit=dev

      - name: Require a clean production audit
        run: npm audit --omit=dev --audit-level=low

      - name: Commit dependency manifest changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifest changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): remediate production npm audit findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger production CI on the updated branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Production Release CI/CD" --ref "${GITHUB_REF_NAME}" -f verification_phase=prepublish

      - name: Trigger ACOS Quality Gate on the updated branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow list --all
          gh workflow run "ACOS 2.0 Quality Gate" --ref "${GITHUB_REF_NAME}"
