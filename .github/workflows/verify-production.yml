name: Verify Production Browser

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/verify-production.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-production.yml"

permissions:
  contents: read

concurrency:
  group: verify-production-browser
  cancel-in-progress: false

jobs:
  production-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real-browser production verification
        shell: bash
        run: |
          mkdir -p production-verification
          cat > production-verification/verify-production.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';

          const target = 'https://origin-personal.vercel.app/';
          const errors = [];
          const events = [];
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          page.on('console', msg => {
            if (msg.type() === 'error') errors.push({ type: 'console', text: msg.text() });
          });
          page.on('pageerror', error => errors.push({ type: 'pageerror', text: error.stack || error.message }));
          page.on('requestfailed', request => {
            events.push({ type: 'requestfailed', url: request.url(), failure: request.failure()?.errorText || 'unknown' });
          });
          page.on('response', response => {
            if (response.status() >= 400) events.push({ type: 'http-error', status: response.status(), url: response.url() });
          });
          await page.addInitScript(() => {
            window.__cspViolations = [];
            window.addEventListener('securitypolicyviolation', event => {
              window.__cspViolations.push({
                directive: event.effectiveDirective,
                blockedURI: event.blockedURI,
                sourceFile: event.sourceFile,
                lineNumber: event.lineNumber
              });
            });
          });

          const result = { target, startedAt: new Date().toISOString(), checks: [], consoleErrors: errors, events };
          const check = (name, pass, detail) => {
            result.checks.push({ name, pass, detail });
            console.log(`[${pass ? 'PASS' : 'FAIL'}] ${name}: ${detail}`);
            if (!pass) result.failed = true;
          };
          try {
            console.log(`[NAVIGATE] ${target}`);
            const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 90000 });
            check('Production HTTP response', Boolean(response && response.ok()), response ? `HTTP ${response.status()}` : 'no main document response');
            await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
            const toggle = page.getByRole('button', { name: /ORIGIN ULTRA v16 を開く|ULTRA v16/i }).first();
            await toggle.waitFor({ state: 'visible', timeout: 30000 }).catch(() => {});
            const found = await toggle.isVisible().catch(() => false);
            check('ULTRA v16 button rendered', found, found ? `visible; text="${(await toggle.innerText()).trim()}"; aria-label="${await toggle.getAttribute('aria-label')}"` : 'NotFound: no visible button matched expected accessible name');
            if (found) {
              const rect = await toggle.boundingBox();
              check('Button positioned at top center', Boolean(rect && rect.y <= 24 && Math.abs((rect.x + rect.width / 2) - 720) <= 100), rect ? JSON.stringify(rect) : 'no bounding box');
              await toggle.click();
              const panel = page.locator('[data-testid="origin-ultra-v16"]');
              await panel.waitFor({ state: 'visible', timeout: 15000 }).catch(() => {});
              const panelVisible = await panel.isVisible().catch(() => false);
              check('Panel expands after click', panelVisible, panelVisible ? (await panel.innerText()).slice(0, 500) : 'panel DOM not visible after click');
              if (panelVisible) {
                check('IndexedDB task queue UI present', await panel.getByText(/調査タスクキュー/).count() > 0, 'expected task queue heading');
                const diagnosticButton = panel.getByRole('button', { name: /自己診断/ });
                check('Self-diagnosis control present', await diagnosticButton.count() > 0, 'self-diagnosis button');
                const dbs = await page.evaluate(async () => {
                  if (typeof indexedDB.databases !== 'function') return { supported: false, names: [] };
                  return { supported: true, names: (await indexedDB.databases()).map(db => db.name) };
                });
                check('IndexedDB database initialized', dbs.supported && dbs.names.includes('OriginUltraV16'), JSON.stringify(dbs));
                if (await diagnosticButton.count()) {
                  await diagnosticButton.click();
                  await panel.getByText(/IndexedDB 永続化/).waitFor({ state: 'visible', timeout: 15000 }).catch(() => {});
                  check('Self-diagnosis results rendered', await panel.getByText(/IndexedDB 永続化/).count() > 0, 'diagnostic output should include IndexedDB persistence');
                }
                await page.screenshot({ path: 'production-verification/production-panel.png', fullPage: false });
              }
            }
            const cspViolations = await page.evaluate(() => window.__cspViolations || []);
            result.cspViolations = cspViolations;
            check('No Content Security Policy violations', cspViolations.length === 0, JSON.stringify(cspViolations));
            check('No browser console errors or uncaught page errors', errors.length === 0, JSON.stringify(errors));
          } catch (error) {
            result.failed = true;
            result.fatalError = error.stack || String(error);
            console.error('[FATAL]', result.fatalError);
          } finally {
            result.finishedAt = new Date().toISOString();
            result.consoleErrors = errors;
            result.events = events;
            fs.writeFileSync('production-verification/result.json', JSON.stringify(result, null, 2));
            console.log('[RESULT_JSON] production-verification/result.json');
            await browser.close();
          }
          if (result.failed || result.checks.some(item => !item.pass)) process.exitCode = 1;
          EOF
          set -o pipefail
          node production-verification/verify-production.mjs 2>&1 | tee production-verification/run.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-verification
          path: production-verification/
          if-no-files-found: warn
          retention-days: 14
