name: ORIGIN UI targeted repair
on:
  push:
    branches:
      - ui/origin-chatgpt-claude-perplexity-refresh
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'nori72ny'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact App.tsx repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from pathlib import Path
          import base64, json, os, re, subprocess, tempfile
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          required = ('localStorage.clear()', 'sessionStorage.clear()', 'window.location.href')
          if not all(x in text for x in required):
              raise SystemExit('Legacy header handler is not present; refusing to guess.')
          positions = [text.index(x) for x in required]
          first = min(positions)
          open_start = text.rfind('<div', 0, first)
          open_end = text.find('>', open_start)
          if open_start < 0 or open_end < 0 or first > open_end:
              raise SystemExit('Could not locate legacy wrapper opening tag.')
          opening = text[open_start:open_end + 1]
          attr_rel = opening.find('onClick={')
          if attr_rel < 0:
              raise SystemExit('Could not locate legacy onClick attribute.')
          attr_start = open_start + attr_rel
          brace = text.find('{', attr_start, open_end + 1)
          depth = 0
          end = None
          quote = None
          escaped = False
          for i in range(brace, open_end + 1):
              ch = text[i]
              if quote:
                  if escaped: escaped = False
                  elif ch == '\\': escaped = True
                  elif ch == quote: quote = None
                  continue
              if ch in "'\"`": quote = ch
              elif ch == '{': depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('Malformed legacy onClick attribute.')
          text = text[:attr_start] + text[end:]
          matches = list(re.finditer(r'>\s*Personal\s*<', text))
          if not matches:
              raise SystemExit('Personal header badge was not found.')
          m = matches[0]
          text = text[:m.start()] + '>Personal 2.0<' + text[m.end():]
          if any(x in text for x in required):
              raise SystemExit('Legacy storage/navigation handler still remains.')
          path.write_text(text, encoding='utf-8')
          path = path.as_posix()
          current = json.loads(subprocess.check_output(['gh','api','repos/nori72ny/myAIspecials/contents/'+path+'?ref='+os.environ.get('GITHUB_REF_NAME','')], text=True))
          payload = {'message':'fix: restore personal header actions safely','content':base64.b64encode(text.encode()).decode(),'sha':current['sha'],'branch':os.environ['GITHUB_REF_NAME']}
          with tempfile.NamedTemporaryFile('w', delete=False) as f:
              json.dump(payload,f); name=f.name
          subprocess.check_call(['gh','api','--method','PUT','repos/nori72ny/myAIspecials/contents/'+path,'--input',name])
          os.unlink(name)
      - name: Remove repair workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha=$(gh api "repos/nori72ny/myAIspecials/contents/.github/workflows/origin-ui-targeted-repair.yml?ref=${GITHUB_REF_NAME}" --jq .sha)
          gh api --method DELETE "repos/nori72ny/myAIspecials/contents/.github/workflows/origin-ui-targeted-repair.yml" -f message='chore: remove temporary UI repair workflow' -f sha="$sha" -f branch="$GITHUB_REF_NAME"
