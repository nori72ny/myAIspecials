name: World-class image private held-out V2

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current main SHA to evaluate
        required: true
        type: string
      corpus_id:
        description: Evaluator-owned synthetic private image corpus id
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: origin-world-class-image-private-heldout-v2
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      can_start: ${{ steps.one_shot.outputs.can_start }}
      corpus_digest: ${{ steps.metadata.outputs.corpus_digest }}
    steps:
      # Refuse exposure of confidential images in public Actions artifacts.
      - name: Verify approved private evaluator repository before any data access
        id: private_repo_guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRIVATE_IMAGE_EVAL_REPOSITORY: ${{ vars.ORIGIN_PRIVATE_IMAGE_EVAL_REPOSITORY }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event.repository.private }}" != "true" || "${{ github.repository_visibility }}" != "private" ]]; then
            echo 'IMAGE_EVAL_PRIVATE_REPOSITORY_REQUIRED' >&2
            exit 73
          fi
          if [[ -z "$EXPECTED_PRIVATE_IMAGE_EVAL_REPOSITORY" || "$GITHUB_REPOSITORY" != "$EXPECTED_PRIVATE_IMAGE_EVAL_REPOSITORY" ]]; then
            echo 'IMAGE_EVAL_PRIVATE_REPOSITORY_ALLOWLIST_REQUIRED' >&2
            exit 74
          fi
          actual="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private' 2>/dev/null)" || {
            echo 'IMAGE_EVAL_REPOSITORY_METADATA_UNAVAILABLE' >&2
            exit 75
          }
          if [[ "$actual" != "true" ]]; then
            echo 'IMAGE_EVAL_REPOSITORY_BECAME_PUBLIC' >&2
            exit 76
          fi

      - name: Checkout exact main candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Install evaluator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify exact candidate binding and zero-cost policy
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          node -e "process.stdout.write('zero-cost-only\n')"

      - name: Block unsafe one-day 24-case FLUX 9B Free benchmark
        shell: bash
        run: |
          set -euo pipefail
          # The old one-shot benchmark would exhaust Workers Free and permanently burn its corpus marker.
          # Shard execution and immutable multi-day aggregation must be installed before enabling real inference.
          node --import tsx --input-type=module <<'NODE'
          import { monolithicImageFreePlanIsSafeV1 } from './src/release/OriginImageWorkersFreeShardPlanV1.ts';
          if (!monolithicImageFreePlanIsSafeV1(24)) {
            console.error('WORLD_CLASS_IMAGE_PRIVATE_MULTI_DAY_SHARDING_REQUIRED');
            process.exit(42);
          }
          NODE

      - name: Prove Cloudflare Free image readiness before sealed corpus access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ORIGIN_IMAGE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ORIGIN_CLOUDFLARE_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          ORIGIN_RASTER_LIVE_QUALIFICATION='true' npm run qualify:raster-live

      - name: Verify sealed corpus metadata only after provider preflight
        id: metadata
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CORPUS_ID: ${{ inputs.corpus_id }}
          ORIGIN_IMAGE_PRIVATE_CORPUS_GZIP_B64: ${{ secrets.ORIGIN_IMAGE_PRIVATE_CORPUS_GZIP_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORIGIN_IMAGE_PRIVATE_CORPUS_GZIP_B64"
          metadata="$(node --import tsx scripts/inspect-image-private-corpus-v1.ts)"
          METADATA="$metadata" CANDIDATE_SHA="$CANDIDATE_SHA" CORPUS_ID="$CORPUS_ID" node <<'NODE' >> "$GITHUB_OUTPUT"
          const value=JSON.parse(process.env.METADATA||'{}');
          if(value.candidateSha!==process.env.CANDIDATE_SHA) process.exit(2);
          if(value.corpusId!==process.env.CORPUS_ID) process.exit(3);
          if(value.taskCount!==24) process.exit(4);
          if(!/^[a-f0-9]{64}$/.test(String(value.corpusDigest||''))) process.exit(5);
          console.log(`corpus_digest=${value.corpusDigest}`);
          NODE

      - name: Check one-shot start marker
        id: one_shot
        env:
          GH_TOKEN: ${{ github.token }}
          CORPUS_DIGEST: ${{ steps.metadata.outputs.corpus_digest }}
        shell: bash
        run: |
          set -euo pipefail
          marker="origin-world-class-image-private-started-${CORPUS_DIGEST}"
          curl --fail --silent --show-error             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'X-GitHub-Api-Version: 2026-03-10'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${marker}&per_page=100"             -o prior-artifacts.json
          count="$(node -e "const v=require('./prior-artifacts.json'); process.stdout.write(String(v.total_count||0))")"
          rm -f prior-artifacts.json
          if [ "$count" != '0' ]; then
            echo "can_start=false" >> "$GITHUB_OUTPUT"
            echo "This sealed world-class image corpus has already started and cannot be reused."
            exit 0
          fi
          echo "can_start=true" >> "$GITHUB_OUTPUT"

      - name: Create immutable one-shot start marker
        if: steps.one_shot.outputs.can_start == 'true'
        env:
          CORPUS_ID: ${{ inputs.corpus_id }}
          CORPUS_DIGEST: ${{ steps.metadata.outputs.corpus_digest }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          node <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync('test-results/world-class-image-private-started.json',JSON.stringify({
            schemaVersion:'origin.world-class-image-private-start-marker.v2',
            corpusId:process.env.CORPUS_ID,
            corpusDigest:process.env.CORPUS_DIGEST,
            candidateSha:process.env.CANDIDATE_SHA,
            workflowSha:process.env.GITHUB_SHA,
            workflowRunId:process.env.GITHUB_RUN_ID,
            started:true,
          },null,2)+'\n');
          NODE

      - name: Preserve one-shot marker before zero-cost candidate execution
        if: steps.one_shot.outputs.can_start == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: origin-world-class-image-private-started-${{ steps.metadata.outputs.corpus_digest }}
          path: test-results/world-class-image-private-started.json
          retention-days: 90
          if-no-files-found: error

  evaluate:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.can_start == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # Refuse exposure of confidential images in public Actions artifacts.
      - name: Verify approved private evaluator repository before any data access
        id: private_repo_guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRIVATE_IMAGE_EVAL_REPOSITORY: ${{ vars.ORIGIN_PRIVATE_IMAGE_EVAL_REPOSITORY }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event.repository.private }}" != "true" || "${{ github.repository_visibility }}" != "private" ]]; then
            echo 'IMAGE_EVAL_PRIVATE_REPOSITORY_REQUIRED' >&2
            exit 73
          fi
          if [[ -z "$EXPECTED_PRIVATE_IMAGE_EVAL_REPOSITORY" || "$GITHUB_REPOSITORY" != "$EXPECTED_PRIVATE_IMAGE_EVAL_REPOSITORY" ]]; then
            echo 'IMAGE_EVAL_PRIVATE_REPOSITORY_ALLOWLIST_REQUIRED' >&2
            exit 74
          fi
          actual="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private' 2>/dev/null)" || {
            echo 'IMAGE_EVAL_REPOSITORY_METADATA_UNAVAILABLE' >&2
            exit 75
          }
          if [[ "$actual" != "true" ]]; then
            echo 'IMAGE_EVAL_REPOSITORY_BECAME_PUBLIC' >&2
            exit 76
          fi

      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Install evaluator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for pixel critic
        run: npx playwright install --with-deps chromium

      - name: Run sealed 24-case world-class image candidate round
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ORIGIN_IMAGE_PRIVATE_CORPUS_GZIP_B64: ${{ secrets.ORIGIN_IMAGE_PRIVATE_CORPUS_GZIP_B64 }}
          ORIGIN_IMAGE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ORIGIN_IMAGE_CORPUS_ID: ${{ inputs.corpus_id }}
          ORIGIN_CLOUDFLARE_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'
          ORIGIN_IMAGE_ZERO_COST_MAX_ATTEMPTS: '2'
          ORIGIN_IMAGE_OUTPUT_DIR: ${{ github.workspace }}/test-results/image-private-world-class
        run: |
          set -euo pipefail
          npm run eval:image-private-world-class

      - name: Verify sanitized evidence and exact zero-cost execution
        shell: bash
        run: |
          set -euo pipefail
          test -f test-results/image-private-world-class/public-tasks.json
          test -f test-results/image-private-world-class/candidate-evidence.json
          test -f test-results/image-private-world-class/candidate-summary.json
          test -d test-results/image-private-world-class/candidate-images
          test -z "$(find test-results/image-private-world-class -type f \( -name '*corpus*' -o -name '*prompt*' \) -print)"
          node <<'NODE'
          const fs=require('node:fs');
          const evidence=JSON.parse(fs.readFileSync('test-results/image-private-world-class/candidate-evidence.json','utf8'));
          const summary=JSON.parse(fs.readFileSync('test-results/image-private-world-class/candidate-summary.json','utf8'));
          if(evidence.totalCostUsd!==0 || summary.totalCostUsd!==0) process.exit(31);
          if(!Array.isArray(evidence.cases) || evidence.cases.some((c)=>c.costUsd!==0)) process.exit(32);
          if(!Array.isArray(evidence.providerIdentities) || evidence.providerIdentities.some((x)=>!String(x).startsWith('cloudflare-workers-ai-free::'))) process.exit(33);
          if(Array.isArray(evidence.blockers) && evidence.blockers.some((x)=>String(x).includes('NONZERO_COST'))) process.exit(34);
          NODE

      - name: Upload candidate images and sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-class-image-private-candidate-${{ needs.preflight.outputs.corpus_digest }}
          path: test-results/image-private-world-class/
          retention-days: 90
          if-no-files-found: error
