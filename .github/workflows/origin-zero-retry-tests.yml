name: ORIGIN zero retry tests

on:
  push:
    branches:
      - fix/origin-zdr-free-model
    paths:
      - .github/workflows/origin-zero-retry-tests.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/origin-zdr-free-model
      - name: Rewrite stale retry expectations
        shell: bash
        env:
          NEW_APP: 
          NEW_E2E: 
        run: |
          python - <<'PY'
          import base64, os, re
          from pathlib import Path
          p = Path('src/App.test.tsx')
          t = p.read_text()
          pattern = re.compile(r"  it\('retries one edge-level transient /api/chat failure.*?  it\('fails closed with the zero-cost busy notice after two network timeouts'.*?^  \}\);\n", re.S | re.M)
          t, count = pattern.subn(base64.b64decode(os.environ['NEW_APP']).decode(), t, count=1)
          if count != 1: raise SystemExit('App retry tests not matched')
          p.write_text(t)
          p = Path('tests/e2e/origin-personal-navigation.spec.ts')
          t = p.read_text()
          pattern = re.compile(r"  test\('retries a transient transport failure exactly once before verifying its answer'.*?^  \}\);\n", re.S | re.M)
          t, count = pattern.subn(base64.b64decode(os.environ['NEW_E2E']).decode(), t, count=1)
          if count != 1: raise SystemExit('E2E retry test not matched')
          t = t.replace("test('shows the zero-cost congestion notice without a verified trace after provider retries'", "test('shows the zero-cost congestion notice without a verified trace or client retry'")
          t = t.replace('費用0円ポリシーを維持したまま再試行していますが、今回は安全に回答を返せませんでした。', '費用0円ポリシーを維持するため自動再試行せず、今回は安全に回答を返せませんでした。')
          p.write_text(t)
          PY
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/origin-zero-retry-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: enforce fail-closed zero-retry behavior'
          git push origin HEAD:fix/origin-zdr-free-model
