name: ORIGIN numeric postprocessor v3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch and verify SafeMarkdown
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          message = subprocess.check_output(['git', 'log', '-1', '--pretty=%B'], text=True).strip()
          if message != 'origin: execute numeric postprocessor':
              print('Not the trigger commit; exiting safely.')
              raise SystemExit(0)
          p = Path('src/components/personal/UnifiedChat.tsx')
          s = p.read_text(encoding='utf-8')
          if 'function postProcessUnverifiedNumbers(' in s:
              raise SystemExit('numeric postprocessor already present')
          marker = 'function mobileFriendlyMarkdown(source: string): string {'
          insert = r'''type NumericPostProcessResult = { source: string; hadNumericEstimates: boolean };

function postProcessUnverifiedNumbers(source: string): NumericPostProcessResult {
  const protectedRanges: Array<[number, number]> = [];
  const addRanges = (re: RegExp) => {
    let match: RegExpExecArray | null;
    while ((match = re.exec(source)) !== null) protectedRanges.push([match.index, match.index + match[0].length]);
  };
  addRanges(/<verified_source>[\s\S]*?<\/verified_source>/gi);
  addRanges(/```[\s\S]*?```|`[^`\n]*`/g);
  addRanges(/https?:\/\/[^\s)<>]+|www\.[^\s)<>]+/gi);
  addRanges(/!?(?:\[[^\]]*\])\([^)]*\)/g);
  const inProtectedRange = (index: number) => protectedRanges.some(([start, end]) => index >= start && index < end);
  const isDateLike = (value: string, index: number) => {
    const before = source.slice(Math.max(0, index - 8), index);
    const after = source.slice(index + value.length, Math.min(source.length, index + value.length + 8));
    if (/^(?:19|20)\d{2}$/.test(value) && /^(?:年|[-/.])/.test(after)) return true;
    if (/^(?:0?[1-9]|1[0-2])$/.test(value) && /^(?:月|日)/.test(after)) return true;
    if (/^(?:0?[1-9]|[12]\d|3[01])$/.test(value) && /^日/.test(after)) return true;
    return /(?:^|[\s(（])(?:19|20)\d{2}[年.\-/]?$/.test(before + value);
  };
  const numericRe = /(?<![\w])(?:[$€£¥￥]\s?)?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?(?:\s?(?:%|万円|億円|円|USD|EUR|GBP|JPY|ドル))?(?![\w])/g;
  const output: string[] = [];
  let cursor = 0;
  let changed = false;
  let match: RegExpExecArray | null;
  while ((match = numericRe.exec(source)) !== null) {
    const index = match.index;
    const value = match[0];
    if (inProtectedRange(index) || isDateLike(value, index)) continue;
    const following = source.slice(index + value.length);
    if (/^\s*\./.test(following) && !/[\$€£¥￥%円万億]/.test(value)) continue;
    output.push(source.slice(cursor, index));
    output.push(`[⚠️ AI推定値: ${value}](#estimate-unverified)`);
    cursor = index + value.length;
    changed = True
  }
  if not changed:
      raise SystemExit('postprocessor produced no changes')
  output.append(source[cursor:])
  patched = ''.join(output)
  p.write_text(s.replace(marker, insert + marker, 1).replace('''        a: ({ children: label, href }) => (\n          <a\n            href={href}\n            target="_blank"\n            rel="noreferrer noopener"\n            className="font-medium text-origin-brand underline decoration-origin-brand/40 underline-offset-2"\n          >\n            {label}\n          </a>\n        ),''', '''        a: ({ children: label, href }) => {\n          if (href === '#estimate-unverified') return <span role="note" title={isEn ? 'AI estimate — verify before relying on this number.' : 'AI推定値 — 利用前に根拠を確認してください。'} aria-label={isEn ? 'AI-estimated value' : 'AI推定値'} className="mx-0.5 inline-flex items-center rounded-md bg-yellow-100 px-1.5 py-0.5 font-medium text-yellow-900 ring-1 ring-yellow-300/80 dark:bg-yellow-400/15 dark:text-yellow-100 dark:ring-yellow-300/30">{label}</span>;\n          return <a href={href} target="_blank" rel="noreferrer noopener" className="font-medium text-origin-brand underline decoration-origin-brand/40 underline-offset-2">{label}</a>;\n        },''', 1).replace('''    >\n      {mobileFriendlyMarkdown(children)}\n    </ReactMarkdown>''', '''    >\n      {postProcessUnverifiedNumbers(mobileFriendlyMarkdown(children)).source}\n    </ReactMarkdown>''', 1), encoding='utf-8')
      - name: Build
        run: npm run build && npm run lint
      - name: Commit implementation and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .origin-numeric-postprocessor-trigger .github/workflows/origin-numeric-postprocessor.yml .github/workflows/origin-numeric-postprocessor2.yml .github/workflows/origin-numeric-postprocessor3.yml
          git add src/components/personal/UnifiedChat.tsx .origin-numeric-postprocessor-trigger .github/workflows/origin-numeric-postprocessor.yml .github/workflows/origin-numeric-postprocessor2.yml .github/workflows/origin-numeric-postprocessor3.yml
          git commit -m "fix: fail-closed context-aware numeric rendering [skip ci]"
          git push origin HEAD:main
