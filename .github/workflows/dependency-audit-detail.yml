name: Dependency Audit Detail

on:
  push:
    branches:
      - audit/dependency-detail-20260908
    paths:
      - .github/workflows/dependency-audit-detail.yml

permissions:
  contents: write

jobs:
  audit-fix-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dependency-detail-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit lockfile fix
        shell: bash
        run: |
          npm audit fix --package-lock-only
          npm audit --audit-level=moderate
          git diff -- package.json package-lock.json
          test -z "$(git status --short package.json)"
          test -n "$(git status --short package-lock.json)"
      - name: Commit lockfile-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: update vulnerable transitive dependencies"
          git push origin HEAD:audit/dependency-detail-20260908
