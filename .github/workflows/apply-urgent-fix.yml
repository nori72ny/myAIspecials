name: Emergency Diagnostics

on:
  workflow_dispatch:

# Emergency workflows must be read-only. Any source change must go through
# a reviewed pull request rather than allowing Actions to mutate main.
permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Verify working tree is clean
        run: git diff --check

      - name: Report emergency workflow policy
        run: |
          echo "Emergency workflow is diagnostics-only."
          echo "No source files are modified and no commits are pushed by GitHub Actions."
          echo "Production changes must be delivered through a reviewed pull request."
