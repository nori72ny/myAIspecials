name: Apply Urgent Fixes
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-urgent-fix.yml

jobs:
  fix-and-commit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix: ORIGIN final clean initial state and timeout optimization' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Final ORIGIN Fixes
        run: |
          node <<'NODE'
          const fs = require('fs');

          // 1. OriginExecutionPolicy: align the server-owned execution policy with the
          // bounded provider execution window used by the chat router.
          const policyPath = 'src/lib/orchestration/OriginExecutionPolicy.ts';
          let policy = fs.readFileSync(policyPath, 'utf8');
          policy = policy.replace(/timeoutMs:\s*90_000/g, 'timeoutMs: 20_000');
          policy = policy.replace(
            /const timeoutMs = Math\.max\(\s*DEFAULT_ORIGIN_EXECUTION_POLICY\.timeoutMs,\s*requestedTimeoutMs,\s*\);/s,
            'const timeoutMs = Math.min(20_000, requestedTimeoutMs);',
          );
          fs.writeFileSync(policyPath, policy);

          // 2. App title normalization. The actual chat clean-state behavior lives in
          // UnifiedChat, so navigation can use the same reset path regardless of the
          // shell/header component that renders the ORIGIN control.
          const appPath = 'src/App.tsx';
          let app = fs.readFileSync(appPath, 'utf8');
          app = app.replace(/ORIGIN Personal 2\.0/g, 'ORIGIN Personal');
          app = app.replace(/Personal 2\.0/g, 'Personal');
          fs.writeFileSync(appPath, app);

          // 3. UnifiedChat: ORIGIN logo / New Conversation must return to a clean
          // initial state rather than retaining the previous conversation/error/input.
          const chatPath = 'src/components/personal/UnifiedChat.tsx';
          let chat = fs.readFileSync(chatPath, 'utf8');
          const start = chat.indexOf('  const createNewConversation = () => {');
          const end = chat.indexOf('\n\n  const openSession =', start);
          if (start < 0 || end < 0) throw new Error('createNewConversation block not found');

          const newCreate = `  const createNewConversation = () => {
            if (inFlightRef.current) return;
            const id = newSessionId();
            setActiveSessionId(id);
            setMessages([{
              id: \`intro-\${id}\`,
              role: 'ai',
              content: defaultGreeting,
              kind: 'intro',
            }]);
            setInput('');
            setShowHistory(false);
            setIsTyping(false);
            setProcessingSeconds(0);
            setCompletionAnnouncement('');
            setRetrySecondsRemaining(0);
            setCopiedMessageId(null);
            handledInitialPromptRef.current = initialPrompt?.trim() ?? null;
          };`;
          chat = chat.slice(0, start) + newCreate + chat.slice(end);

          const marker = '  // ORIGIN logo navigation must always return to a clean initial conversation.\n';
          if (!chat.includes(marker)) {
            const insertAt = chat.indexOf(newCreate) + newCreate.length;
            if (insertAt <= newCreate.length - 1) throw new Error('new create function anchor not found');
            const effect = `\n\n${marker}  useEffect(() => {
            const onOriginNavigationClick = (event) => {
              const target = event.target;
              if (!(target instanceof Element)) return;
              const control = target.closest('a,button');
              if (!control) return;
              const label = (control.getAttribute('aria-label') || control.textContent || '')
                .trim()
                .replace(/\\s+/g, ' ');
              if (/^(ORIGIN(?:\\s+Personal)?)$/i.test(label)) createNewConversation();
            };
            window.addEventListener('click', onOriginNavigationClick, true);
            return () => window.removeEventListener('click', onOriginNavigationClick, true);
          }, [createNewConversation]);`;
            chat = chat.slice(0, insertAt) + effect + chat.slice(insertAt);
          }
          fs.writeFileSync(chatPath, chat);

          // 4. originChatRouter: four total attempts (initial + 3 retries), fixed
          // 20s attempt timeout, 1.5s / 3s / 5s backoff, and a 100s hard budget.
          // Note: 4 x 20s + 9.5s of delays is ~89.5s worst-case, not ~70s.
          const routerPath = 'src/legacy/originChatRouter.ts';
          let router = fs.readFileSync(routerPath, 'utf8');
          const retryStart = router.indexOf('const TOTAL_BUDGET_MS');
          if (retryStart < 0) throw new Error('TOTAL_BUDGET_MS not found');
          const suffix = router.slice(retryStart);
          const fnMatch = suffix.match(/async function executeWithRetry[\s\S]*?\n\s*throw lastError;\s*\}/);
          if (!fnMatch) throw new Error('executeWithRetry body not found');

          const replacement = `const TOTAL_BUDGET_MS = 100_000;
          const DEFAULT_RETRY_DELAYS_MS = [1500, 3000, 5000];
          const MAX_RETRIES = 3;
          const MAX_PROVIDER_ATTEMPT_TIMEOUT_MS = 20_000;

          async function executeWithRetry(executeFn, request) {
            const startTime = Date.now();
            let lastError;
            for (let attempt = 0; attempt <= MAX_RETRIES; attempt += 1) {
              const elapsed = Date.now() - startTime;
              const remainingBudget = TOTAL_BUDGET_MS - elapsed;
              if (remainingBudget <= 0) throw lastError ?? new Error('Provider retry budget exhausted');

              const timeoutForAttempt = Math.min(MAX_PROVIDER_ATTEMPT_TIMEOUT_MS, remainingBudget);
              try {
                return await executeFn(request, timeoutForAttempt);
              } catch (err) {
                lastError = err;
                const status = err?.status ?? err?.statusCode ?? 0;
                const code = err?.code ?? '';
                const isRetryableProviderError =
                  status === 429 ||
                  status === 503 ||
                  code === 'PROVIDER_RATE_LIMITED' ||
                  code === 'PROVIDER_UNAVAILABLE';

                if (!isRetryableProviderError || attempt >= MAX_RETRIES) throw err;

                const delay = Math.min(
                  10_000,
                  Number.isFinite(err?.retryAfterSeconds)
                    ? Math.max(0, err.retryAfterSeconds * 1000)
                    : DEFAULT_RETRY_DELAYS_MS[attempt],
                );
                if (Date.now() - startTime + delay + 500 >= TOTAL_BUDGET_MS) throw err;
                await new Promise((resolve) => setTimeout(resolve, delay));
              }
            }
            throw lastError;
          }`;

          router = router.slice(0, retryStart) + replacement + suffix.slice(fnMatch[0].length);
          fs.writeFileSync(routerPath, router);
          NODE

      - name: Verify TypeScript & Build
        run: |
          npm ci
          npm run build

      - name: Commit and Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/personal/UnifiedChat.tsx src/legacy/originChatRouter.ts src/lib/orchestration/OriginExecutionPolicy.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: ORIGIN final clean initial state and timeout optimization"
          git push origin main
