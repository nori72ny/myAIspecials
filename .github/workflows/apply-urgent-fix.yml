name: Apply Urgent Fixes
on:
  workflow_dispatch:

jobs:
  fix-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply In-Place Fixes (Node Script)
        run: |
          node -e '
          const fs = require("fs");
          
          // 1. App.tsx の修正 (タイトル統一)
          let app = fs.readFileSync("src/App.tsx", "utf8");
          app = app.replace(/ORIGIN Personal 2\.0/g, "ORIGIN Personal");
          app = app.replace(/Personal 2\.0/g, "Personal");
          fs.writeFileSync("src/App.tsx", app);

          // 2. originChatRouter.ts の修正 (リトライ関数注入 & 呼び出し箇所の確実な置換)
          let router = fs.readFileSync("src/legacy/originChatRouter.ts", "utf8");
          
          // 既存の try { result = await execute(...) } catch ... ブロックを executeWithRetry に置換
          const retryLogic = `
          const TOTAL_BUDGET_MS = 100_000;
          const RETRY_DELAYS_MS = [1500, 3000, 5000];
          const MAX_RETRIES = 3;

          async function executeWithRetry(executeFn, request) {
            const startTime = Date.now();
            let lastError;
            for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
              const elapsed = Date.now() - startTime;
              const remainingBudget = Math.max(5000, TOTAL_BUDGET_MS - elapsed);
              const timeoutForAttempt = Math.min(25000, remainingBudget);
              try {
                return await executeFn(request, timeoutForAttempt);
              } catch (err) {
                lastError = err;
                const status = err?.status || err?.statusCode || 0;
                const is429or503 = status === 429 || status === 503 || (err?.message && (err.message.includes("429") || err.message.includes("503")));
                if (is429or503 && attempt < MAX_RETRIES) {
                  const delay = RETRY_DELAYS_MS[attempt] || 5000;
                  if (elapsed + delay + 5000 < TOTAL_BUDGET_MS) {
                    await new Promise(r => setTimeout(r, delay));
                    continue;
                  }
                }
                throw err;
              }
            }
            throw lastError;
          }
          `;

          if (!router.includes("executeWithRetry")) {
            router = retryLogic + "\n" + router;
          }

          // 呼び出し箇所の差し替え
          router = router.replace(
            /result\s*=\s*await\s+execute\s*\(\s*providerRequest\s*\);/g,
            "result = await executeWithRetry(execute, providerRequest);"
          );

          fs.writeFileSync("src/legacy/originChatRouter.ts", router);
          '

      - name: Run Tests & Build
        run: |
          npm ci
          npm run build

      - name: Commit & Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/legacy/originChatRouter.ts
          git commit -m "fix: OpenRouter 429 exponential backoff retry and unify ORIGIN Personal title" || exit 0
          git push origin main
