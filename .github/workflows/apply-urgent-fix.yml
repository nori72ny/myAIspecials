name: Apply Urgent Fixes

on:
  workflow_dispatch:

jobs:
  fix-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Fixes and Build
        run: |
          node -e '
          const fs = require("fs");

          // 1. App.tsx (タイトル統一)
          if (fs.existsSync("src/App.tsx")) {
            let app = fs.readFileSync("src/App.tsx", "utf8");
            app = app.replace(/ORIGIN Personal 2\.0/g, "ORIGIN Personal").replace(/Personal 2\.0/g, "Personal");
            fs.writeFileSync("src/App.tsx", app);
            console.log("App.tsx updated");
          }

          // 2. OriginExecutionPolicy.ts (タイムアウト20秒化)
          const policyPath = "src/lib/orchestration/OriginExecutionPolicy.ts";
          if (fs.existsSync(policyPath)) {
            let policy = fs.readFileSync(policyPath, "utf8");
            policy = policy.replace(/timeoutMs:\s*\d+/g, "timeoutMs: 20000");
            fs.writeFileSync(policyPath, policy);
            console.log("OriginExecutionPolicy.ts updated");
          }

          // 3. originChatRouter.ts (20秒タイムアウト設定)
          const routerPath = "src/legacy/originChatRouter.ts";
          if (fs.existsSync(routerPath)) {
            let router = fs.readFileSync(routerPath, "utf8");
            router = router.replace(/const MAX_PROVIDER_ATTEMPT_TIMEOUT_MS\s*=\s*\d+;/g, "const MAX_PROVIDER_ATTEMPT_TIMEOUT_MS = 20000;");
            fs.writeFileSync(routerPath, router);
            console.log("originChatRouter.ts updated");
          }
          '
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          git commit -m "fix: OpenRouter 20s timeout and clean title sync" || echo "No changes to commit"
          git push origin main
