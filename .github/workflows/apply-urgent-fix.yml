name: Apply Urgent Fixes
on:
  workflow_dispatch:

jobs:
  fix-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply In-Place Fixes (Node Script)
        run: |
          node -e '
          const fs = require("fs");
          
          // 1. App.tsx の修正 (タイトル統一)
          let app = fs.readFileSync("src/App.tsx", "utf8");
          app = app.replace(/ORIGIN Personal 2\.0/g, "ORIGIN Personal");
          app = app.replace(/Personal 2\.0/g, "Personal");
          fs.writeFileSync("src/App.tsx", app);

          // 2. originChatRouter.ts の決定版リトライ置換
          let router = fs.readFileSync("src/legacy/originChatRouter.ts", "utf8");
          
          const retryLogic = `
          const TOTAL_BUDGET_MS = 100_000;
          const DEFAULT_RETRY_DELAYS_MS = [1500, 3000, 5000];
          const MAX_RETRIES = 3;

          async function executeWithRetry(executeFn, request) {
            const startTime = Date.now();
            let lastError;
            for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
              const elapsed = Date.now() - startTime;
              const remainingBudget = Math.max(5000, TOTAL_BUDGET_MS - elapsed);
              const timeoutForAttempt = Math.min(25000, remainingBudget);
              try {
                return await executeFn(request, timeoutForAttempt);
              } catch (err) {
                lastError = err;
                const status = err?.status ?? err?.statusCode ?? 0;
                const code = err?.code ?? "";
                const is429or503 = 
                  status === 429 || 
                  status === 503 || 
                  code === "PROVIDER_RATE_LIMITED" || 
                  (code === "PROVIDER_UNAVAILABLE" && (status === 503 || status === 502));
                
                if (is429or503 && attempt < MAX_RETRIES) {
                  let delay = (err?.retryAfterSeconds ? err.retryAfterSeconds * 1000 : DEFAULT_RETRY_DELAYS_MS[attempt]) || 5000;
                  delay = Math.min(delay, 10000); // 最大10秒に安全クランプ
                  if (elapsed + delay + 5000 < TOTAL_BUDGET_MS) {
                    await new Promise(r => setTimeout(r, delay));
                    continue;
                  }
                }
                throw err;
              }
            }
            throw lastError;
          }
          `;
          
          if (!router.includes("executeWithRetry")) {
            router = retryLogic + "\n" + router;
          } else {
            router = router.replace(/async function executeWithRetry[\s\S]*?throw lastError;\s*\}/, retryLogic.trim());
          }

          fs.writeFileSync("src/legacy/originChatRouter.ts", router);
          '

      - name: Run Tests & Build
        run: |
          npm ci
          npm run build

      - name: Commit & Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/legacy/originChatRouter.ts
          git commit -m "fix: OpenRouter 429 retryAfter and code-based backoff retry" || exit 0
          git push origin main
