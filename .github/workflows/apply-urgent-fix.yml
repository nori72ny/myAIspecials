name: Apply Urgent Fixes
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-urgent-fix.yml

jobs:
  fix-and-commit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix: ORIGIN clean initial state and Hobby timeout optimization' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Clean Initial State & Fast Retry Fixes
        run: |
          node <<'NODE'
          const fs = require('fs');

          // 1. UnifiedChat: make New / ORIGIN navigation a true clean initial-state reset.
          const chatPath = 'src/components/personal/UnifiedChat.tsx';
          let chat = fs.readFileSync(chatPath, 'utf8');
          const start = chat.indexOf('  const createNewConversation = () => {');
          const end = chat.indexOf('\n\n  const openSession =', start);
          if (start < 0 || end < 0) throw new Error('createNewConversation block not found');

          const newCreate = `  const createNewConversation = () => {
            if (inFlightRef.current) return;
            const id = newSessionId();
            setActiveSessionId(id);
            setMessages([{
              id: \`intro-\${id}\`,
              role: 'ai',
              content: defaultGreeting,
              kind: 'intro',
            }]);
            setInput('');
            setShowHistory(false);
            setIsTyping(false);
            setProcessingSeconds(0);
            setCompletionAnnouncement('');
            setRetrySecondsRemaining(0);
            setCopiedMessageId(null);
            handledInitialPromptRef.current = initialPrompt?.trim() ?? null;
          };`;
          chat = chat.slice(0, start) + newCreate + chat.slice(end);

          const marker = "  // ORIGIN logo navigation must always return to a clean initial conversation.\n";
          if (!chat.includes(marker)) {
            const pos = chat.indexOf(newCreate);
            if (pos < 0) throw new Error('new create function anchor not found');
            const insertAt = pos + newCreate.length;
            const effect = `\n\n${marker}  useEffect(() => {
            const onOriginNavigationClick = (event) => {
              const target = event.target;
              if (!(target instanceof Element)) return;
              const control = target.closest('a,button');
              if (!control) return;
              const label = (control.getAttribute('aria-label') || control.textContent || '').trim().replace(/\\s+/g, ' ');
              if (/^(ORIGIN(?:\\s+Personal)?)$/i.test(label)) createNewConversation();
            };
            window.addEventListener('click', onOriginNavigationClick, true);
            return () => window.removeEventListener('click', onOriginNavigationClick, true);
          }, [createNewConversation]);`;
            chat = chat.slice(0, insertAt) + effect + chat.slice(insertAt);
          }
          fs.writeFileSync(chatPath, chat);

          // 2. originChatRouter: Hobby-safe 9.5s total budget, 2 retries (1.5s -> 3s).
          const routerPath = 'src/legacy/originChatRouter.ts';
          let router = fs.readFileSync(routerPath, 'utf8');
          const retryStart = router.indexOf('const TOTAL_BUDGET_MS');
          const fnStart = router.indexOf('async function executeWithRetry', retryStart);
          if (retryStart < 0 || fnStart < 0) throw new Error('executeWithRetry block not found');
          const fnMatch = router.slice(retryStart).match(/async function executeWithRetry[\\s\\S]*?\\n\\s*throw lastError;\\s*\\}/);
          if (!fnMatch) throw new Error('executeWithRetry body not found');
          const replacement = `const TOTAL_BUDGET_MS = 9_500;
          const DEFAULT_RETRY_DELAYS_MS = [1500, 3000];
          const MAX_RETRIES = 2;

          async function executeWithRetry(executeFn, request) {
            const startTime = Date.now();
            let lastError;
            for (let attempt = 0; attempt <= MAX_RETRIES; attempt += 1) {
              const elapsed = Date.now() - startTime;
              const remainingBudget = TOTAL_BUDGET_MS - elapsed;
              if (remainingBudget <= 0) throw lastError ?? new Error('Provider retry budget exhausted');
              const remainingDelays = DEFAULT_RETRY_DELAYS_MS.slice(attempt).reduce((sum, delay) => sum + delay, 0);
              const timeoutForAttempt = Math.max(500, Math.min(2500, remainingBudget - remainingDelays - 250));
              try {
                return await executeFn(request, timeoutForAttempt);
              } catch (err) {
                lastError = err;
                const status = err?.status ?? err?.statusCode ?? 0;
                const code = err?.code ?? '';
                const isRetryableProviderError =
                  status === 429 ||
                  status === 503 ||
                  code === 'PROVIDER_RATE_LIMITED' ||
                  code === 'PROVIDER_UNAVAILABLE';
                if (!isRetryableProviderError || attempt >= MAX_RETRIES) throw err;
                const delay = Math.min(
                  5000,
                  Number.isFinite(err?.retryAfterSeconds) ? Math.max(0, err.retryAfterSeconds * 1000) : DEFAULT_RETRY_DELAYS_MS[attempt],
                );
                if (Date.now() - startTime + delay + 500 < TOTAL_BUDGET_MS) {
                  await new Promise((resolve) => setTimeout(resolve, delay));
                  continue;
                }
                throw err;
              }
            }
            throw lastError;
          }`;
          router = router.slice(0, retryStart) + replacement + router.slice(retryStart + fnMatch[0].length);
          fs.writeFileSync(routerPath, router);
          NODE

      - name: Verify TypeScript & Build
        run: |
          npm ci
          npm run build

      - name: Commit and Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/personal/UnifiedChat.tsx src/legacy/originChatRouter.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: ORIGIN clean initial state and Hobby timeout optimization"
          git push origin main
