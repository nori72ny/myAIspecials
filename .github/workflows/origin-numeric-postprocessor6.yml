name: ORIGIN numeric processor v6
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute one-time patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          msg = subprocess.check_output(['git','log','-1','--pretty=%B'], text=True).strip()
          if msg != 'origin: execute numeric postprocessor v6':
              print('safe no-op')
              raise SystemExit(0)
          p = Path('src/components/personal/UnifiedChat.tsx')
          s = p.read_text(encoding='utf-8')
          if 'function postProcessUnverifiedNumbers(' in s:
              raise SystemExit('already patched')
          anchor = 'function mobileFriendlyMarkdown(source: string): string {'
          helper = r'''type NumericPostProcessResult = { source: string; hadNumericEstimates: boolean };
function postProcessUnverifiedNumbers(source: string): NumericPostProcessResult {
  const protectedRanges: Array<[number, number]> = [];
  const addRanges = (re: RegExp) => { let m: RegExpExecArray | null; while ((m = re.exec(source)) !== null) protectedRanges.push([m.index, m.index + m[0].length]); };
  addRanges(/<verified_source>[\s\S]*?<\/verified_source>/gi);
  addRanges(/```[\s\S]*?```|`[^`\n]*`/g);
  addRanges(/https?:\/\/[^\s)<>]+|www\.[^\s)<>]+/gi);
  addRanges(/!?(?:\[[^\]]*\])\([^)]*\)/g);
  const protectedAt = (i: number) => protectedRanges.some(([a,b]) => i >= a && i < b);
  const dateLike = (v: string, i: number) => {
    const after = source.slice(i + v.length, i + v.length + 8);
    if (/^(?:19|20)\d{2}$/.test(v) && /^(?:年|[-/.])/.test(after)) return true;
    if (/^(?:0?[1-9]|1[0-2])$/.test(v) && /^(?:月|日)/.test(after)) return true;
    if (/^(?:0?[1-9]|[12]\d|3[01])$/.test(v) && /^日/.test(after)) return true;
    return false;
  };
  const re = /(?<![\w])(?:[$€£¥￥]\s?)?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?(?:\s?(?:%|万円|億円|円|USD|EUR|GBP|JPY|ドル))?(?![\w])/g;
  const out: string[] = []; let cursor = 0; let changed = false; let m: RegExpExecArray | null;
  while ((m = re.exec(source)) !== null) {
    const i = m.index; const v = m[0];
    if (protectedAt(i) || dateLike(v, i)) continue;
    const after = source.slice(i + v.length);
    if (/^\s*\./.test(after) && !/[\$€£¥￥%円万億]/.test(v)) continue;
    out.push(source.slice(cursor, i)); out.push(`[⚠️ AI推定値: ${v}](#estimate-unverified)`); cursor = i + v.length; changed = true;
  }
  if (!changed) return { source, hadNumericEstimates: false };
  out.push(source.slice(cursor)); return { source: out.join(''), hadNumericEstimates: true };
}

'''
          if anchor not in s: raise SystemExit('anchor missing')
          s = s.replace(anchor, helper + anchor, 1)
          old = '''        a: ({ children: label, href }) => (
          <a
            href={href}
            target="_blank"
            rel="noreferrer noopener"
            className="font-medium text-origin-brand underline decoration-origin-brand/40 underline-offset-2"
          >
            {label}
          </a>
        ),'''
          new = '''        a: ({ children: label, href }) => {
          if (href === '#estimate-unverified') return <span role="note" title={isEn ? 'AI estimate — verify before relying on this number.' : 'AI推定値 — 利用前に根拠を確認してください。'} aria-label={isEn ? 'AI-estimated value' : 'AI推定値'} className="mx-0.5 inline-flex items-center rounded-md bg-yellow-100 px-1.5 py-0.5 font-medium text-yellow-900 ring-1 ring-yellow-300/80 dark:bg-yellow-400/15 dark:text-yellow-100 dark:ring-yellow-300/30">{label}</span>;
          return <a href={href} target="_blank" rel="noreferrer noopener" className="font-medium text-origin-brand underline decoration-origin-brand/40 underline-offset-2">{label}</a>;
        },'''
          if old not in s: raise SystemExit('link renderer missing')
          s = s.replace(old, new, 1)
          old2 = '''    >
      {mobileFriendlyMarkdown(children)}
    </ReactMarkdown>'''
          new2 = '''    >
      {postProcessUnverifiedNumbers(mobileFriendlyMarkdown(children)).source}
    </ReactMarkdown>'''
          if old2 not in s: raise SystemExit('render anchor missing')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          print('patched')
          PY
      - name: Build and lint
        run: npm run build && npm run lint
      - name: Commit and cleanup
        run: |
          if [ "$(git log -1 --pretty=%B)" != "origin: execute numeric postprocessor v6" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .origin-numeric-postprocessor-trigger-final2 .origin-numeric-postprocessor-trigger-final .github/workflows/origin-numeric-postprocessor.yml .github/workflows/origin-numeric-postprocessor2.yml .github/workflows/origin-numeric-postprocessor3.yml .github/workflows/origin-numeric-postprocessor4.yml .github/workflows/origin-numeric-postprocessor5.yml .github/workflows/origin-numeric-postprocessor6.yml
          git add src/components/personal/UnifiedChat.tsx .github/workflows/
          git commit -m "fix: fail-closed context-aware numeric rendering [skip ci]"
          git push origin HEAD:main
