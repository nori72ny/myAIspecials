name: Production Release CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Required for generating Releases and Changelogs
  actions: read
  security-events: write # Required for security uploads
  pull-requests: write # Required for PR comments in dependency review

jobs:
  build-and-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0 # Fetch all history for accurate secret scanning

    - name: Run Secret Scanning (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies (Clean Install)
      run: npm ci

    - name: Run Security Audit
      run: npm audit --audit-level=critical

    - name: Run linter
      run: npm run lint

    - name: Build the app
      run: npm run build

    - name: Run unit tests
      run: npm run test

    - name: Cache Playwright Browsers
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright Browsers
      # GitHub-hosted Ubuntu runners already include Chromium runtime dependencies.
      # Avoiding --with-deps prevents external APT mirror outages from blocking the release gate.
      run: npx playwright install chromium

    - name: Run E2E tests
      run: npm run test:e2e

    - name: Run Lighthouse Audit
      run: |
        npm install -g @lhci/cli
        lhci autorun

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report-node-${{ matrix.node-version }}
        path: playwright-report/
        retention-days: 30

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: test-results/
        retention-days: 30
        if-no-files-found: ignore

    - name: Generate SBOM (Software Bill of Materials)
      if: always()
      uses: anchore/sbom-action@v0
      with:
        format: 'spdx-json'
        output-file: 'sbom.spdx.json'
      continue-on-error: true # Ensure the pipeline doesn't block if SBOM tool is rate-limited

    - name: Upload SBOM Artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom-node-${{ matrix.node-version }}
        path: sbom.spdx.json
        retention-days: 30
        if-no-files-found: ignore

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verify Dependency Graph API access
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}")"

          if [ "$status" -ge 400 ]; then
            message="$(jq -r '.message // "Unknown GitHub API error"' "$response_file")"
            echo "::error title=Dependency Graph API unavailable::HTTP ${status}: ${message}. Enable Dependency graph for this repository under Settings > Security > Advanced Security, then rerun this job."
            jq -c '{message, documentation_url, status}' "$response_file" || true
            exit 1
          fi

          jq -c '{dependency_change_count: length}' "$response_file"

      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: on-failure

  production-smoke:
    name: Verify main SHA in Vercel production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Wait for and verify the matching production deployment
        env:
          ORIGIN_PRODUCTION_URL: https://origin-personal.vercel.app
          ORIGIN_EXPECTED_SHA: ${{ github.sha }}
          ORIGIN_DEPLOY_TIMEOUT_MS: "600000"
          ORIGIN_DEPLOY_POLL_INTERVAL_MS: "10000"
          ORIGIN_REQUEST_TIMEOUT_MS: "15000"
        run: node scripts/verify-production-deployment.mjs

  release:
    name: Generate CHANGELOG & GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
