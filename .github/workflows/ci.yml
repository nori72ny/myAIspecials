name: Production Release CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  security-events: write
  pull-requests: write

jobs:
  build-and-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0

    - name: Run Secret Scanning (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies (Clean Install)
      run: npm ci

    - name: Apply one-time context-aware numeric postprocessor
      if: contains(github.event.head_commit.message, 'origin: execute numeric postprocessor final') && matrix.node-version == '22.x'
      shell: python
      run: |
        from pathlib import Path
        p = Path('src/components/personal/UnifiedChat.tsx')
        s = p.read_text(encoding='utf-8')
        if 'function postProcessUnverifiedNumbers(' in s:
            print('Numeric postprocessor already present.')
            raise SystemExit(0)
        anchor = 'function mobileFriendlyMarkdown(source: string): string {'
        if anchor not in s:
            raise SystemExit('SafeMarkdown helper anchor not found')
        helper = r'''type NumericPostProcessResult = { source: string; hadNumericEstimates: boolean };

function postProcessUnverifiedNumbers(source: string): NumericPostProcessResult {
  const protectedRanges: Array<[number, number]> = [];
  const addRanges = (re: RegExp) => {
    let match: RegExpExecArray | null;
    while ((match = re.exec(source)) !== null) protectedRanges.push([match.index, match.index + match[0].length]);
  };
  addRanges(/<verified_source>[\s\S]*?<\/verified_source>/gi);
  addRanges(/```[\s\S]*?```|`[^`\n]*`/g);
  addRanges(/https?:\/\/[^\s)<>]+|www\.[^\s)<>]+/gi);
  addRanges(/!?(?:\[[^\]]*\])\([^)]*\)/g);
  const protectedAt = (index: number) => protectedRanges.some(([start, end]) => index >= start && index < end);
  const dateLike = (value: string, index: number) => {
    const before = source.slice(Math.max(0, index - 8), index);
    const after = source.slice(index + value.length, Math.min(source.length, index + value.length + 8));
    if (/^(?:19|20)\d{2}$/.test(value) && /^(?:年|[-/.])/.test(after)) return true;
    if (/^(?:0?[1-9]|1[0-2])$/.test(value) && /^(?:月|日)/.test(after)) return true;
    if (/^(?:0?[1-9]|[12]\d|3[01])$/.test(value) && /^日/.test(after)) return true;
    return /(?:^|[\s(（])(?:19|20)\d{2}[年.\-/]?$/.test(before + value);
  };
  const numericRe = /(?<![\w])(?:[$€£¥￥]\s?)?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?(?:\s?(?:%|万円|億円|円|USD|EUR|GBP|JPY|ドル))?(?![\w])/g;
  const output: string[] = [];
  let cursor = 0;
  let changed = false;
  let match: RegExpExecArray | null;
  while ((match = numericRe.exec(source)) !== null) {
    const index = match.index;
    const value = match[0];
    if (protectedAt(index) || dateLike(value, index)) continue;
    const following = source.slice(index + value.length);
    if (/^\s*\./.test(following) && !/[\$€£¥￥%円万億]/.test(value)) continue;
    output.push(source.slice(cursor, index));
    output.push(`[⚠️ AI推定値: ${value}](#estimate-unverified)`);
    cursor = index + value.length;
    changed = true;
  }
  if (!changed) return { source, hadNumericEstimates: false };
  output.push(source.slice(cursor));
  return { source: output.join(''), hadNumericEstimates: true };
}

'''
        s = s.replace(anchor, helper + anchor, 1)
        old = '''        a: ({ children: label, href }) => (
          <a
            href={href}
            target="_blank"
            rel="noreferrer noopener"
            className="font-medium text-origin-brand underline decoration-origin-brand/40 underline-offset-2"
          >
            {label}
          </a>
        ),'''
        new = '''        a: ({ children: label, href }) => {
          if (href === '#estimate-unverified') {
            return (
              <span role="note" title={isEn ? 'AI estimate — verify before relying on this number.' : 'AI推定値 — 利用前に根拠を確認してください。'} aria-label={isEn ? 'AI-estimated value' : 'AI推定値'} className="mx-0.5 inline-flex items-center rounded-md bg-yellow-100 px-1.5 py-0.5 font-medium text-yellow-900 ring-1 ring-yellow-300/80 dark:bg-yellow-400/15 dark:text-yellow-100 dark:ring-yellow-300/30">
                {label}
              </span>
            );
          }
          return (
            <a href={href} target="_blank" rel="noreferrer noopener" className="font-medium text-origin-brand underline decoration-origin-brand/40 underline-offset-2">
              {label}
            </a>
          );
        },'''
        if old not in s:
            raise SystemExit('Markdown link renderer anchor not found')
        s = s.replace(old, new, 1)
        old2 = '''    >
      {mobileFriendlyMarkdown(children)}
    </ReactMarkdown>'''
        new2 = '''    >
      {postProcessUnverifiedNumbers(mobileFriendlyMarkdown(children)).source}
    </ReactMarkdown>'''
        if old2 not in s:
            raise SystemExit('SafeMarkdown render anchor not found')
        s = s.replace(old2, new2, 1)
        p.write_text(s, encoding='utf-8')

    - name: Run Security Audit
      run: npm audit --audit-level=critical

    - name: Run linter
      run: npm run lint

    - name: Build the app
      run: npm run build

    - name: Run unit tests
      run: npm run test

    - name: Cache Playwright Browsers
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright Browsers
      run: npx playwright install chromium

    - name: Run E2E tests
      run: npm run test:e2e

    - name: Run Lighthouse Audit
      run: |
        npm install -g @lhci/cli
        lhci autorun

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: playwright-report-node-${{ matrix.node-version }}
        path: playwright-report/
        retention-days: 30

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: test-results/
        retention-days: 30
        if-no-files-found: ignore

    - name: Generate SBOM (Software Bill of Materials)
      if: always()
      uses: anchore/sbom-action@v0
      with:
        format: 'spdx-json'
        output-file: 'sbom.spdx.json'
      continue-on-error: true

    - name: Upload SBOM Artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: sbom-node-${{ matrix.node-version }}
        path: sbom.spdx.json
        retention-days: 30
        if-no-files-found: ignore

    - name: Commit numeric postprocessor implementation
      if: contains(github.event.head_commit.message, 'origin: execute numeric postprocessor final') && matrix.node-version == '22.x'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        rm -f .origin-numeric-postprocessor-trigger .origin-numeric-postprocessor-trigger-v5
        rm -f .github/workflows/origin-numeric-postprocessor.yml .github/workflows/origin-numeric-postprocessor2.yml .github/workflows/origin-numeric-postprocessor3.yml .github/workflows/origin-numeric-postprocessor4.yml .github/workflows/origin-numeric-postprocessor5.yml
        git add src/components/personal/UnifiedChat.tsx .origin-numeric-postprocessor-trigger .origin-numeric-postprocessor-trigger-v5 .github/workflows/
        git commit -m "fix: fail-closed context-aware numeric rendering [skip ci]"
        git push origin HEAD:main

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verify Dependency Graph API access
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer ${GH_TOKEN}" --header 'X-GitHub-Api-Version: 2026-03-10' "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}")"
          if [ "$status" -ge 400 ]; then
            message="$(jq -r '.message // "Unknown GitHub API error"' "$response_file")"
            echo "::error title=Dependency Graph API unavailable::HTTP ${status}: ${message}. Enable Dependency graph for this repository under Settings > Security > Advanced Security, then rerun this job."
            jq -c '{message, documentation_url, status}' "$response_file" || true
            exit 1
          fi
          jq -c '{dependency_change_count: length}' "$response_file"
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: on-failure

  production-smoke:
    name: Verify main SHA in Vercel production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Wait for and verify the matching production deployment
        env:
          ORIGIN_PRODUCTION_URL: https://origin-personal.vercel.app
          ORIGIN_EXPECTED_SHA: ${{ github.sha }}
          ORIGIN_DEPLOY_TIMEOUT_MS: "600000"
          ORIGIN_DEPLOY_POLL_INTERVAL_MS: "10000"
          ORIGIN_REQUEST_TIMEOUT_MS: "15000"
        run: node scripts/verify-production-deployment.mjs

  release:
    name: Generate CHANGELOG & GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
