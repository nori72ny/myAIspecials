name: V1.4 held-out coding benchmark

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate HEAD SHA to evaluate; must match the dispatched ref
        required: true
        type: string
      task_id:
        description: Optional opaque task id; leave blank to run the full private corpus
        required: false
        type: string

permissions:
  contents: read

jobs:
  select-tasks:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      task_ids: ${{ steps.select.outputs.task_ids }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Bind selector to exact candidate HEAD
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          if [[ ! "$EXPECTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a lowercase 40-character commit SHA" >&2
            exit 2
          fi
          if [ "$actual_sha" != "$EXPECTED_CANDIDATE_SHA" ]; then
            echo "held-out candidate mismatch: expected $EXPECTED_CANDIDATE_SHA but checkout is $actual_sha" >&2
            exit 2
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Prepare trusted selector
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Select opaque task ids
        id: select
        shell: bash
        env:
          ORIGIN_HELDOUT_TASK_FILTER: ${{ inputs.task_id }}
          ORIGIN_HELDOUT_CORPUS_GZIP_B64: ${{ secrets.ORIGIN_HELDOUT_CORPUS_GZIP_B64 }}
          ORIGIN_HELDOUT_TASK_PACKET_B64: ${{ secrets.ORIGIN_HELDOUT_TASK_PACKET_B64 }}
        run: |
          set -euo pipefail
          task_ids=$(node --import tsx scripts/select-held-out-task-ids-v14.ts)
          echo "task_ids=$task_ids" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: select-tasks
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        task_id: ${{ fromJSON(needs.select-tasks.outputs.task_ids) }}
    concurrency:
      group: origin-held-out-${{ matrix.task_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind benchmark controller to exact candidate HEAD
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          if [[ ! "$EXPECTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a lowercase 40-character commit SHA" >&2
            exit 2
          fi
          if [ "$actual_sha" != "$EXPECTED_CANDIDATE_SHA" ]; then
            echo "held-out candidate mismatch: expected $EXPECTED_CANDIDATE_SHA but checkout is $actual_sha" >&2
            exit 2
          fi

      - name: Prepare trusted benchmark controller and isolated verifier
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:22-bookworm-slim
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate server-only benchmark configuration
        shell: bash
        env:
          ORIGIN_HELDOUT_CORPUS_GZIP_B64: ${{ secrets.ORIGIN_HELDOUT_CORPUS_GZIP_B64 }}
          ORIGIN_HELDOUT_TASK_PACKET_B64: ${{ secrets.ORIGIN_HELDOUT_TASK_PACKET_B64 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ORIGIN_HELDOUT_CORPUS_GZIP_B64" ] && [ -z "$ORIGIN_HELDOUT_TASK_PACKET_B64" ]; then
            echo "held-out corpus/packet secret is not configured" >&2
            exit 2
          fi
          test -n "$OPENROUTER_API_KEY"

      - name: Run trusted held-out benchmark
        shell: bash
        env:
          ORIGIN_HELDOUT_TASK_ID: ${{ matrix.task_id }}
          ORIGIN_HELDOUT_CORPUS_GZIP_B64: ${{ secrets.ORIGIN_HELDOUT_CORPUS_GZIP_B64 }}
          ORIGIN_HELDOUT_TASK_PACKET_B64: ${{ secrets.ORIGIN_HELDOUT_TASK_PACKET_B64 }}
          ORIGIN_HELDOUT_PARTICIPANT: ORIGIN
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREE_ONLY: 'true'
        run: |
          set -euo pipefail
          node --import tsx scripts/run-held-out-coding-trusted-v14.ts

      - name: Preserve exact-candidate provenance
        if: always()
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          actual_sha=$(git rev-parse HEAD)
          printf '{"candidateSha":"%s","checkedOutSha":"%s","workflowRunId":"%s","workflowRunAttempt":"%s"}\n' \
            "$EXPECTED_CANDIDATE_SHA" "$actual_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > test-results/held-out-candidate-provenance.json

      - name: Preserve public benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: origin-held-out-${{ matrix.task_id }}-${{ github.run_id }}
          path: |
            test-results/held-out-task-public.json
            test-results/held-out-run.json
            test-results/held-out-score.json
            test-results/held-out-candidate-provenance.json
          if-no-files-found: error
          retention-days: 30
