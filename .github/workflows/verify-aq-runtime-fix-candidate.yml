name: Verify AQ runtime fix candidate

on:
  push:
    branches:
      - audit/aq-v2-runtime-preflight

permissions:
  contents: read
  pull-requests: read

env:
  EVALUATOR_SHA: 5144b7f6a76a8179ad13d694faba84117e608483
  CANDIDATE_SHA: d0c307fd3d915474730a033fc46e273cbb6a6231
  CANDIDATE_PR: '698'

jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact evaluator fix candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EVALUATOR_SHA }}
          persist-credentials: false

      - name: Checkout exact product candidate separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Install trusted evaluator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pull isolated runtime image
        run: docker pull node:22-bookworm-slim

      - name: Revalidate exact product candidate binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${CANDIDATE_PR}" -o pr.json
          node <<'NODE'
          const fs=require('node:fs');
          const pr=JSON.parse(fs.readFileSync('pr.json','utf8'));
          const fail=code=>{console.error(code);process.exit(2);};
          if(pr?.state!=='open') fail('AQ_V2_VERIFY_CANDIDATE_NOT_OPEN');
          if(pr?.base?.ref!=='main') fail('AQ_V2_VERIFY_CANDIDATE_BASE_INVALID');
          if(pr?.head?.repo?.full_name!==process.env.GITHUB_REPOSITORY) fail('AQ_V2_VERIFY_CANDIDATE_FORK_BLOCKED');
          if(pr?.head?.sha!==process.env.CANDIDATE_SHA) fail('AQ_V2_VERIFY_CANDIDATE_SHA_CHANGED');
          NODE
          rm -f pr.json

      - name: Exercise exact evaluator fix without sealed corpus
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORIGIN_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          ORIGIN_AQ_V2_CANDIDATE_CHECKOUT: ${{ github.workspace }}/candidate
          ORIGIN_AQ_V2_PREFLIGHT_RESULT_PATH: ${{ github.workspace }}/test-results/trusted-answer-runtime-preflight-v2.json
        run: |
          set -euo pipefail
          node --import tsx scripts/preflight-trusted-answer-runtime-v2.ts

      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aq-runtime-fix-candidate-${{ env.EVALUATOR_SHA }}-${{ github.run_id }}
          path: test-results/trusted-answer-runtime-preflight-v2.json
          if-no-files-found: error
          retention-days: 30
