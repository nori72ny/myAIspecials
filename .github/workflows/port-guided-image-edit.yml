name: Port guided image edit to current main

on:
  push:
    branches:
      - port/guided-image-edit-current-main-20261003

permissions:
  contents: write

concurrency:
  group: port-guided-image-edit-current-main-20261003
  cancel-in-progress: false

jobs:
  port-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Apply reviewed guided-edit delta with bounded conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/nori72ny/myAIspecials/pull/766.diff \
            --output /tmp/guided-image-edit.diff

          set +e
          git apply --3way --whitespace=error-all /tmp/guided-image-edit.diff
          apply_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "$apply_status" -ne 0 ]; then
            if [ "$conflicts" != "src/App.test.tsx" ]; then
              echo 'Unexpected three-way conflict set; refusing to continue.' >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi
            echo 'Only App.test.tsx conflicted; preserving current-main tests and adding focused guided-edit coverage.'
            git checkout --ours src/App.test.tsx
            git add src/App.test.tsx
            python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.test.tsx')
          text = path.read_text()

          old_import = 'ArtifactWorkspace, buildRasterVariationPrompt,'
          new_import = 'ArtifactWorkspace, buildRasterGuidedEditPrompt, buildRasterVariationPrompt,'
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('Expected App.test import anchor not found')
              text = text.replace(old_import, new_import, 1)

          anchor = "  it('routes a lineage-aware alternative through bounded reference-image editing', async () => {"
          guided_test = """  it('builds a preserve-by-default guided edit contract from the original visual request', () => {\n    const prompt = buildRasterGuidedEditPrompt('青い陶器のマグカップを正方形の商品写真で作ってください');\n    expect(prompt).toContain('青い陶器のマグカップ');\n    expect(prompt).toContain('Edit the verified source image');\n    expect(prompt).toContain('Preserve the original subject identity');\n    expect(prompt).toContain('does not explicitly ask to change');\n  });\n\n"""
          if "preserve-by-default guided edit contract" not in text:
              if anchor not in text:
                  raise SystemExit('Expected guided-edit test insertion anchor not found')
              text = text.replace(anchor, guided_test + anchor, 1)

          path.write_text(text)
          PY
            git add src/App.test.tsx
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge markers remain; refusing to continue.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          changed="$(git diff --name-only HEAD)"
          printf '%s\n' "$changed"
          for required in \
            src/App.tsx \
            src/App.test.tsx \
            src/lib/orchestration/OriginCapabilityGuide.ts \
            src/lib/orchestration/OriginCapabilityGuide.test.ts \
            tests/e2e/reference-image-variation.spec.ts; do
            printf '%s\n' "$changed" | grep -Fxq "$required" || {
              echo "Missing expected guided-edit file: $required" >&2
              exit 1
            }
          done

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and design-token lock
        run: npm run lint

      - name: Run focused guided-edit unit tests
        run: npx vitest run src/App.test.tsx src/lib/orchestration/OriginCapabilityGuide.test.ts --reporter=default

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium for focused E2E
        run: npx playwright install --with-deps chromium

      - name: Run guided-edit responsive E2E
        env:
          CI: 'true'
        run: npx playwright test tests/e2e/reference-image-variation.spec.ts --project=chromium

      - name: Verify guided-edit invariants in resulting source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "buildRasterGuidedEditPrompt" src/App.tsx
          grep -Fq "画像を編集" src/App.tsx
          grep -Fq "relation: 'edited-from'" src/App.tsx
          grep -Fq "actualSha === referenceAssetId.toLowerCase()" src/App.tsx
          grep -Fq "Mask-directed inpainting" src/lib/orchestration/OriginCapabilityGuide.ts
          grep -Fq "canvas-expansion outpainting" src/lib/orchestration/OriginCapabilityGuide.ts
          grep -Fq "image-edit-mode" tests/e2e/reference-image-variation.spec.ts

      - name: Commit only verified product delta
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/port-guided-image-edit.yml
          git add -A
          git diff --cached --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(image): port guided editing onto current main [guided-port-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
