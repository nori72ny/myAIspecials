name: ORIGIN one-time numeric postprocessor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'origin: add fail-closed numeric processor')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch renderer
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/personal/UnifiedChat.tsx')
          s = p.read_text()
          marker = "function mobileFriendlyMarkdown(source: string): string {"
          insert = r'''type NumericPostProcessResult = { source: string; hadNumericEstimates: boolean };

/**
 * Fail-closed numeric display guard. Numbers are treated as unverified unless
 * they are inside an explicit <verified_source>...</verified_source> region.
 * Markdown/code spans and fenced code are left untouched.
 */
function postProcessUnverifiedNumbers(source: string): NumericPostProcessResult {
  const verifiedRanges: Array<[number, number]> = [];
  const verifiedRe = /<verified_source>[\s\S]*?<\/verified_source>/gi;
  let match: RegExpExecArray | null;
  while ((match = verifiedRe.exec(source)) !== null) {
    verifiedRanges.push([match.index, match.index + match[0].length]);
  }

  const codeRe = /```[\s\S]*?```|`[^`]*`/g;
  const protectedRanges: Array<[number, number]> = [];
  while ((match = codeRe.exec(source)) !== null) {
    protectedRanges.push([match.index, match.index + match[0].length]);
  }

  const inRange = (index: number, ranges: Array<[number, number]>) =>
    ranges.some(([start, end]) => index >= start && index < end);

  const numericRe = /(?<![\w])(?:[$€£¥￥]\s?)?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?(?:\s?(?:%|万円|億円|円|USD|EUR|GBP|JPY|ドル))?(?![\w])/g;
  let changed = false;
  const output: string[] = [];
  let cursor = 0;
  while ((match = numericRe.exec(source)) !== null) {
    const index = match.index;
    if (inRange(index, verifiedRanges) || inRange(index, protectedRanges)) continue;
    const value = match[0];
    output.push(source.slice(cursor, index));
    output.push(`[⚠️ AI推定値: ${value}](#estimate-unverified)`);
    cursor = index + value.length;
    changed = true;
  }
  if (!changed) return { source, hadNumericEstimates: false };
  output.push(source.slice(cursor));
  return { source: output.join(''), hadNumericEstimates: true };
}

'''
          if 'function postProcessUnverifiedNumbers(' not in s:
              s = s.replace(marker, insert + marker, 1)
          old = '''        a: ({ children: label, href }) => (
          <a
            href={href}
            target="_blank"
            rel="noreferrer noopener"
            className="font-medium text-origin-brand underline decoration-origin-brand/40 underline-offset-2"
          >
            {label}
          </a>
        ),'''
          new = '''        a: ({ children: label, href }) => {
          if (href === '#estimate-unverified') {
            return (
              <span
                role="note"
                title={isEn ? 'AI estimate — verify before relying on this number.' : 'AI推定値 — 利用前に根拠を確認してください。'}
                className="mx-0.5 inline-flex items-center rounded-md bg-yellow-100 px-1.5 py-0.5 font-medium text-yellow-900 ring-1 ring-yellow-300/80 dark:bg-yellow-400/15 dark:text-yellow-100 dark:ring-yellow-300/30"
              >
                {label}
              </span>
            );
          }
          return (
            <a
              href={href}
              target="_blank"
              rel="noreferrer noopener"
              className="font-medium text-origin-brand underline decoration-origin-brand/40 underline-offset-2"
            >
              {label}
            </a>
          );
        },'''
          if old not in s:
              raise SystemExit('expected markdown link renderer not found')
          s = s.replace(old, new, 1)
          old2 = '''    >
      {mobileFriendlyMarkdown(children)}
    </ReactMarkdown>'''
          new2 = '''    >
      {postProcessUnverifiedNumbers(mobileFriendlyMarkdown(children)).source}
    </ReactMarkdown>'''
          if old2 not in s:
              raise SystemExit('expected markdown source not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
      - name: Verify
        run: npm run build && npm run lint
      - name: Commit patched renderer and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/origin-numeric-postprocessor.yml
          git add src/components/personal/UnifiedChat.tsx .github/workflows/origin-numeric-postprocessor.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: fail-closed numeric rendering guard [skip ci]"
          git push origin HEAD:main
