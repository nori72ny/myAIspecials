name: ORIGIN numeric postprocessor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch SafeMarkdown
        if: contains(github.event.head_commit.message, 'origin: execute numeric postprocessor final')
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/personal/UnifiedChat.tsx')
          s = p.read_text(encoding='utf-8')
          if 'function postProcessUnverifiedNumbers(' in s:
              print('Already patched.')
              raise SystemExit(0)
          anchor = 'function mobileFriendlyMarkdown(source: string): string {'
          if anchor not in s: raise SystemExit('SafeMarkdown anchor not found')
          helper = r'''type NumericPostProcessResult = { source: string; hadNumericEstimates: boolean };

function postProcessUnverifiedNumbers(source: string): NumericPostProcessResult {
  const protectedRanges: Array<[number, number]> = [];
  const addRanges = (re: RegExp) => { let match: RegExpExecArray | null; while ((match = re.exec(source)) !== null) protectedRanges.push([match.index, match.index + match[0].length]); };
  addRanges(/<verified_source>[\s\S]*?<\/verified_source>/gi);
  addRanges(/```[\s\S]*?```|`[^`\n]*`/g);
  addRanges(/https?:\/\/[^\s)<>]+|www\.[^\s)<>]+/gi);
  addRanges(/!?(?:\[[^\]]*\])\([^)]*\)/g);
  const protectedAt = (index: number) => protectedRanges.some(([start, end]) => index >= start && index < end);
  const dateLike = (value: string, index: number) => {
    const before = source.slice(Math.max(0, index - 8), index);
    const after = source.slice(index + value.length, Math.min(source.length, index + value.length + 8));
    if (/^(?:19|20)\d{2}$/.test(value) && /^(?:年|[-/.])/.test(after)) return true;
    if (/^(?:0?[1-9]|1[0-2])$/.test(value) && /^(?:月|日)/.test(after)) return true;
    if (/^(?:0?[1-9]|[12]\d|3[01])$/.test(value) && /^日/.test(after)) return true;
    return /(?:^|[\s(（])(?:19|20)\d{2}[年.\-/]?$/.test(before + value);
  };
  const numericRe = /(?<![\w])(?:[$€£¥￥]\s?)?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?(?:\s?(?:%|万円|億円|円|USD|EUR|GBP|JPY|ドル))?(?![\w])/g;
  const output: string[] = []; let cursor = 0; let changed = false; let match: RegExpExecArray | null;
  while ((match = numericRe.exec(source)) !== null) {
    const index = match.index; const value = match[0];
    if (protectedAt(index) || dateLike(value, index)) continue;
    const following = source.slice(index + value.length);
    if (/^\s*\./.test(following) && !/[\$€£¥￥%円万億]/.test(value)) continue;
    output.push(source.slice(cursor, index)); output.push(`[⚠️ AI推定値: ${value}](#estimate-unverified)`); cursor = index + value.length; changed = true;
  }
  if (!changed) return { source, hadNumericEstimates: false };
  output.push(source.slice(cursor)); return { source: output.join(''), hadNumericEstimates: true };
}

'''
          s = s.replace(anchor, helper + anchor, 1)
          old = '''        a: ({ children: label, href }) => (
          <a
            href={href}
            target="_blank"
            rel="noreferrer noopener"
            className="font-medium text-origin-brand underline decoration-origin-brand/40 underline-offset-2"
          >
            {label}
          </a>
        ),'''
          new = '''        a: ({ children: label, href }) => {
          if (href === '#estimate-unverified') return <span role="note" title={isEn ? 'AI estimate — verify before relying on this number.' : 'AI推定値 — 利用前に根拠を確認してください。'} aria-label={isEn ? 'AI-estimated value' : 'AI推定値'} className="mx-0.5 inline-flex items-center rounded-md bg-yellow-100 px-1.5 py-0.5 font-medium text-yellow-900 ring-1 ring-yellow-300/80 dark:bg-yellow-400/15 dark:text-yellow-100 dark:ring-yellow-300/30">{label}</span>;
          return <a href={href} target="_blank" rel="noreferrer noopener" className="font-medium text-origin-brand underline decoration-origin-brand/40 underline-offset-2">{label}</a>;
        },'''
          if old not in s: raise SystemExit('link renderer anchor not found')
          s = s.replace(old, new, 1)
          old2 = '''    >
      {mobileFriendlyMarkdown(children)}
    </ReactMarkdown>'''
          new2 = '''    >
      {postProcessUnverifiedNumbers(mobileFriendlyMarkdown(children)).source}
    </ReactMarkdown>'''
          if old2 not in s: raise SystemExit('render anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify
        if: contains(github.event.head_commit.message, 'origin: execute numeric postprocessor final')
        run: npm run build && npm run lint
      - name: Commit implementation and cleanup
        if: contains(github.event.head_commit.message, 'origin: execute numeric postprocessor final')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .origin-numeric-postprocessor-trigger-final .origin-numeric-postprocessor-trigger .origin-numeric-postprocessor-trigger-v5
          rm -f .github/workflows/origin-numeric-postprocessor.yml .github/workflows/origin-numeric-postprocessor2.yml .github/workflows/origin-numeric-postprocessor3.yml .github/workflows/origin-numeric-postprocessor4.yml .github/workflows/origin-numeric-postprocessor5.yml
          git add src/components/personal/UnifiedChat.tsx .origin-numeric-postprocessor-trigger-final .origin-numeric-postprocessor-trigger .origin-numeric-postprocessor-trigger-v5 .github/workflows/
          git commit -m "fix: fail-closed context-aware numeric rendering [skip ci]"
          git push origin HEAD:main
