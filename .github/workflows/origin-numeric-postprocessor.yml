name: ORIGIN numeric postprocessor

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch SafeMarkdown
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/personal/UnifiedChat.tsx')
          s = p.read_text(encoding='utf-8')
          if 'function applyEstimateMarkers' in s:
              print('Postprocessor already present; nothing to patch.')
              raise SystemExit(0)
          anchor = 'function SafeMarkdown({'
          if anchor not in s:
              raise SystemExit('SafeMarkdown not found')
          helper = r'''
const ESTIMATE_MARKER = 'origin-estimate-';

function isLikelyDateOrYear(source: string, start: number, end: number): boolean {
  const after = source.slice(end, Math.min(source.length, end + 8));
  const token = source.slice(start, end);
  if (/^(?:19|20)\d{2}$/.test(token) && /^(?:年|-|\/|\.)/.test(after)) return true;
  if (/^(?:0?[1-9]|1[0-2])$/.test(token) && /^(?:月|日)/.test(after)) return true;
  if (/^(?:0?[1-9]|[12]\d|3[01])$/.test(token) && /^日/.test(after)) return true;
  return false;
}

function protectMarkdownExclusions(source: string): { text: string; protectedParts: string[] } {
  const protectedParts: string[] = [];
  const stash = (value: string) => {
    const index = protectedParts.push(value) - 1;
    return `\u0000ORIGIN_PROTECTED_${index}\u0000`;
  };
  let text = source;
  text = text.replace(/```[\s\S]*?```/g, stash);
  text = text.replace(/`[^`\n]+`/g, stash);
  text = text.replace(/!?(?:\[[^\]]*\])\((?:https?:\/\/|www\.)[^)]+\)/g, stash);
  text = text.replace(/https?:\/\/[^\s)]+/g, stash);
  return { text, protectedParts };
}

function applyEstimateMarkers(source: string): string {
  const { text, protectedParts } = protectMarkdownExclusions(source);
  const marked = text.replace(/(?:¥|￥|\$|€|£)?(?<![\w.])(?:\d{1,3}(?:,\d{3})+|\d+(?:\.\d+)?)(?:%|円|万円|億円|ドル|USD|EUR|GBP)?(?![\w.])/g, (match, _unused, whole) => {
    const start = whole.indexOf(match);
    const end = start + match.length;
    if (isLikelyDateOrYear(whole, start, end)) return match;
    return /\d/.test(match) ? `[[${ESTIMATE_MARKER}${encodeURIComponent(match)}]]` : match;
  });
  return marked.replace(/\u0000ORIGIN_PROTECTED_(\d+)\u0000/g, (_match, index) => protectedParts[Number(index)] ?? '');
}

function renderEstimateText(value: string, isEn: boolean): React.ReactNode[] {
  return value.split(/(\[\[origin-estimate-[^\]]+\]\])/g).map((part, index) => {
    const match = part.match(/^\[\[origin-estimate-(.+)\]\]$/);
    if (!match) return <React.Fragment key={index}>{part}</React.Fragment>;
    let label = match[1];
    try { label = decodeURIComponent(label); } catch { /* fail closed */ }
    return (
      <span
        key={index}
        title={isEn ? '⚠️ AI-estimated value — verify before treating as fact.' : '⚠️ AI推定値 — 確定事実として扱う前に確認してください。'}
        aria-label={isEn ? `AI-estimated value: ${label}` : `AI推定値：${label}`}
        role="note"
        className="rounded bg-amber-100 px-1 text-amber-900 underline decoration-dotted decoration-amber-500 underline-offset-2 dark:bg-amber-950/50 dark:text-amber-200"
      >
        ⚠️ {label}
      </span>
    );
  });
}

'''
          s = s.replace(anchor, helper + anchor, 1)
          components = 'components={{\n'
          if components not in s:
              raise SystemExit('ReactMarkdown components anchor not found')
          s = s.replace(components, 'components={{\n        text: ({ children: text }) => <>{renderEstimateText(String(text ?? \'\'), isEn)}</>,\n', 1)
          child = '      {mobileFriendlyMarkdown(children)}\n'
          if child not in s:
              raise SystemExit('SafeMarkdown children anchor not found')
          s = s.replace(child, '      {applyEstimateMarkers(mobileFriendlyMarkdown(children))}\n', 1)
          p.write_text(s, encoding='utf-8')

      - name: Typecheck and build
        run: npm run lint && npm run build

      - name: Commit and push implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/personal/UnifiedChat.tsx
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m "chore: apply context-aware numeric postprocessor"
          git push origin HEAD:main

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/origin-numeric-postprocessor.yml
          git commit -m "chore: remove temporary numeric postprocessor workflow"
          git push origin HEAD:main
