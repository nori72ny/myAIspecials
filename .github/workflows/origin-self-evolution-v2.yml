name: ORIGIN Self-Evolution V2

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: origin-self-evolution-v2
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ vars.ORIGIN_SELF_EVOLUTION_DISABLED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Observe and score external evidence
        run: node scripts/origin-self-evolution-v2.mjs

      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: origin-self-evolution-v2-${{ github.run_id }}
          path: |
            origin-self-evolution-v2.json
            origin-self-evolution-v2.md
          if-no-files-found: warn
          retention-days: 14
