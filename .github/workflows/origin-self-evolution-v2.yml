name: ORIGIN Self-Evolution V2

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "37 20 * * *"
    - cron: "47 23 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "hourly, daily, weekly, or all"
        required: false
        default: "all"
        type: choice
        options:
          - hourly
          - daily
          - weekly
          - all

permissions:
  contents: read

concurrency:
  group: origin-self-evolution-v2
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ vars.ORIGIN_SELF_EVOLUTION_DISABLED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ORIGIN_SELF_EVOLUTION_SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '17 * * * *' && 'hourly' || github.event.schedule == '37 20 * * *' && 'daily' || 'weekly') }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Capture exact ORIGIN production baseline
        run: node scripts/origin-self-evolution-v2-baseline.mjs

      - name: Observe and score external evidence
        run: node scripts/origin-self-evolution-v2.mjs

      - name: Validate source integrity and untrusted-content boundary
        run: node scripts/origin-self-evolution-v2-source-integrity.mjs

      - name: Build baseline-comparison candidate queue
        run: node scripts/origin-self-evolution-v2-plan.mjs

      - name: Assess measured ORIGIN gaps and solution fit
        run: node scripts/origin-self-evolution-v2-gap.mjs

      - name: Rank improvement candidates against baseline
        run: node scripts/origin-self-evolution-v2-priority.mjs

      - name: Package high-priority improvement queue proposal
        run: node scripts/origin-self-evolution-v2-issue.mjs

      - name: Build experiment specifications
        run: node scripts/origin-self-evolution-v2-experiments.mjs

      - name: Verify sandbox eligibility
        run: node scripts/origin-self-evolution-v2-verify.mjs

      - name: Authorize isolated dry-run experiments
        env:
          ORIGIN_EVALUATION_FREEZE: ${{ vars.ORIGIN_EVALUATION_FREEZE || 'true' }}
          ORIGIN_BASELINE_MAX_AGE_MS: "21600000"
        run: node scripts/origin-self-evolution-v2-authorize.mjs

      - name: Enforce self-evolution circuit breaker
        run: node scripts/origin-self-evolution-v2-circuit-breaker.mjs

      - name: Record self-evolution decision ledger
        run: node scripts/origin-self-evolution-v2-ledger.mjs

      - name: Build promotion packages
        run: node scripts/origin-self-evolution-v2-promotion.mjs

      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: origin-self-evolution-v2-${{ github.run_id }}
          path: |
            origin-self-evolution-baseline-v2.json
            origin-self-evolution-baseline-v2.md
            origin-self-evolution-v2.json
            origin-self-evolution-v2.md
            origin-self-evolution-source-integrity-v2.json
            origin-self-evolution-source-integrity-v2.md
            origin-self-evolution-candidates-v2.json
            origin-self-evolution-candidates-v2.md
            origin-self-evolution-gap-v2.json
            origin-self-evolution-gap-v2.md
            origin-self-evolution-priority-v2.json
            origin-self-evolution-priority-v2.md
            origin-self-evolution-issue-proposal-v2.json
            origin-self-evolution-issue-proposal-v2.md
            origin-self-evolution-experiments-v2.json
            origin-self-evolution-experiments-v2.md
            origin-self-evolution-verification-v2.json
            origin-self-evolution-verification-v2.md
            origin-self-evolution-authorization-v2.json
            origin-self-evolution-authorization-v2.md
            origin-self-evolution-circuit-breaker-v2.json
            origin-self-evolution-circuit-breaker-v2.md
            origin-self-evolution-decision-ledger-v2.json
            origin-self-evolution-decision-ledger-v2.md
            origin-self-evolution-promotion-v2.json
            origin-self-evolution-promotion-v2.md
          if-no-files-found: warn
          retention-days: 14
