name: AQ V2 fresh current-main one-shot trigger

on:
  workflow_dispatch:
    inputs:
      round_id:
        description: Fresh frozen AQ V2 round id
        required: true
        type: string
      corpus_id:
        description: Fresh evaluator-owned sealed corpus id already ingested into the trusted private store
        required: true
        type: string
      corpus_digest:
        description: Expected sha256 digest for the fresh sealed corpus
        required: true
        type: string
      confirmation:
        description: Type RUN_FRESH_CURRENT_MAIN to confirm a one-shot current-main dispatch
        required: true
        type: string

permissions:
  contents: read
  actions: write
  statuses: read

concurrency:
  group: origin-aq-v2-current-main-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate fresh current-main dispatch inputs
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          ROUND_ID: ${{ inputs.round_id }}
          CORPUS_ID: ${{ inputs.corpus_id }}
          CORPUS_DIGEST: ${{ inputs.corpus_digest }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const sha=process.env.CANDIDATE_SHA||'';
          const round=process.env.ROUND_ID||'';
          const corpusId=process.env.CORPUS_ID||'';
          const corpusDigest=process.env.CORPUS_DIGEST||'';
          const confirmation=process.env.CONFIRMATION||'';
          const fail=code=>{console.error(code);process.exit(2);};
          if(!/^[a-f0-9]{40}$/.test(sha)) fail('AQ_V2_CURRENT_MAIN_SHA_INVALID');
          if(!/^[A-Za-z0-9][A-Za-z0-9._:-]{2,119}$/.test(round)) fail('AQ_V2_ROUND_ID_INVALID');
          if(!/^[A-Za-z0-9][A-Za-z0-9._:-]{2,159}$/.test(corpusId)) fail('AQ_V2_CORPUS_ID_INVALID');
          if(!/^[a-f0-9]{64}$/.test(corpusDigest)) fail('AQ_V2_CORPUS_DIGEST_INVALID');
          if(confirmation!=='RUN_FRESH_CURRENT_MAIN') fail('AQ_V2_CURRENT_MAIN_CONFIRMATION_REQUIRED');
          NODE

      - name: Block an already-reserved sealed corpus before provider calibration
        id: corpus
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LEDGER_ANCHOR_SHA: 01f7db0c0d48ab3ba533148e99e1847203e13f4c
          CORPUS_DIGEST: ${{ inputs.corpus_digest }}
        run: |
          set -euo pipefail
          context="origin/aq-v2-corpus/${CORPUS_DIGEST}"
          reserved='0'
          page=1
          while :; do
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${REPOSITORY}/commits/${LEDGER_ANCHOR_SHA}/statuses?per_page=100&page=${page}" \
              -o statuses.json
            count="$(node -e "const v=require('./statuses.json');process.stdout.write(String(v.length))")"
            found="$(CONTEXT="$context" node - <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync('statuses.json','utf8'));
          process.stdout.write(rows.some(row=>row?.context===process.env.CONTEXT)?'1':'0');
          NODE
          )"
            rm -f statuses.json
            if [ "$found" = '1' ]; then reserved='1'; break; fi
            [ "$count" = '100' ] || break
            page=$((page + 1))
            [ "$page" -le 20 ] || { echo 'AQ_V2_STATUS_LEDGER_PAGINATION_LIMIT' >&2; exit 2; }
          done
          echo "reserved=$reserved" >> "$GITHUB_OUTPUT"
          if [ "$reserved" = '1' ]; then
            echo '::warning title=AQ V2 one-shot guard::This sealed corpus digest is already reserved. Dispatch is blocked before any provider calibration.'
          fi

      - name: Block repeated same-day dispatch after a free-provider 429
        id: quota
        if: ${{ steps.corpus.outputs.reserved != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LEDGER_ANCHOR_SHA: 01f7db0c0d48ab3ba533148e99e1847203e13f4c
        run: |
          set -euo pipefail
          utc_day="$(date -u +%F)"
          context="origin/aq-v2-free-quota/${utc_day}"
          blocked='0'
          page=1
          while :; do
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${REPOSITORY}/commits/${LEDGER_ANCHOR_SHA}/statuses?per_page=100&page=${page}" \
              -o statuses.json
            count="$(node -e "const v=require('./statuses.json');process.stdout.write(String(v.length))")"
            found="$(CONTEXT="$context" node - <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync('statuses.json','utf8'));
          process.stdout.write(rows.some(row=>row?.context===process.env.CONTEXT)?'1':'0');
          NODE
          )"
            rm -f statuses.json
            if [ "$found" = '1' ]; then blocked='1'; break; fi
            [ "$count" = '100' ] || break
            page=$((page + 1))
            [ "$page" -le 20 ] || { echo 'AQ_V2_STATUS_LEDGER_PAGINATION_LIMIT' >&2; exit 2; }
          done
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          if [ "$blocked" = '1' ]; then
            echo "::warning title=AQ V2 free quota guard::A free-provider 429 has already been recorded for ${utc_day} UTC. Fresh AQ dispatch is skipped to preserve the remaining zero-cost quota."
          fi

      - name: Dispatch trusted AQ V2 for this exact current main SHA
        if: ${{ steps.corpus.outputs.reserved != '1' && steps.quota.outputs.blocked != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          ROUND_ID: ${{ inputs.round_id }}
          CORPUS_ID: ${{ inputs.corpus_id }}
          CORPUS_DIGEST: ${{ inputs.corpus_digest }}
        run: |
          set -euo pipefail
          node <<'NODE' > payload.json
          const payload={
            ref:'main',
            inputs:{
              candidate_sha:process.env.CANDIDATE_SHA,
              pr_number:'0',
              round_id:process.env.ROUND_ID,
              corpus_id:process.env.CORPUS_ID,
              corpus_digest:process.env.CORPUS_DIGEST,
            },
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          curl --fail --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/trusted-answer-quality-v2.yml/dispatches" \
            --data-binary @payload.json
          rm -f payload.json
