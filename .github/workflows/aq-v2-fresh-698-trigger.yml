name: AQ V2 fresh PR 698 one-shot trigger

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: ${{ contains(github.event.head_commit.message, '[aq-v2-fresh3-remediation-698]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch trusted AQ V2 with frozen fresh inputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > payload.json <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "candidate_sha": "cb5a6a6e3ef44973da1e40bb253b6b6bf26779e0",
              "pr_number": "698",
              "round_id": "round-2026-09-28-remediation-fresh-3-1",
              "corpus_id": "origin-aq-v2-independent-2026-09-28-fresh-3",
              "corpus_digest": "d989db1d9e2e1ca1bed64f76db139f306238ad74dec11167df1442d04b5e834a"
            }
          }
          JSON
          curl --fail --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/trusted-answer-quality-v2.yml/dispatches" \
            --data-binary @payload.json
          rm -f payload.json
