name: Read-only OpenRouter ZDR endpoint diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: origin-zdr-get-only-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run GET-only ZDR diagnostics
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node --import tsx scripts/diagnose-origin-zdr-get-only.ts
