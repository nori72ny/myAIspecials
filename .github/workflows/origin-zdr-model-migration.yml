name: ORIGIN ZDR model migration

on:
  push:
    branches:
      - fix/origin-zdr-free-model
    paths:
      - .github/workflows/origin-zdr-model-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/origin-zdr-free-model
      - name: Replace active fixed-model references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'google/gemma-4-26b-a4b-it:free'
          new = 'nex-agi/nex-n2-pro:free'
          paths = [
              'src/App.tsx',
              'src/App.test.tsx',
              'src/lib/orchestration/OriginFreeModelCatalog.test.ts',
              'src/legacy/originChatRouter.test.ts',
              'src/legacy/originProviderClient.security-regression.test.ts',
              'src/legacy/acronymDefinitionIntent.security-regression.test.ts',
              'src/release/OriginPersonalRelease1Gate.test.ts',
              'tests/e2e/acos.spec.ts',
              'SECURITY.md',
              'RELEASE_NOTES.md',
              'ROADMAP.md',
              'KNOWN_LIMITATIONS.md',
              'PRODUCTION_CHECKLIST.md',
              'RELEASE_CERTIFICATION.md',
          ]
          for raw in paths:
              path = Path(raw)
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))
          PY
      - name: Remove one-time migration workflow and commit
        shell: bash
        run: |
          rm .github/workflows/origin-zdr-model-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: align clients and tests with ZDR free model'
          git push origin HEAD:fix/origin-zdr-free-model
