name: audit-v1-hardening-check
on:
  push:
    branches: [fix/audit-v1-hardening]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm test -- --runInBand
