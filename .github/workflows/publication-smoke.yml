name: V1.3.1 Production Publication Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publication-smoke.yml
      - scripts/verify-production-publication.mjs

permissions:
  contents: read

jobs:
  publish-serve-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify temporary publication lifecycle
        env:
          ORIGIN_PRODUCTION_URL: https://origin-personal.vercel.app
          ORIGIN_AGENT_APPROVAL_SECRET: ${{ secrets.ORIGIN_AGENT_APPROVAL_SECRET }}
        run: node scripts/verify-production-publication.mjs
