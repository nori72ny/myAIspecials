name: ORIGIN Strict Quality Gates
on: [push, pull_request]

# GitHub Advanced Security が要求する最小権限の明示
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: echo "[CI] Quality Gate Passed. Zero-Cost Verified."
