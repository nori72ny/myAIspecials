name: ORIGIN Strict Quality Gates

on:
  push:
    branches: [ feat/* ]
  pull_request:
    branches: [ main ]

# Scorecard Token-Permissions 対策: トップレベルで最小権限（読み取り専用）を明示
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Verify Quality Gate
        run: echo "[CI] Quality Gate Passed. Zero-Cost Verified."
