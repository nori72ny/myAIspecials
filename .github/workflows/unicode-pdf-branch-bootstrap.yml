name: Unicode PDF branch bootstrap

on:
  push:
    branches:
      - quality/unicode-pdf-v1
    paths:
      - .github/workflows/unicode-pdf-branch-bootstrap.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/unicode-pdf-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(pdf): refresh lockfile for Unicode renderer"
          git push origin HEAD:quality/unicode-pdf-v1
