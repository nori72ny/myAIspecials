name: Temporary dependency audit repair

on:
  push:
    branches:
      - fix/origin-v16-pwa-boundary
    paths:
      - '.github/workflows/temp-dependency-audit-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: origin-temp-dependency-audit-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/fix/origin-v16-pwa-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/origin-v16-pwa-boundary
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Use current npm 11 CLI
        run: npm install --global npm@11
      - name: Install locked dependency tree
        run: npm ci
      - name: Inspect current vulnerabilities
        run: npm audit --json > audit-before.json || true
      - name: Apply compatible dependency fixes
        run: npm audit fix
      - name: Commit updated lockfile when changed
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix(deps): apply npm audit fixes"
            git push origin HEAD:fix/origin-v16-pwa-boundary
          else
            echo "No dependency manifest changes were needed."
          fi
      - name: Clean install
        run: npm ci
      - name: Production audit
        run: npm audit --omit=dev --audit-level=low
      - name: All dependency audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test
      - name: Patch hygiene
        run: git diff --check
