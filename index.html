<script>
(function() {
  const scriptStartTime = performance.now();
  let measuredDuration = null;

  const { useState, useEffect, useRef, useCallback, Component, createElement: h } = React;
  const MAX_ATTEMPTS = 3, TASK_TIMEOUT = 25000, BEAT_LOST = 6000;
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const makeTaskId = () => {
    try { if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID(); } catch (_) {}
    const random = window.crypto && typeof window.crypto.getRandomValues === 'function'
      ? Array.from(window.crypto.getRandomValues(new Uint32Array(4)), n => n.toString(16)).join('-')
      : Math.random().toString(36).slice(2) + '-' + Math.random().toString(36).slice(2);
    return 'task-' + Date.now().toString(36) + '-' + random;
  };

  const STATUS = { pending:'待機', running:'実行中', done:'完了', failed:'失敗', interrupted:'中断' };
  const BADGE = {
    pending:'bg-zinc-800 text-zinc-200', running:'bg-amber-900 text-amber-200',
    done:'bg-emerald-900 text-emerald-300', failed:'bg-red-900 text-red-200', interrupted:'bg-sky-900 text-sky-200'
  };

  const wikiUrl = t => {
    const normalized = t.replace(/ /g, '_');
    const encoded = encodeURIComponent(normalized).replace(/[()']/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase());
    return 'https://ja.wikipedia.org/wiki/' + encoded;
  };

  class Boundary extends Component {
    constructor(p){ super(p); this.state = { err:null }; }
    static getDerivedStateFromError(err){ return { err }; }
    componentDidCatch(e){ console.error('[ORIGIN Boundary Catch]:', e); }
    render(){
      if (!this.state.err) return this.props.children;
      return h('div', { role: 'alert', className: 'p-6' },
        h('p', { className: 'text-sm text-red-300 break-all' }, '描画例外: ' + String(this.state.err.message)),
        h('button', {
          type: 'button',
          onClick: () => this.setState({ err: null }),
          className: 'mt-3 min-h-[44px] px-4 rounded-xl bg-emerald-500 text-black font-bold text-xs'
        }, '画面を復旧')
      );
    }
  }

  class Vault {
    constructor(){ this.p = null; }
    open(){
      if (!window.indexedDB) {
        this.p = null;
        return Promise.reject(new Error('IndexedDB非対応ブラウザです'));
      }
      if (this.p) return this.p;

      this.p = new Promise((res, rej) => {
        let isBlocked = false;
        const rq = indexedDB.open('OriginUltraV16', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('tasks', { keyPath:'id' });
        rq.onblocked = () => {
          isBlocked = true;
          rej(new Error('旧バージョンのタブが開いているためブロックされました。他タブを閉じてください'));
        };
        rq.onsuccess = () => {
          if (isBlocked) { try { rq.result.close(); } catch(_) {} return; }
          rq.result.onversionchange = () => {
            try { rq.result.close(); } catch(_) {}
            this.p = null;
          };
          rq.result.onclose = () => { this.p = null; };
          res(rq.result);
        };
        rq.onerror = () => rej(rq.error || new Error('IndexedDB接続失敗'));
      }).catch(err => {
        this.p = null;
        throw err;
      });

      return this.p;
    }
    reset(){ this.p = null; }
    async tx(mode, fn){
      const db = await this.open();
      return new Promise((res, rej) => {
        let t, out;
        try {
          t = db.transaction('tasks', mode);
          out = fn(t.objectStore('tasks'));
        } catch (e) { this.p = null; return rej(e instanceof Error ? e : new Error(String(e))); }
        t.oncomplete = () => res(out && out.result !== undefined ? out.result : true);
        t.onerror = t.onabort = () => rej(t.error || new Error('IndexedDBトランザクション中断'));
      });
    }
    all(){ return this.tx('readonly', s => s.getAll()); }
    put(task){ return this.tx('readwrite', s => s.put(task)); }
    clear(){ return this.tx('readwrite', s => s.clear()); }
    delete(id){ return this.tx('readwrite', s => s.delete(id)); }
  }
  const vault = new Vault();

  const syncCh = typeof BroadcastChannel === 'function' ? new BroadcastChannel('origin-ultra-sync') : null;
  const notifyChanged = () => { try { syncCh && syncCh.postMessage('changed'); } catch (_) {} };

  const WORKER_SRC = `
  let beat;
  const ENT = { '&quot;':'"', '&#039;':"'", '&#39;':"'", '&lt;':'<', '&gt;':'>', '&nbsp;':' ' };
  const dec = t => t
    .replace(/&(quot|lt|gt|nbsp|#0?39);/g, m => ENT[m])
    .replace(/&#(\\d+);/g, (m, n) => (+n > 0 && +n <= 0x10FFFF) ? String.fromCodePoint(+n) : m)
    .replace(/&amp;/g, '&');
  onmessage = async (e) => {
    const { query } = e.data;
    beat = setInterval(() => postMessage({ type:'HB' }), 1000);
    try {
      const u = 'https://ja.wikipedia.org/w/api.php?action=query&list=search&srlimit=3&format=json&origin=*&srsearch=' + encodeURIComponent(query);
      const r = await fetch(u, { signal: AbortSignal.timeout(15000) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      const items = (j.query?.search || []).map(s => ({
        title: s.title,
        snippet: dec(s.snippet.replace(/<[^>]+>/g, ''))
      }));
      postMessage({ type:'RESULT', ok:true, items });
    } catch (err) {
      postMessage({ type:'RESULT', ok:false, error:String(err.message || err) });
    } finally { clearInterval(beat); }
  };`;

  function runInWorker(query, onBeat, abortRef){
    return new Promise(resolve => {
      let w, url, timer, watch, done = false, last = Date.now();
      const end = r => {
        if (done) return; done = true;
        clearTimeout(timer); clearInterval(watch); abortRef.current = null;
        try { w && w.terminate(); } catch (_) {}
        if (url) URL.revokeObjectURL(url);
        resolve(r);
      };
      try {
        url = URL.createObjectURL(new Blob([WORKER_SRC], { type:'text/javascript' }));
        w = new Worker(url);
      } catch (e) { return end({ ok:false, error:'Worker生成失敗: ' + e.message }); }
      abortRef.current = () => end({ ok:false, aborted:true, error:'手動停止' });
      w.onmessage = e => { last = Date.now(); onBeat(last); if (e.data.type === 'RESULT') end(e.data); };
      w.onerror = e => end({ ok:false, error:'Worker例外: ' + (e.message || '不明') });
      timer = setTimeout(() => end({ ok:false, error:'タスクタイムアウト(' + TASK_TIMEOUT / 1000 + '秒)' }), TASK_TIMEOUT);
      watch = setInterval(() => { if (Date.now() - last > BEAT_LOST) end({ ok:false, error:'Worker応答喪失(' + BEAT_LOST / 1000 + '秒)' }); }, 1000);
      w.postMessage({ query });
    });
  }

  function App(){
    const [tasks, setTasks] = useState([]);
    const [db, setDb] = useState({ s:'init', m:'' });
    const [running, setRunning] = useState(false);
    const [lockOn, setLockOn] = useState(false);
    const [lockMsg, setLockMsg] = useState('未取得 (前面表示時のみ有効)');
    const [beatAgo, setBeatAgo] = useState(null);
    const [logs, setLogs] = useState([]);
    const [input, setInput] = useState('人工知能\nWebGPU\nScreen Wake Lock API');
    const [testResults, setTestResults] = useState(null);
    const [mountDuration, setMountDuration] = useState(null);
    const runningRef = useRef(false), stopRef = useRef(false), abortRef = useRef(null);
    const lockRef = useRef(null), reasonRef = useRef('unknown'), beatRef = useRef(0), logsRef = useRef([]);

    const log = useCallback(m => {
      logsRef.current = [...logsRef.current.slice(-99), '[' + new Date().toLocaleTimeString() + '] ' + m];
      setLogs(logsRef.current);
    }, []);

    const refresh = useCallback(async () => {
      const all = await vault.all();
      all.sort((a, b) => a.createdAt - b.createdAt);
      setTasks(all);
      return all;
    }, []);

    const retryDbInit = useCallback(async () => {
      vault.reset();
      setDb({ s:'init', m:'再接続中...' });
      try {
        const all = await refresh();
        setDb({ s:'online', m:'' });
        log('IndexedDBへの再接続に成功しました');
        if (all.some(t => ['pending', 'interrupted', 'running'].includes(t.status))) {
          log('未完了タスクを検出、自動再開します');
          startQueue();
        }
      } catch (e) {
        setDb({ s:'unavailable', m:e.message });
        log('IndexedDB再接続失敗: ' + e.message);
      }
    }, [refresh, log]);

    const acquireLock = useCallback(async () => {
      if (lockRef.current && !lockRef.current.released) return true;
      if (!('wakeLock' in navigator)) { setLockMsg('非対応ブラウザ'); return false; }
      try {
        const l = await navigator.wakeLock.request('screen');
        lockRef.current = l; setLockOn(true); setLockMsg('有効 (前面表示中)');
        l.addEventListener('release', () => {
          if (lockRef.current === l) lockRef.current = null;
          setLockOn(false);
          const m = { done:'タスク終了により解除', hidden:'タブ非表示により解除', unknown:'解除 (原因不明: OSの省電力等を含む)' };
          setLockMsg(m[reasonRef.current] || '解除');
        });
        return true;
      } catch (e) { setLockMsg('取得失敗 (' + e.message + ')'); return false; }
    }, []);

    const releaseLock = useCallback(reason => {
      reasonRef.current = reason;
      const l = lockRef.current; lockRef.current = null;
      if (l) l.release().catch(() => {});
    }, []);

    const processQueue = useCallback(async () => {
      if (runningRef.current) return;
      runningRef.current = true; stopRef.current = false; setRunning(true); reasonRef.current = 'unknown';
      try {
        let n = 0;
        for (const t of await vault.all()) {
          if (t.status === 'running') { await vault.put({ ...t, status:'interrupted' }); n++; }
        }
        if (n) log('前回中断された ' + n + ' 件を再開対象に戻しました');

        const got = await acquireLock();
        log('実行開始 / WakeLock: ' + (got ? '有効' : '未取得'));

        for (;;) {
          if (stopRef.current) break;
          const all = await vault.all();
          all.sort((a, b) => a.createdAt - b.createdAt);
          const t = all.find(x => x.status === 'pending' || x.status === 'interrupted');
          if (!t) break;

          let cur = { ...t, error: null };
          while (cur.attempts < MAX_ATTEMPTS && !stopRef.current) {
            cur.attempts += 1; cur.status = 'running';
            await vault.put(cur); await refresh(); notifyChanged();
            log('「' + cur.query + '」実行 (試行 ' + cur.attempts + '/' + MAX_ATTEMPTS + ')');
            const r = await runInWorker(cur.query, ts => { beatRef.current = ts; }, abortRef);
            if (r.ok) { cur = { ...cur, status:'done', items:r.items, error:null, finishedAt:Date.now() }; break; }
            cur.error = r.error;
            if (r.aborted) break;
            log('試行失敗: ' + r.error);
            if (cur.attempts < MAX_ATTEMPTS) await sleep(2000 * 2 ** (cur.attempts - 1));
          }
          if (cur.status !== 'done') cur.status = stopRef.current ? 'interrupted' : 'failed';
          log(cur.status === 'done' ? '完了: ' + cur.items.length + '件 を保存' :
              cur.status === 'failed' ? '失敗確定: ' + cur.error : '中断しました (次回起動時に再開可能)');
          await vault.put(cur); await refresh(); notifyChanged();
        }
      } catch (e) {
        log('キュー実行例外: ' + e.message);
      } finally {
        releaseLock('done'); runningRef.current = false; setRunning(false); setBeatAgo(null);
        refresh().catch(() => {});
      }
    }, [acquireLock, releaseLock, log, refresh]);

    const startQueue = useCallback(async () => {
      if (!navigator.locks || typeof navigator.locks.request !== 'function') {
        setLockMsg('排他制御なし: 安全停止');
        log('【安全停止】Web Locks API 非対応のため、多重実行防止を保証できずキュー実行を拒否しました');
        return;
      }
      try {
        await navigator.locks.request('origin-ultra-runner', { ifAvailable:true }, async lock => {
          if (!lock) {
            log('【排他制御作動】別タブで実行中のため開始を安全に拒否しました (Web Locks)');
            return;
          }
          setLockMsg('排他制御: Web Locks 保持中');
          await processQueue();
        });
      } catch (err) {
        setLockMsg('排他制御エラー: 安全停止');
        log('Web Locks要求例外: ' + err.message + ' (実行を中断)');
        setRunning(false);
      }
    }, [processQueue, log]);

    const runSelfDiagnosticTests = async () => {
      const results = [];
      log('--- [自己診断テストスイート開始] ---');
      
      let idbPass = false, idbDetail = '';
      try {
        const tmpName = 'OriginUltraDiag_' + Date.now();
        const tmp = await new Promise((res, rej) => {
          const rq = indexedDB.open(tmpName, 1);
          rq.onupgradeneeded = () => rq.result.createObjectStore('d', { keyPath:'id' });
          rq.onsuccess = () => res(rq.result);
          rq.onerror = () => rej(rq.error || new Error('一時DB接続失敗'));
        });
        try {
          await new Promise((res, rej) => {
            const t = tmp.transaction('d', 'readwrite');
            t.objectStore('d').put({ id:'x', v:1 });
            t.oncomplete = res;
            t.onerror = t.onabort = () => rej(t.error || new Error('一時DB書込失敗'));
          });
          const got = await new Promise((res, rej) => {
            const t = tmp.transaction('d', 'readonly');
            const g = t.objectStore('d').get('x');
            t.oncomplete = () => res(g.result);
            t.onerror = t.onabort = () => rej(t.error || new Error('一時DB読出失敗'));
          });
          idbPass = !!(got && got.v === 1);
        } finally {
          tmp.close();
          await new Promise(res => {
            const d = indexedDB.deleteDatabase(tmpName);
            d.onsuccess = d.onerror = d.onblocked = () => res();
          });
        }
        await vault.all();
        idbDetail = idbPass ? '一時DBの書込・読出・削除と本番DB読出に成功' : 'データ不一致';
      } catch (e) { idbDetail = e.message; idbPass = false; }
      results.push({ name: 'IndexedDB 書込・読出・後片付け(一時DB)', pass: idbPass, detail: idbDetail });

      try {
        const sample = '人工知能_(曖昧さ回避)';
        const encodedUrl = wikiUrl(sample);
        const isParenSafe = !encodedUrl.includes('(') && !encodedUrl.includes(')');
        results.push({ name: 'Markdown URL丸括弧エンコードテスト', pass: isParenSafe, detail: encodedUrl });
      } catch (e) {
        results.push({ name: 'Markdown URL丸括弧エンコードテスト', pass: false, detail: e.message });
      }

      try {
        if (!navigator.locks || typeof navigator.locks.request !== 'function') throw new Error('Web Locks API 非対応: キューは安全停止します');
        const nm = 'origin-ultra-diagnostic-' + Date.now();
        const outcome = await navigator.locks.request(nm, { ifAvailable:true }, async l1 => {
          if (!l1) return 'noacq';
          const l2ok = await navigator.locks.request(nm, { ifAvailable:true }, l2 => !!l2);
          return l2ok ? 'dup' : 'ok';
        });
        results.push({ name: '排他制御(取得と競合拒否)テスト', pass: outcome === 'ok', detail: outcome === 'ok' ? '取得成功・同名ロックの二重取得を拒否' : outcome });
      } catch (e) {
        results.push({ name: '排他制御APIの取得テスト', pass: false, detail: e.message });
      }

      let tw = null, testWorkerUrl = null;
      try {
        const testWorkerBlob = new Blob(['self.onmessage = () => self.postMessage("PONG");'], { type: 'text/javascript' });
        testWorkerUrl = URL.createObjectURL(testWorkerBlob);
        tw = new Worker(testWorkerUrl);
        let timeoutId;
        const pong = await new Promise(res => {
          tw.onmessage = e => res(e.data === 'PONG');
          tw.onerror = () => res(false);
          timeoutId = setTimeout(() => res(false), 2000);
          tw.postMessage('PING');
        });
        clearTimeout(timeoutId);
        results.push({ name: 'Web Worker スレッド通信テスト', pass: pong, detail: pong ? 'PONG受信成功' : 'タイムアウト' });
      } catch (e) {
        results.push({ name: 'Web Worker スレッド通信テスト', pass: false, detail: e.message });
      } finally {
        if (tw) { try { tw.terminate(); } catch(_) {} }
        if (testWorkerUrl) { try { URL.revokeObjectURL(testWorkerUrl); } catch(_) {} }
      }

      try {
        const r = await fetch('https://ja.wikipedia.org/w/api.php?action=query&meta=siteinfo&format=json&origin=*', { signal: AbortSignal.timeout(8000) });
        results.push({ name: 'Wikipedia API接続(CSP connect-src)', pass: r.ok, detail: 'HTTP ' + r.status });
      } catch (e) {
        results.push({ name: 'Wikipedia API接続(CSP connect-src)', pass: false, detail: e.message });
      }

      setTestResults(results);
      log('--- [自己診断テスト完了: ' + results.filter(r => r.pass).length + '/' + results.length + ' PASS] ---');
    };

    useEffect(() => {
      const dur = (performance.now() - scriptStartTime).toFixed(1);
      setMountDuration(dur);
    }, []);

    useEffect(() => {
      let alive = true;
      (async () => {
        try {
          const all = await refresh();
          if (!alive) return;
          setDb({ s:'online', m:'' });
          if (all.some(t => ['pending', 'interrupted', 'running'].includes(t.status))) {
            log('未完了タスクを検出、自動再開します');
            startQueue();
          }
        } catch (e) {
          if (alive) setDb({ s:'unavailable', m:e.message });
        }
      })();
      return () => {
        alive = false; stopRef.current = true;
        if (abortRef.current) abortRef.current();
        releaseLock('done');
      };
    }, []);

    useEffect(() => {
      if (!syncCh) return;
      const onMsg = () => { refresh().catch(() => {}); };
      syncCh.addEventListener('message', onMsg);
      return () => syncCh.removeEventListener('message', onMsg);
    }, [refresh]);

    useEffect(() => {
      const f = () => {
        if (!runningRef.current) return;
        if (document.visibilityState === 'hidden') reasonRef.current = 'hidden';
        else { reasonRef.current = 'unknown'; acquireLock(); }
      };
      document.addEventListener('visibilitychange', f);
      return () => document.removeEventListener('visibilitychange', f);
    }, [acquireLock]);

    useEffect(() => {
      if (!running) return;
      const i = setInterval(() => setBeatAgo(beatRef.current ? Math.round((Date.now() - beatRef.current) / 1000) : null), 1000);
      return () => clearInterval(i);
    }, [running]);

    const addTasks = async () => {
      const qs = [...new Set(input.split('\n').map(s => s.trim()).filter(Boolean))].slice(0, 10);
      if (!qs.length) return;
      try {
        const base = Date.now();
        await vault.tx('readwrite', store => {
          qs.forEach((q, i) => {
            store.put({ id:makeTaskId(), query:q, status:'pending', attempts:0, items:null, error:null, createdAt:base + i });
          });
        });
        await refresh(); notifyChanged(); log(qs.length + '件を一括追加しました');
      } catch (e) { log('追加失敗: ' + e.message); }
    };

    const requeueFailed = async () => {
      if (!navigator.locks) { log('Web Locks非対応のため再実行できません'); return; }
      try {
        await navigator.locks.request('origin-ultra-runner', { ifAvailable:true }, async lock => {
          if (!lock) {
            log('【排他制御】他タブがキュー実行中のため、失敗タスクの再キューを安全に拒否しました');
            return;
          }
          try {
            const fresh = await vault.all();
            const failed = fresh.filter(t => t.status === 'failed');
            if (!failed.length) return;
            await vault.tx('readwrite', store => {
              failed.forEach(t => store.put({ ...t, status:'pending', attempts:0, error:null }));
            });
            await refresh(); notifyChanged(); log(failed.length + '件の失敗タスクを再実行キューに戻しました');
          } catch (e) { log('再キュー失敗: ' + e.message); }
        });
      } catch (err) { log('ロック要求例外: ' + err.message); }
    };

    const clearAll = async () => {
      if (!window.confirm('全タスクと保存結果を削除しますか?')) return;
      if (!navigator.locks) { log('Web Locks非対応のため削除できません'); return; }
      try {
        await navigator.locks.request('origin-ultra-runner', { ifAvailable:true }, async lock => {
          if (!lock) {
            log('【排他制御】他タブがキュー実行中のため、全削除を安全に拒否しました');
            return;
          }
          try {
            await vault.clear();
            await refresh();
            notifyChanged();
            log('全データを安全に削除しました');
          } catch (e) { log('削除失敗: ' + e.message); }
        });
      } catch (err) { log('ロック要求例外: ' + err.message); }
    };

    const stop = () => { stopRef.current = true; if (abortRef.current) abortRef.current(); };

    const escapeMdText = text => (text || '').replace(/[\\`*_{}[\]()<>#+\-.!|~]/g, '\\$&');
    const downloadMd = () => {
      const done = tasks.filter(t => t.status === 'done');
      const head = [
        '# ORIGIN 調査メモ', '',
        '- 生成日時: ' + new Date().toLocaleString(),
        '- 情報出典: Wikipedia (日本語版) 検索API',
        '- 帰属表示: ウィキペディアの各執筆者コミュニティ (Wikimedia Foundation)',
        '- ライセンス: [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.ja)',
        '- 免責事項: 本メモはAPIから取得した検索結果スニペットの抜粋であり、完全な記事本文ではありません。', ''
      ];
      const body = done.flatMap(t => [
        '## キーワード: ' + escapeMdText(t.query), '',
        ...(t.items || []).map(i => '- [' + escapeMdText(i.title) + '](' + wikiUrl(i.title) + ') — ' + escapeMdText(i.snippet)),
        ''
      ]);
      const blob = new Blob([[...head, ...body].join('\n')], { type:'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'origin-research-' + Date.now() + '.md';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };

    const actionable = tasks.some(t => ['pending', 'interrupted', 'running'].includes(t.status));
    const doneCount = tasks.filter(t => t.status === 'done').length;
    const dbColor = db.s === 'online' ? 'text-emerald-400' : db.s === 'unavailable' ? 'text-red-400' : 'text-amber-400';
    const btn = 'min-h-[44px] px-4 rounded-xl text-xs font-extrabold disabled:opacity-40 ';

    return h('div', { className: 'min-h-screen relative pb-12' },
      h('div', {
        style: { top: 'calc(env(safe-area-inset-top, 0px) + 12px)' },
        className: 'absolute left-1/2 -translate-x-1/2 z-50 w-[94%] max-w-xl pointer-events-none'
      },
        h('div', { className: 'bg-zinc-950/95 border border-zinc-800 shadow-2xl px-4 py-2.5 rounded-full flex items-center justify-between text-xs' },
          h('span', { className: 'font-mono font-bold text-zinc-200' }, 'ORIGIN ULTRA v16'),
          h('span', { className: 'flex gap-3 font-mono text-[11px]' },
            h('span', { className: dbColor }, 'IndexedDB: ' + (db.s === 'online' ? 'ONLINE' : db.s === 'unavailable' ? 'UNAVAILABLE' : 'INIT')),
            h('span', { className: lockOn ? 'text-emerald-400 font-bold' : 'text-zinc-400' }, 'WakeLock: ' + (lockOn ? 'ACTIVE' : 'OFF'))
          )
        )
      ),
      h('header', {
        style: { paddingTop: 'calc(env(safe-area-inset-top, 0px) + 4.5rem)' },
        className: 'px-4 sm:px-6 pb-3 border-b border-zinc-800 bg-zinc-950 flex flex-wrap items-center justify-between gap-2'
      },
        h('div', null,
          h('h1', { className: 'text-sm font-extrabold' }, '調査タスクキュー ＆ 永続化ランナー'),
          h('p', { className: 'text-xs text-zinc-400 mt-1' }, 'Tailwind CDN完全排除・外部全スクリプトSRI付与済。Wikipedia検索を順次実行しIndexedDBに保存します。')
        ),
        h('button', {
          type: 'button',
          onClick: runSelfDiagnosticTests,
          className: 'min-h-[44px] px-4 bg-zinc-800 text-emerald-300 border border-emerald-500/40 rounded-xl text-xs font-bold'
        }, '🧪 自己診断テストを実行')
      ),
      testResults && h('section', { 'aria-label': 'テスト結果', className: 'max-w-3xl w-full mx-auto px-4 sm:px-6 pt-4' },
        h('div', { className: 'p-4 rounded-2xl bg-zinc-950 border border-emerald-500/40 space-y-2' },
          h('h2', { className: 'text-xs font-bold text-emerald-400' }, 'ブラウザ内 自己診断テスト結果 (スクリプト開始〜初回useEffect実測: ' + (mountDuration ? mountDuration + 'ms' : '計測中') + ')'),
          h('p', { className: 'text-[10px] text-zinc-400' }, '※本診断はブラウザ内基本APIの簡易単体テストであり、外部通信やE2E動作、本番品質を保証するものではありません。'),
          h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs' },
            testResults.map((t, idx) => h('div', { key: idx, className: 'p-2 rounded bg-zinc-900 flex items-center justify-between' },
              h('span', { className: 'text-zinc-300' }, t.name),
              h('span', { className: t.pass ? 'text-emerald-400 font-bold' : 'text-red-400 font-bold' }, t.pass ? '✓ PASS' : '✗ FAIL')
            ))
          )
        )
      ),
      h('main', { className: 'max-w-3xl w-full mx-auto p-4 sm:p-6 space-y-5' },
        h('section', { 'aria-label': '稼働状態', className: 'grid grid-cols-1 sm:grid-cols-3 gap-3' },
          h('div', { className: 'p-4 rounded-2xl bg-zinc-900 border border-zinc-800 flex flex-col justify-between' },
            h('div', null,
              h('div', { className: 'text-xs text-zinc-400' }, 'IndexedDB 状態'),
              h('div', { className: 'text-sm font-bold mt-1 ' + dbColor }, db.s === 'online' ? 'ONLINE (OriginUltraV16)' : db.s === 'unavailable' ? 'UNAVAILABLE' : 'INIT (接続中)'),
              db.s === 'unavailable' && h('p', { className: 'text-[11px] text-red-300 mt-1 break-all' }, db.m)
            ),
            // 条件分岐復元: エラー時のみ再接続ボタンを表示
            db.s === 'unavailable' && h('button', {
              type: 'button',
              onClick: retryDbInit,
              className: 'mt-2 min-h-[44px] px-3.5 bg-red-950 text-red-200 rounded-xl border border-red-800 text-xs font-bold'
            }, '再接続を試行')
          ),
          h('div', { className: 'p-4 rounded-2xl bg-zinc-900 border border-zinc-800' },
            h('div', { className: 'text-xs text-zinc-400' }, 'Screen Wake Lock'),
            h('div', { className: 'text-sm font-bold mt-1 text-zinc-100' }, lockMsg),
            h('div', { className: 'text-[10px] text-zinc-400 mt-1' }, '排他制御: ' + (navigator.locks ? 'Web Locks API (取得時のみ実行)' : '非対応 (安全停止)'))
          ),
          h('div', { className: 'p-4 rounded-2xl bg-zinc-900 border border-zinc-800' },
            h('div', { className: 'text-xs text-zinc-400' }, 'Worker生存ハートビート'),
            h('div', { className: 'text-sm font-bold mt-1 text-zinc-100' }, !running ? '待機中' : beatAgo === null ? '通信中' : beatAgo + '秒前'),
            h('div', { className: 'text-[10px] text-zinc-400 mt-1' }, '6秒無応答で自動強制回収')
          )
        ),
        h('section', { 'aria-label': 'タスク追加', className: 'p-4 rounded-3xl bg-zinc-950 border border-zinc-800 space-y-3' },
          h('label', { htmlFor: 'qs', className: 'block text-xs text-zinc-300' }, '調査キーワード (1行に1件、最大10件)'),
          h('textarea', {
            id: 'qs', rows: 4, value: input,
            onChange: e => setInput(e.target.value),
            className: 'w-full p-3 rounded-2xl bg-zinc-900 border border-zinc-700 text-xs text-zinc-100'
          }),
          h('div', { className: 'flex flex-wrap gap-2' },
            h('button', { type: 'button', onClick: addTasks, disabled: db.s !== 'online', className: btn + 'bg-zinc-800 text-zinc-100' }, 'キューに追加'),
            h('button', { type: 'button', onClick: startQueue, disabled: running || !actionable, className: btn + 'bg-emerald-500 text-black' }, '実行 / 再開'),
            h('button', { type: 'button', onClick: stop, disabled: !running, className: btn + 'bg-amber-500 text-black' }, '停止'),
            h('button', { type: 'button', onClick: requeueFailed, disabled: running || !tasks.some(t => t.status === 'failed'), className: btn + 'bg-zinc-800 text-zinc-100' }, '失敗を再実行'),
            h('button', { type: 'button', onClick: downloadMd, disabled: !doneCount, className: btn + 'bg-zinc-800 text-zinc-100' }, 'Markdown保存'),
            h('button', { type: 'button', onClick: clearAll, disabled: running || !tasks.length, className: btn + 'bg-red-900 text-red-100' }, '全削除')
          )
        ),
        h('section', { 'aria-label': 'タスク一覧', className: 'space-y-3' },
          h('h2', { className: 'text-xs text-zinc-400' }, '登録タスク ' + tasks.length + '件 / 完了 ' + doneCount + '件'),
          tasks.length === 0 && h('p', { className: 'text-xs text-zinc-400' }, 'タスクはまだありません。'),
          h('ul', { className: 'space-y-3', 'aria-live': 'polite' },
            tasks.map(t => h('li', { key: t.id, className: 'p-4 rounded-2xl bg-zinc-950 border border-zinc-800' },
              h('div', { className: 'flex flex-wrap items-center gap-2' },
                h('span', { className: 'text-[11px] px-2 py-0.5 rounded-full font-bold ' + BADGE[t.status] }, STATUS[t.status]),
                h('span', { className: 'text-sm font-bold break-all' }, t.query),
                h('span', { className: 'text-[11px] text-zinc-400' }, '試行 ' + t.attempts + '/' + MAX_ATTEMPTS)
              ),
              t.error && t.status !== 'done' && h('p', { className: 'text-xs text-red-300 mt-2 break-all' }, '直近のエラー: ' + t.error),
              t.items && h('ul', { className: 'mt-2 space-y-2' },
                t.items.map((i, k) => h('li', { key: k, className: 'text-xs' },
                  h('a', { href: wikiUrl(i.title), target: '_blank', rel: 'noopener noreferrer', className: 'text-emerald-300 underline' }, i.title),
                  h('p', { className: 'text-zinc-400 mt-0.5' }, i.snippet)
                ))
              )
            ))
          )
        ),
        h('section', { 'aria-label': '実行ログ' },
          h('h2', { className: 'text-xs text-zinc-400 mb-1.5' }, '実行ログ (画面表示中のみ保持)'),
          h('div', { role: 'log', 'aria-live': 'polite', className: 'p-3 rounded-2xl bg-black border border-zinc-800 font-mono text-xs text-emerald-400 h-44 overflow-y-auto space-y-1' },
            logs.length === 0 && h('div', { className: 'text-zinc-400' }, 'ログはまだありません。'),
            logs.map((l, i) => h('div', { key: i }, l))
          )
        ),
        h('p', { className: 'text-xs text-zinc-400 leading-relaxed bg-zinc-900/50 p-4 rounded-2xl border-l-4 border-emerald-500' },
          '【動作制約の開示】1タスクはWikipedia検索の上位3件(タイトルと抜粋)を取得するものであり、本文の全文要約は行いません。' +
          '実行中は画面の点灯維持を試みますが、前面表示・充電・画面ONが前提です。蓋を閉じたPCやスマホのバックグラウンドでは停止します。' +
          '停止した場合は、次回このページを開いた際に未完了タスクを自動で再開します。' +
          'データはこの端末のIndexedDBのみに保存され、サイトデータの消去やSafariの自動削除で失われることがあります。' +
          'v16: Tailwind CDN完全排除・インラインCSS化。全外部スクリプト(React/ReactDOM)にcdnjs公式SRIハッシュ(sha512)付与済。Web Locks非対応時は安全停止します。'
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(Boundary, null, h(App)));
})();
</script>
</body>
</html>
