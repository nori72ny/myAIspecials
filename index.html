<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ORIGIN Personal</title>
    <link rel="manifest" href="/manifest.json?v=ribbon-20261108" />
    <link rel="icon" type="image/png" href="/favicon.png?v=ribbon-20261108" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/favicon-dark.png?v=ribbon-20261108" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=ribbon-20261108" />
    <meta name="theme-color" content="#ffffff" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <style>
      /* Pre-mount splash: painted from this document alone so the first
         screen is never a blank white page while the JS bundle loads.
         React replaces #root wholesale on mount, and the app then shows
         its own splash (SplashScreen) over the same white surface, so
         this stays minimal — background, brand mark, wordmark — in step
         with splash-brand.css (mark 53px, navy #182d5f / slate #4f6c9b,
         gold #d7b253). The dark branch only follows the OS color scheme
         (the app theme itself is a stored setting the document cannot
         know yet); it uses the same deep navy the app writes to the
         theme-color meta when its dark theme resolves. */
      html {
        background: #ffffff;
      }
      .origin-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #ffffff;
      }
      .origin-boot-splash__inner {
        display: grid;
        justify-items: center;
        gap: 18px;
      }
      .origin-boot-splash__lockup {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        line-height: 1;
        user-select: none;
      }
      .origin-boot-splash__mark {
        display: block;
        width: 53px;
        height: 53px;
        filter: drop-shadow(0 12px 24px rgb(9 34 76 / 22%));
        -webkit-user-drag: none;
      }
      .origin-boot-splash__word {
        font-family: "M PLUS Rounded 1c", "Noto Sans JP", system-ui, sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: .03em;
        white-space: nowrap;
        color: #182d5f;
      }
      .origin-boot-splash__word-accent {
        color: #4f6c9b;
      }
      /* Loading status (external evaluation fix, 2026-11-25): the
         gold pulse bar alone did not read as "loading" — under a
         slow network the splash showed only a faint mark, with no
         words at all. A navy spinner and the words 読み込んでいます
         now sit under the lockup, matching the React splash
         (ultra-optics.css) that replaces this one on mount. */
      .origin-boot-splash__status {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .origin-boot-splash__spinner {
        width: 22px;
        height: 22px;
        flex: none;
        border-radius: 999px;
        border: 3px solid rgb(24 45 95 / 18%);
        border-top-color: #182d5f;
        animation: origin-boot-spin .9s linear infinite;
      }
      .origin-boot-splash__status-text {
        font-family: "M PLUS Rounded 1c", "Noto Sans JP", system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: .02em;
        color: #182d5f;
      }
      @keyframes origin-boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (max-width: 640px) {
        .origin-boot-splash__lockup {
          gap: 8px;
        }
        .origin-boot-splash__mark {
          width: 43px;
          height: 43px;
        }
        .origin-boot-splash__word {
          font-size: 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .origin-boot-splash__spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="origin-boot-splash" role="status" aria-label="ORIGIN を起動しています">
        <div class="origin-boot-splash__inner">
          <span class="origin-boot-splash__lockup">
            <img class="origin-boot-splash__mark" src="/brand/origin-ribbon-o.webp?v=ribbon-20261122" alt="" draggable="false" />
            <span class="origin-boot-splash__word" aria-hidden="true">ORI<span class="origin-boot-splash__word-accent">GIN</span></span>
          </span>
          <span class="origin-boot-splash__status" aria-hidden="true">
            <span class="origin-boot-splash__spinner"></span>
            <span class="origin-boot-splash__status-text">読み込んでいます</span>
          </span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
