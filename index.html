  class Vault {
    constructor(){ this.p = null; }
    open(){
      if (!window.indexedDB) {
        this.p = null;
        return Promise.reject(new Error('IndexedDB非対応ブラウザです'));
      }
      if (this.p) return this.p;

      this.p = new Promise((res, rej) => {
        let isBlocked = false;
        const rq = indexedDB.open('OriginUltraV16', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('tasks', { keyPath:'id' });
        rq.onblocked = () => {
          isBlocked = true;
          rej(new Error('旧バージョンのタブが開いているためブロックされました。他タブを閉じてください'));
        };
        rq.onsuccess = () => {
          if (isBlocked) { try { rq.result.close(); } catch(_) {} return; }
          rq.result.onversionchange = () => {
            try { rq.result.close(); } catch(_) {}
            this.p = null;
          };
          rq.result.onclose = () => { this.p = null; };
          res(rq.result);
        };
        rq.onerror = () => rej(rq.error || new Error('IndexedDB接続失敗'));
      }).catch(err => {
        this.p = null;
        throw err;
      });

      return this.p;
    }
    reset(){ this.p = null; }
    async tx(mode, fn){
      const db = await this.open();
      return new Promise((res, rej) => {
        let t, out;
        try {
          t = db.transaction('tasks', mode);
          out = fn(t.objectStore('tasks'));
        } catch (e) { this.p = null; return rej(e instanceof Error ? e : new Error(String(e))); }

    put(task){ return this.tx('readwrite', s => s.put(task)); }
