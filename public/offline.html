<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f4765" />
    <title>ORIGIN — オフライン</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f7f6f2; color: #182027; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 480px; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 16px; display: grid; place-items: center; background: #1f4765; color: white; font: 700 28px Georgia, serif; }
      h1 { font-size: 24px; margin: 0 0 16px; }
      p { color: #5f676e; line-height: 1.8; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">O</div>
      <h1>現在オフラインです</h1>
      <p>インターネットに接続してから、もう一度お試しください。オフライン中はAIを利用できません。</p>
    </main>
  </body>
</html>
